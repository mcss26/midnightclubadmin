<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Pagos</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .pay-card { 
        background: #111; border: 1px solid #333; padding: 15px; border-radius: 8px; 
        margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        border-left: 4px solid #444; transition: transform 0.2s;
    }
    .pay-card:hover { transform: translateX(5px); }
    
    .status-vencido { border-left-color: var(--mc-red); }
    .status-hoy { border-left-color: var(--mc-accent-gold); }
    .status-ok { border-left-color: var(--mc-accent-green); }

    .amount-display { font-family: monospace; font-size: 16px; font-weight: 700; color: #fff; }
    
    .date-badge { 
        font-size: 10px; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; font-weight: 800; display: inline-block; margin-top: 5px;
    }
    .bg-red { background: rgba(232, 55, 47, 0.2); color: #e8372f; }
    .bg-gold { background: rgba(255, 215, 0, 0.2); color: #FFD700; }
    .bg-green { background: rgba(205, 251, 62, 0.2); color: #cdfb3e; }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-accent-gold);">TESORERÍA</span></div>
    <div style="display:flex; gap:10px;">
        <span id="roleBadge" style="font-size:10px; color:#888; padding:5px;"></span>
        <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
    </div>
  </header>

  <div class="admin-container">
    <div class="section-header">
        <div>
            <h2 class="section-title">Calendario de Pagos</h2>
            <p style="color:#666; font-size:12px;">Deuda Pendiente</p>
        </div>
        <div style="text-align:right;">
            <div style="font-size:10px; color:#888;">TOTAL A PAGAR</div>
            <div id="totalDebt" style="font-size:20px; font-weight:900; color:#fff;">$ 0</div>
        </div>
    </div>

    <div id="payList"><div class="loading-state">Cargando vencimientos...</div></div>
  </div>

  <div id="payModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Confirmar Pago</h3>
        <p id="payDetail" style="color:#888; font-size:12px; margin-bottom:20px;">...</p>
        <input type="hidden" id="payId">
        
        <label class="input-label">MÉTODO DE PAGO</label>
        <select id="payMethod" class="modal-select">
            <option value="TRANSFERENCIA">Transferencia / Banco</option>
            <option value="EFECTIVO">Efectivo (Caja Fuerte)</option>
            <option value="CHEQUE">Cheque</option>
        </select>

        <label class="input-label">FECHA REAL PAGO</label>
        <input type="date" id="payDate" class="modal-input">

        <div class="modal-btns">
            <button onclick="closeModal()" class="btn-modal-cancel">CANCELAR</button>
            <button onclick="doPay()" class="btn-modal-save" style="background:var(--mc-accent-green); color:#000;">PAGAR</button>
        </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const user = localStorage.getItem('mc_admin_user');
    document.getElementById('roleBadge').innerText = user;
    document.getElementById('payDate').valueAsDate = new Date();

    window.onload = loadPayments;

    async function loadPayments() {
        // Traer solo facturas impagas (received)
        const { data } = await client.from('purchase_orders')
            .select('*, suppliers(name, category)')
            .eq('status', 'received')
            .order('due_date'); // Ordenar por vencimiento
        
        renderList(data || []);
    }

    function renderList(list) {
        const c = document.getElementById('payList');
        if(!list.length) { 
            c.innerHTML = '<div class="empty-state">🎉 No hay deudas pendientes.</div>'; 
            document.getElementById('totalDebt').innerText = '$ 0';
            return; 
        }

        let total = 0;
        const today = new Date().toISOString().split('T')[0];

        c.innerHTML = list.map(o => {
            total += o.total_amount;
            
            // Lógica de Semáforo
            let statusClass = 'status-ok';
            let badgeClass = 'bg-green';
            let label = 'EN FECHA';

            if (o.due_date < today) {
                statusClass = 'status-vencido'; badgeClass = 'bg-red'; label = 'VENCIDO';
            } else if (o.due_date === today) {
                statusClass = 'status-hoy'; badgeClass = 'bg-gold'; label = 'VENCE HOY';
            }

            return `
            <div class="pay-card ${statusClass}">
                <div>
                    <div style="font-weight:700; color:#fff;">${o.suppliers?.name}</div>
                    <div style="font-size:11px; color:#666; margin-top:2px;">${o.suppliers?.category} • Vence: ${o.due_date}</div>
                    <span class="date-badge ${badgeClass}">${label}</span>
                </div>
                <div style="text-align:right;">
                    <div class="amount-display">$${o.total_amount.toLocaleString()}</div>
                    <button onclick="openPay(${o.id}, '${o.suppliers?.name}', ${o.total_amount})" style="background:#222; border:1px solid #444; color:#fff; padding:6px 12px; border-radius:4px; font-size:10px; cursor:pointer; margin-top:8px; font-weight:700;">PAGAR 💸</button>
                </div>
            </div>`;
        }).join('');

        document.getElementById('totalDebt').innerText = '$ ' + total.toLocaleString();
    }

    // Modal Logic
    function openPay(id, name, amount) {
        document.getElementById('payId').value = id;
        document.getElementById('payDetail').innerText = `Pagando a ${name} ($${amount})`;
        document.getElementById('payModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('payModal').style.display = 'none'; }

    async function doPay() {
        const id = document.getElementById('payId').value;
        const method = document.getElementById('payMethod').value;
        const date = document.getElementById('payDate').value;

        if(!confirm(`¿Confirmar pago en ${method}? Esto impactará la caja/banco.`)) return;

        await client.from('purchase_orders').update({
            status: 'paid',
            payment_method: method,
            paid_at: new Date().toISOString() // O usar la fecha seleccionada 'date'
        }).eq('id', id);

        closeModal();
        loadPayments();
    }
  </script>
</body>
</html>
