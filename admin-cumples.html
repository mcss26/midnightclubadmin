<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Midnight Admin — Cumpleaños</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-red);">ADMIN</span></div>
    <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
  </header>

  <div class="admin-container">
    <div class="section-header">
        <h2 class="section-title">Cumpleaños de la Semana</h2>
        <button onclick="sendPromo()" class="btn-refresh" style="background:#fff; color:#000;">ENVIAR PACK 🎁</button>
    </div>
    
    <div id="bday-list" class="dashboard-grid">
        <div class="loading-state">Calculando fechas...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    window.onload = loadBirthdays;

    async function loadBirthdays() {
        const { data } = await client.from('members').select('*').eq('status','activo');
        if(!data) return;

        const today = new Date();
        const currentDay = today.getDay(); 
        const dayAdjusted = currentDay === 0 ? 7 : currentDay; 
        const monday = new Date(today); monday.setDate(today.getDate() - (dayAdjusted - 1)); monday.setHours(0,0,0,0);
        const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);

        const list = data.filter(m => {
            if (!m.nacimiento || m.nacimiento.length < 5) return false;
            let bMonth, bDay;
            if (m.nacimiento.includes('-')) { const p = m.nacimiento.split('-'); bMonth = parseInt(p[1],10)-1; bDay = parseInt(p[2],10); } 
            else if (m.nacimiento.includes('/')) { const p = m.nacimiento.split('/'); bMonth = parseInt(p[1],10)-1; bDay = parseInt(p[0],10); } 
            else return false;
            const bdayThisYear = new Date(today.getFullYear(), bMonth, bDay);
            return bdayThisYear >= monday && bdayThisYear <= sunday;
        });

        const container = document.getElementById('bday-list');
        if(list.length === 0) { container.innerHTML = '<div class="empty-state">No hay cumpleaños esta semana.</div>'; return; }

        container.innerHTML = list.map(m => `
            <div class="dash-card" style="height:auto; min-height:100px;">
                <h3 class="dash-title" style="color:var(--mc-accent-gold);">${m.nombre}</h3>
                <div class="dash-desc">🎂 ${m.nacimiento}</div>
                <div class="dash-desc" style="margin-top:10px;">${m.email}</div>
            </div>
        `).join('');
    }

    function sendPromo() {
        alert("Función de envío masivo en desarrollo. Por ahora contactar manualmente.");
    }
  </script>
</body>
</html>
