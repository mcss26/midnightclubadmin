<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Órdenes de Pago</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .inbox-section { background: #1a1a1a; border: 1px solid var(--mc-accent-blue); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .req-card { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #444; padding: 10px 0; }
    .tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #333; }
    .tab-btn { background:none; border:none; color:#666; padding:15px 5px; cursor:pointer; font-size:14px; border-bottom:2px solid transparent; font-weight:700; text-transform: uppercase; }
    .tab-btn.active { color:#fff; border-color:var(--mc-accent-green); }
    .card-form { background:#111; border:1px solid #333; padding:20px; border-radius:12px; max-width:800px; margin:0 auto; }
    .item-row { display:grid; grid-template-columns: 3fr 1fr 1fr 30px; gap:10px; margin-bottom:10px; }
    .modal-input, .modal-select { width:100%; background:#000; border:1px solid #333; color:#fff; padding:10px; border-radius:4px; box-sizing:border-box; }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: #FFD700;">FINANZAS</span></div>
    <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
  </header>

  <div class="admin-container">
    
    <div id="inboxRequests" class="inbox-section" style="display:none;">
        <h3 style="color:var(--mc-accent-blue); margin:0 0 10px 0; font-size:14px;">📬 SOLICITUDES PENDIENTES</h3>
        <div id="reqList"></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('new', this)">NUEVA ORDEN</button>
        <button class="tab-btn" onclick="switchTab('hist', this)">HISTORIAL</button>
    </div>

    <div id="view-new">
        <div class="card-form">
            <h3 style="margin-top:0; color:#fff;">Registrar Compra</h3>
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div><label class="input-label">PROVEEDOR</label><select id="ordSupp" class="modal-select"></select></div>
                <div><label class="input-label">EMISIÓN</label><input type="date" id="ordDate" class="modal-input"></div>
                <div><label class="input-label">VENCIMIENTO</label><input type="date" id="ordDue" class="modal-input"></div>
            </div>
            
            <div id="itemsCont"></div>
            <button onclick="addItemRow()" style="color:#888; background:none; border:none; cursor:pointer; margin-top:10px;">+ AGREGAR ÍTEM</button>
            <div style="text-align:right; font-size:24px; font-weight:900; color:#fff; margin-top:20px;" id="calcTotal">$ 0</div>
            
            <button onclick="saveOrder()" class="btn-primary" style="width:100%; padding:15px; margin-top:20px;">CONFIRMAR CARGA 💾</button>
        </div>
    </div>

    <div id="view-hist" style="display:none;">
        <div id="histList"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let supps=[], skus=[];

    window.onload = async () => {
        const [s, i, r] = await Promise.all([
            client.from('suppliers').select('*').order('name'),
            client.from('inventory_skus').select('*').order('name'),
            client.from('purchase_orders').select('*, purchase_items(sku_id, quantity_ordered, inventory_skus(name))').eq('status','requested')
        ]);
        supps = s.data||[]; skus = i.data||[];
        
        // Render Selects
        document.getElementById('ordSupp').innerHTML = '<option value="">Seleccionar...</option>' + supps.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
        document.getElementById('ordDate').valueAsDate = new Date();
        
        // Render Requests
        if(r.data && r.data.length) {
            document.getElementById('inboxRequests').style.display = 'block';
            document.getElementById('reqList').innerHTML = r.data.map(req => 
                `<div class="req-card"><div>#${req.id} - ${req.purchase_items.length} items</div><button onclick="approveReq(${req.id})">PROCESAR</button></div>`
            ).join('');
        }

        // LÓGICA AUTO-LOAD (Desde Depósito)
        const params = new URLSearchParams(window.location.search);
        if(params.get('auto') === 'true') {
            const skuId = params.get('sku');
            const qty = params.get('qty');
            const supId = params.get('sup');
            
            // Autoseleccionar Proveedor
            if(supId) document.getElementById('ordSupp').value = supId;
            
            // Autocargar Item
            const d = document.createElement('div'); d.className='item-row';
            const skuObj = skus.find(x=>x.id==skuId);
            d.innerHTML = `<select class="modal-select sku-sel"><option value="${skuId}">${skuObj?.name}</option></select><input type="number" class="modal-input qty" value="${qty}" oninput="calc()"><input type="number" class="modal-input cost" value="${skuObj?.cost_price||0}" oninput="calc()"><button onclick="this.parentElement.remove();calc()">✕</button>`;
            document.getElementById('itemsCont').appendChild(d);
            calc();
        } else {
            addItemRow(); 
        }
    };

    window.addItemRow = () => {
        const d = document.createElement('div'); d.className='item-row';
        d.innerHTML = `<select class="modal-select sku-sel"><option value="">Item...</option>${skus.map(s=>`<option value="${s.id}" data-c="${s.cost_price}">${s.name}</option>`).join('')}</select><input type="number" class="modal-input qty" placeholder="Cant" oninput="calc()"><input type="number" class="modal-input cost" placeholder="$" oninput="calc()"><button onclick="this.parentElement.remove();calc()" style="background:none; border:none; color:#f55;">✕</button>`;
        document.getElementById('itemsCont').appendChild(d);
    }
    
    window.calc = () => {
        let t=0; document.querySelectorAll('.item-row').forEach(r=>{ t+=(r.querySelector('.qty').value*r.querySelector('.cost').value)||0; });
        document.getElementById('calcTotal').innerText = '$ '+t.toLocaleString();
    }

    // (Aquí va tu función saveOrder() existente, no cambia)
    async function saveOrder() { alert("Función de guardado igual a versión anterior."); } // Placeholder para no alargar
    
    // (Resto de funciones approveReq, switchTab, etc. iguales a la versión anterior)
    window.approveReq = async (id) => { /* Misma lógica de versión anterior */ }
    function switchTab(v,b) { document.getElementById('view-new').style.display=v==='new'?'block':'none'; document.getElementById('view-hist').style.display=v==='hist'?'block':'none'; }
  </script>
</body>
</html>
