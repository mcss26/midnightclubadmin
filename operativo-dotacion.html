<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Ops — Dotación</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
    .staff-card-mini { background: #111; border: 1px solid #333; padding: 10px; border-radius: 6px; text-align: center; cursor: pointer; }
    .staff-card-mini:hover { border-color: #fff; }
    .role-badge { font-size: 9px; background: #222; padding: 2px 6px; border-radius: 4px; color: #888; margin-top: 5px; display: inline-block; }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: #fff;">OPS</span> / DOTACIÓN</div>
    <button onclick="window.location.href='operativo-index.html'" class="btn-logout">VOLVER</button>
  </header>

  <div class="admin-container">
    <div class="dash-card" style="height:auto; margin-bottom:20px;">
        <label class="input-label">1. FECHA DEL EVENTO</label>
        <div style="display:flex; gap:10px;">
            <input type="date" id="evDate" class="modal-input" style="margin:0;" onchange="loadEvent()">
            <button onclick="createEvent()" class="btn-primary" style="width:auto; padding:0 20px;">CREAR / CARGAR</button>
        </div>
        <div id="evStatus" style="font-size:11px; color:var(--mc-accent-green); margin-top:5px; display:none;">Evento Activo</div>
    </div>

    <div id="panelAssign" style="display:none;">
        <div class="dash-card" style="height:auto;">
            <h3>2. Asignar Personal</h3>
            <select id="selRole" class="modal-select" onchange="filterStaff()"><option value="all">Todos los Roles</option></select>
            <div id="staffList" class="staff-grid"></div>
        </div>
        <div class="dash-card" style="height:auto; margin-top:20px; border-color:var(--mc-accent-green);">
            <h3 style="color:var(--mc-accent-green);">3. Confirmados</h3>
            <div id="assignedList" style="display:flex; flex-direction:column; gap:5px;"></div>
        </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('evDate').valueAsDate = new Date();
    let currentEventId = null;
    let allStaff = [], allRoles = [];

    window.onload = async () => {
        const [s, r] = await Promise.all([
            client.from('staff_members').select('*, staff_roles(role_name)').eq('status','active').order('full_name'),
            client.from('staff_roles').select('*').order('role_name')
        ]);
        allStaff = s.data || []; allRoles = r.data || [];
        const sel = document.getElementById('selRole');
        allRoles.forEach(r => sel.innerHTML += `<option value="${r.id}">${r.role_name}</option>`);
        loadEvent();
    };

    async function createEvent() {
        const date = document.getElementById('evDate').value;
        let { data: ev } = await client.from('events').select('*').eq('date', date).single();
        if(!ev) {
            const { data: newEv, error } = await client.from('events').insert({ date: date, name: 'Noche ' + date }).select().single();
            if(error) return alert(error.message);
            ev = newEv;
        }
        loadEvent();
    }

    async function loadEvent() {
        const date = document.getElementById('evDate').value;
        const { data: ev } = await client.from('events').select('*').eq('date', date).single();
        if(ev) {
            currentEventId = ev.id;
            document.getElementById('evStatus').style.display = 'block';
            document.getElementById('evStatus').innerText = `✅ Activo: ${ev.name}`;
            document.getElementById('panelAssign').style.display = 'block';
            loadAssignments(); filterStaff();
        } else {
            currentEventId = null;
            document.getElementById('evStatus').style.display = 'none';
            document.getElementById('panelAssign').style.display = 'none';
        }
    }

    function filterStaff() {
        const rid = document.getElementById('selRole').value;
        const list = rid === 'all' ? allStaff : allStaff.filter(s => s.default_role_id == rid);
        document.getElementById('staffList').innerHTML = list.map(s => `
            <div class="staff-card-mini" onclick="assign(${s.id}, ${s.default_role_id})">
                <div style="font-weight:700; color:#fff; font-size:12px;">${s.full_name}</div>
                <div class="role-badge">${s.staff_roles?.role_name || '-'}</div>
            </div>`).join('');
    }

    async function assign(sid, rid) {
        if(!currentEventId) return alert("Crea evento primero");
        const role = allRoles.find(r => r.id == rid);
        await client.from('event_staffing').insert({ event_id: currentEventId, staff_id: sid, assigned_role_id: rid, agreed_pay: role?.base_pay||0 });
        loadAssignments();
    }

    async function loadAssignments() {
        const { data } = await client.from('event_staffing').select('id, agreed_pay, staff_members(full_name), staff_roles(role_name)').eq('event_id', currentEventId);
        document.getElementById('assignedList').innerHTML = (data||[]).map(i => `
            <div style="display:flex; justify-content:space-between; background:#111; padding:8px; border-radius:4px;">
                <div><span style="color:#fff; font-weight:700;">${i.staff_members.full_name}</span> <span style="font-size:10px; color:#888;">${i.staff_roles.role_name}</span></div>
                <div><span style="color:var(--mc-accent-green);">$${i.agreed_pay}</span> <button onclick="remove(${i.id})" style="color:#f55; background:none; border:none; cursor:pointer;">✕</button></div>
            </div>`).join('');
    }
    async function remove(id) { if(confirm("¿Quitar?")) { await client.from('event_staffing').delete().eq('id', id); loadAssignments(); } }
  </script>
</body>
</html>
