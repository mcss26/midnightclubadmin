<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Staff — Cierre</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="admin-header" style="background:#111;">
    <div class="admin-logo">MIDNIGHT<span style="color: #fff;">STAFF</span></div>
    <button onclick="window.location.href='index.html'" class="btn-logout">SALIR</button>
  </header>

  <div class="admin-container" style="max-width:400px; margin-top:20px;">
    
    <h2 style="font-family:'Outfit'; text-align:center; margin-bottom:20px; color:#fff;">DECLARACIÓN CIEGA</h2>

    <div class="dash-card" style="height:auto; padding:25px; border:1px solid #333;">
        
        <div style="text-align:center; margin-bottom:20px;">
            <div id="staffName" style="color:#fff; font-weight:700; font-size:16px;">--</div>
            <div style="font-size:10px; color:#888;">RESPONSABLE</div>
        </div>

        <label class="input-label">1. SELECCIONA TU CAJA</label>
        <select id="termSelect" class="modal-select" style="margin-bottom:20px;">
            <option value="">Cargando...</option>
        </select>

        <div style="border-top:1px dashed #333; margin-bottom:20px;"></div>

        <label class="input-label" style="color:var(--mc-accent-green);">2. EFECTIVO (BILLETES EN MANO)</label>
        <input type="number" id="cashInput" class="modal-input" placeholder="$ 0" style="font-size:24px; text-align:center; font-weight:700; color:var(--mc-accent-green); margin-bottom:20px; border-color:var(--mc-accent-green);">

        <label class="input-label" style="color:var(--mc-accent-blue);">3. LOTE ZOCO (DIGITAL)</label>
        <input type="number" id="zocoInput" class="modal-input" placeholder="$ 0" style="font-size:18px; text-align:center; font-weight:700; color:var(--mc-accent-blue); margin-bottom:20px; border-color:var(--mc-accent-blue);">

        <label class="input-label" style="color:var(--mc-red);">4. RETIROS / VALES (SALIDAS)</label>
        <input type="number" id="withdrawInput" class="modal-input" placeholder="$ 0" style="font-size:18px; text-align:center; font-weight:700; color:var(--mc-red); margin-bottom:20px; border-color:var(--mc-red);">

        <button onclick="submitClose()" class="btn-primary" style="width:100%; padding:15px; font-size:16px; margin-top:10px;">CONFIRMAR Y CERRAR 🔒</button>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const user = localStorage.getItem('mc_admin_user');
    if(!user) window.location.href = 'index.html';
    document.getElementById('staffName').innerText = user.toUpperCase();

    window.onload = async () => {
        // Cargar Terminales activas
        const { data } = await client.from('pos_terminals').select('friendly_name').order('friendly_name');
        const sel = document.getElementById('termSelect');
        if(data) {
            const unique = [...new Set(data.map(i => i.friendly_name))];
            sel.innerHTML = unique.map(n => `<option value="${n}">${n}</option>`).join('');
        }
    };

    async function submitClose() {
        const term = document.getElementById('termSelect').value;
        const cash = document.getElementById('cashInput').value;
        const zoco = document.getElementById('zocoInput').value || 0;
        const withdr = document.getElementById('withdrawInput').value || 0;

        if(!cash) return alert("⚠️ Debes ingresar el efectivo contado (aunque sea 0).");
        
        const msg = `CONFIRMA TU CIERRE:\n\nCaja: ${term}\n💵 Efectivo: $${cash}\n💳 Zoco: $${zoco}\n📤 Retiros: $${withdr}`;
        if(!confirm(msg)) return;

        const btn = document.querySelector('.btn-primary');
        btn.disabled = true; btn.innerText = "ENVIANDO...";

        try {
            const today = new Date().toISOString().split('T')[0];

            // 1. Verificar cabecera del día
            let { data: head } = await client.from('cash_closings').select('id').eq('event_date', today).single();
            
            if(!head) {
                const { data: newHead, error } = await client.from('cash_closings').insert({ event_date: today, status: 'open' }).select().single();
                if(error) throw error;
                head = newHead;
            }

            // 2. Upsert con TODOS los datos
            // Mapeamos: 
            // - cashInput -> final_count_cash
            // - zocoInput -> zoco_digital
            // - withdrawInput -> cash_withdrawals (Unificamos retiros y vales aquí para simplificar)
            
            const payload = {
                closing_id: head.id,
                terminal_name: term,
                final_count_cash: parseFloat(cash),
                zoco_digital: parseFloat(zoco),
                cash_withdrawals: parseFloat(withdr),
                updated_at: new Date()
            };

            const { error: err2 } = await client.from('closing_terminals').upsert(payload, { onConflict: 'closing_id, terminal_name' });
            
            if(err2) {
                // Fallback manual si no hay constraint único configurado
                await client.from('closing_terminals').delete().eq('closing_id', head.id).eq('terminal_name', term);
                await client.from('closing_terminals').insert(payload);
            }

            alert("✅ Cierre enviado correctamente.");
            window.location.href = 'index.html';

        } catch(e) {
            alert("Error: " + e.message);
            btn.disabled = false; btn.innerText = "CONFIRMAR Y CERRAR 🔒";
        }
    }
  </script>
</body>
</html>
