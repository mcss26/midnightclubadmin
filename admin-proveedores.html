<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Proveedores</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* CHIPS DE FILTRO */
    .chip-container { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .chip-option {
        background: #000; border: 1px solid #444; color: #888; 
        padding: 10px 15px; text-align: center; border-radius: 20px; cursor: pointer;
        font-size: 10px; font-weight: 700; text-transform: uppercase;
    }
    .chip-option.selected { background: #fff; color: #000; border-color: #fff; }

    /* TAGS EN TARJETAS */
    .tag-cat { font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: 700; text-transform: uppercase; margin-left: 8px; border: 1px solid; }
    .cat-INSUMOS { color: #cdfb3e; border-color: #cdfb3e; }
    .cat-SERVICIOS { color: #00eaff; border-color: #00eaff; }
    .cat-LEGALES { color: #e8372f; border-color: #e8372f; }
    .cat-TERCERIZADOS { color: #FFD700; border-color: #FFD700; }

    /* CARD ESTILO AGENDA */
    .contact-card { 
        background: #111; border: 1px solid #333; border-radius: 8px; padding: 15px; 
        display: flex; justify-content: space-between; align-items: center;
    }
    .contact-info { display: flex; flex-direction: column; gap: 4px; }
    .contact-name { color: #fff; font-weight: 700; font-size: 14px; }
    .contact-meta { color: #666; font-size: 11px; font-family: monospace; }
    .bank-info { margin-top: 5px; padding: 5px; background: #050505; border: 1px dashed #333; border-radius: 4px; font-size: 10px; color: #888; display: inline-block; }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: #fff;">AGENDA</span></div>
    <div style="display:flex; gap:10px;">
        <span id="roleBadge" style="font-size:10px; color:#888; padding:5px;"></span>
        <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
    </div>
  </header>

  <div class="admin-container">
    
    <div class="section-header">
        <h2 class="section-title">Directorio</h2>
        <button onclick="modalSupp()" class="btn-refresh" style="background:#fff; color:#000; font-weight:800;">+ NUEVO</button>
    </div>

    <div class="chip-container">
        <div class="chip-option selected" onclick="filterSupp('all', this)">TODOS</div>
        <div class="chip-option" onclick="filterSupp('INSUMOS', this)">INSUMOS</div>
        <div class="chip-option" onclick="filterSupp('SERVICIOS', this)">SERVICIOS</div>
        <div class="chip-option" onclick="filterSupp('LEGALES', this)">LEGALES</div>
        <div class="chip-option" onclick="filterSupp('TERCERIZADOS', this)">TERCERIZADOS</div>
    </div>

    <div id="suppList" class="data-list">
        <div class="loading-state">Cargando agenda...</div>
    </div>

  </div>

  <div id="suppModal" class="modal-overlay">
    <div class="modal-box">
        <h3 style="color:#fff; margin-top:0;">Datos Proveedor</h3>
        <input type="hidden" id="sId">
        
        <label class="input-label">Categoría</label>
        <select id="sCat" class="modal-select">
            <option value="INSUMOS">INSUMOS</option>
            <option value="SERVICIOS">SERVICIOS</option>
            <option value="LEGALES">LEGALES</option>
            <option value="TERCERIZADOS">TERCERIZADOS</option>
        </select>

        <input type="text" id="sName" class="modal-input" placeholder="Nombre / Empresa">
        <input type="text" id="sContact" class="modal-input" placeholder="Teléfono / Contacto">
        
        <div style="display:grid; grid-template-columns: 1fr 2fr; gap:10px;">
            <input type="text" id="sBank" class="modal-input" placeholder="Banco">
            <input type="text" id="sCbu" class="modal-input" placeholder="CBU / Alias">
        </div>

        <label class="input-label">Condición de Pago Habitual</label>
        <select id="sTerms" class="modal-select">
            <option value="Contado">Contado</option>
            <option value="Cta Corriente">Cta Corriente</option>
        </select>

        <div class="modal-btns">
            <button onclick="closeModal()" class="btn-modal-cancel">CANCELAR</button>
            <button onclick="saveSupp()" class="btn-modal-save">GUARDAR</button>
        </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const user = localStorage.getItem('mc_admin_user');
    document.getElementById('roleBadge').innerText = user;
    
    let supps = [];

    window.onload = loadSupps;

    async function loadSupps() {
        const { data, error } = await client.from('suppliers').select('*').order('name');
        if(error) { alert(error.message); return; }
        supps = data;
        renderSupps();
    }

    function renderSupps(filter = 'all') {
        const container = document.getElementById('suppList');
        let list = supps;
        if(filter !== 'all') list = supps.filter(s => s.category === filter);

        if(list.length === 0) { container.innerHTML = '<div class="empty-state">Sin registros.</div>'; return; }

        container.innerHTML = list.map(s => `
            <div class="contact-card">
                <div class="contact-info">
                    <div style="display:flex; align-items:center;">
                        <span class="contact-name">${s.name}</span>
                        <span class="tag-cat cat-${s.category}">${s.category}</span>
                    </div>
                    <div class="contact-meta">📞 ${s.contact_info || '-'} • 💳 ${s.payment_terms}</div>
                    ${s.cbu_alias ? `<div class="bank-info">🏦 ${s.bank_name||''}: ${s.cbu_alias}</div>` : ''}
                </div>
                <button onclick="editS(${s.id})" style="background:none; border:1px solid #444; color:#fff; padding:8px; border-radius:4px; cursor:pointer;">✏️</button>
            </div>
        `).join('');
    }

    function filterSupp(cat, el) {
        document.querySelectorAll('.chip-option').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        renderSupps(cat);
    }

    // ABM
    function modalSupp() {
        document.getElementById('sId').value = '';
        document.getElementById('sName').value = '';
        document.getElementById('sContact').value = '';
        document.getElementById('sBank').value = '';
        document.getElementById('sCbu').value = '';
        document.getElementById('suppModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('suppModal').style.display = 'none'; }

    function editS(id) {
        const s = supps.find(x => x.id === id);
        document.getElementById('sId').value = s.id;
        document.getElementById('sName').value = s.name;
        document.getElementById('sContact').value = s.contact_info;
        document.getElementById('sBank').value = s.bank_name || '';
        document.getElementById('sCbu').value = s.cbu_alias || '';
        document.getElementById('sCat').value = s.category || 'INSUMOS';
        document.getElementById('sTerms').value = s.payment_terms || 'Contado';
        document.getElementById('suppModal').style.display = 'flex';
    }

    async function saveSupp() {
        const id = document.getElementById('sId').value;
        const d = {
            name: document.getElementById('sName').value,
            contact_info: document.getElementById('sContact').value,
            category: document.getElementById('sCat').value,
            payment_terms: document.getElementById('sTerms').value,
            bank_name: document.getElementById('sBank').value,
            cbu_alias: document.getElementById('sCbu').value
        };

        if(!d.name) return alert("Falta nombre");

        if(id) await client.from('suppliers').update(d).eq('id', id);
        else await client.from('suppliers').insert(d);

        closeModal(); loadSupps();
    }
  </script>
</body>
</html>
