<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Proveedores</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* CHIPS DE FILTRO (Centros de Costo) */
    .chip-container { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .chip-option {
        background: #000; border: 1px solid #444; color: #888; 
        padding: 10px 20px; text-align: center; border-radius: 20px; cursor: pointer;
        font-size: 11px; font-weight: 700; text-transform: uppercase; transition: all 0.2s;
    }
    .chip-option:hover { border-color: #666; color: #fff; }
    .chip-option.selected { background: #fff; color: #000; border-color: #fff; }

    /* TAGS EN TARJETAS */
    .tag-base { font-size: 9px; padding: 3px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; margin-right: 6px; border: 1px solid transparent; }
    
    /* Centros de Costo */
    .cc-COD { background: rgba(232, 55, 47, 0.15); color: #e8372f; border-color: #e8372f; }  /* Rojo - Directo */
    .cc-OPEX { background: rgba(205, 251, 62, 0.15); color: #cdfb3e; border-color: #cdfb3e; } /* Verde - Operativo */
    .cc-GA { background: rgba(0, 234, 255, 0.15); color: #00eaff; border-color: #00eaff; }   /* Azul - Admin */

    /* Fiscal */
    .fiscal-ok { color: #888; border: 1px solid #444; background: #000; }
    .fiscal-alert { color: #666; border: 1px dashed #333; }

    /* CARD ESTILO AGENDA */
    .contact-card { 
        background: #111; border: 1px solid #333; border-radius: 8px; padding: 15px; 
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .contact-main { display: flex; flex-direction: column; gap: 5px; }
    .contact-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .contact-name { color: #fff; font-weight: 700; font-size: 15px; font-family: 'Outfit', sans-serif; }
    .contact-sub { color: #666; font-size: 11px; font-family: monospace; display: flex; gap: 10px; align-items: center; }
    
    /* Modal Grid */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: #fff;">AGENDA</span></div>
    <div style="display:flex; gap:10px;">
        <span id="roleBadge" style="font-size:10px; color:#888; padding:5px;"></span>
        <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
    </div>
  </header>

  <div class="admin-container">
    
    <div class="section-header">
        <h2 class="section-title">Directorio Proveedores</h2>
        <button onclick="modalSupp()" class="btn-refresh" style="background:#fff; color:#000; font-weight:800;">+ NUEVO</button>
    </div>

    <div class="chip-container">
        <div class="chip-option selected" onclick="filterSupp('all', this)">TODOS</div>
        <div class="chip-option" onclick="filterSupp('COD', this)">COD (Directos)</div>
        <div class="chip-option" onclick="filterSupp('OPEX', this)">OPEX (Operativos)</div>
        <div class="chip-option" onclick="filterSupp('G&A', this)">G&A (Admin)</div>
    </div>

    <input type="text" id="searchSupp" class="search-input-admin" placeholder="🔍 Buscar proveedor, CUIT o servicio...">

    <div id="suppList" class="data-list">
        <div class="loading-state">Cargando agenda...</div>
    </div>

  </div>

  <div id="suppModal" class="modal-overlay">
    <div class="modal-box" style="max-width: 500px;">
        <h3 style="color:#fff; margin-top:0;">Datos Proveedor</h3>
        <input type="hidden" id="sId">
        
        <label class="input-label">Razón Social / Nombre</label>
        <input type="text" id="sName" class="modal-input" placeholder="Ej: EDESA S.A.">

        <div class="form-grid">
            <div>
                <label class="input-label">Centro de Costos (P&L)</label>
                <select id="sCostCenter" class="modal-select">
                    <option value="COD">COD (Directo)</option>
                    <option value="OPEX">OPEX (Operativo)</option>
                    <option value="G&A">G&A (Admin/Mkt)</option>
                </select>
            </div>
            <div>
                <label class="input-label">Categoría</label>
                <select id="sCategory" class="modal-select">
                    <option value="INSUMOS">INSUMOS</option>
                    <option value="SERVICIOS">SERVICIOS</option>
                    <option value="INFRAESTRUCTURA">INFRAESTRUCTURA</option>
                    <option value="MANTENIMIENTO">MANTENIMIENTO</option>
                    <option value="SISTEMAS / IT">SISTEMAS / IT</option>
                    <option value="MARKETING">MARKETING</option>
                    <option value="LEGALES & LICENCIAS">LEGALES & LICENCIAS</option>
                    <option value="HONORARIOS">HONORARIOS</option>
                    <option value="RRHH EXTERNO">RRHH EXTERNO</option>
                </select>
            </div>
        </div>

        <div style="border-top: 1px dashed #333; margin: 10px 0 20px 0;"></div>

        <div class="form-grid">
            <div>
                <label class="input-label">Condición Facturación</label>
                <select id="sBillCond" class="modal-select" onchange="toggleCuit()">
                    <option value="FACTURA_A">Factura A</option>
                    <option value="FACTURA_ALIC_RED">Factura A (Alic. Reducida)</option>
                    <option value="FACTURA_C">Factura C</option>
                    <option value="FACTURA_M">Factura M</option>
                    <option value="RECIBO_X">Recibo X / Oficial</option>
                    <option value="SIN_FACTURA">Sin Factura</option>
                </select>
            </div>
            <div id="divCuit">
                <label class="input-label">CUIT (Solo Números)</label>
                <input type="text" id="sCuit" class="modal-input" placeholder="20123456789">
            </div>
        </div>

        <div class="form-grid">
            <div>
                <label class="input-label">Plazo Pago (Financiero)</label>
                <select id="sPayTerms" class="modal-select">
                    <option value="CONTADO">Contado / Dia</option>
                    <option value="SEMANAL">Semanal (Lun/Vie)</option>
                    <option value="QUINCENAL">Quincenal</option>
                    <option value="30_DIAS">30 Días FF</option>
                </select>
            </div>
            <div>
                <label class="input-label">Contacto / Tel</label>
                <input type="text" id="sContact" class="modal-input" placeholder="Opcional">
            </div>
        </div>

        <label class="input-label">Datos Bancarios (CBU / Alias)</label>
        <input type="text" id="sCbu" class="modal-input" placeholder="Banco - Alias - CBU">

        <div class="modal-btns">
            <button onclick="closeModal()" class="btn-modal-cancel">CANCELAR</button>
            <button onclick="saveSupp()" class="btn-modal-save">GUARDAR</button>
        </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const user = localStorage.getItem('mc_admin_user');
    document.getElementById('roleBadge').innerText = user;
    
    let allSupps = [];

    window.onload = loadSupps;

    async function loadSupps() {
        const { data, error } = await client.from('suppliers').select('*').order('name');
        if(error) { alert("Error DB: " + error.message); return; }
        allSupps = data;
        renderSupps(allSupps);
    }

    function renderSupps(list) {
        const container = document.getElementById('suppList');
        if(list.length === 0) { container.innerHTML = '<div class="empty-state">Sin resultados.</div>'; return; }

        container.innerHTML = list.map(s => {
            // Badges lógicos
            const ccClass = s.cost_center ? `cc-${s.cost_center.replace('&','')}` : ''; 
            const fiscalLabel = formatFiscal(s.billing_condition);
            const fiscalClass = (s.billing_condition === 'SIN_FACTURA') ? 'fiscal-alert' : 'fiscal-ok';

            return `
            <div class="contact-card">
                <div class="contact-main">
                    <div class="contact-header">
                        <span class="contact-name">${s.name}</span>
                        <span class="tag-base ${ccClass}">${s.cost_center || '-'}</span>
                        <span class="tag-base" style="border:1px solid #333; color:#666;">${s.category}</span>
                    </div>
                    <div class="contact-sub">
                        <span class="tag-base ${fiscalClass}" style="font-size:8px;">${fiscalLabel}</span>
                        ${s.tax_id ? `<span>CUIT: ${s.tax_id}</span>` : ''}
                        <span>• ${s.payment_terms || 'Contado'}</span>
                    </div>
                    ${s.contact_info ? `<div class="contact-sub" style="color:#444;">📞 ${s.contact_info}</div>` : ''}
                </div>
                <button onclick="editS(${s.id})" style="background:none; border:1px solid #333; color:#fff; width:30px; height:30px; border-radius:4px; cursor:pointer;">✏️</button>
            </div>`;
        }).join('');
    }

    function formatFiscal(code) {
        if(!code) return 'S/D';
        if(code === 'FACTURA_A') return 'FACT A';
        if(code === 'FACTURA_ALIC_RED') return 'FACT A (RED)';
        if(code === 'FACTURA_C') return 'FACT C';
        if(code === 'FACTURA_M') return 'FACT M';
        if(code === 'RECIBO_X') return 'RECIBO X';
        if(code === 'SIN_FACTURA') return 'NO FACTURA';
        return code;
    }

    // Filtros UI
    window.filterSupp = (filter, el) => {
        document.querySelectorAll('.chip-option').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        
        if(filter === 'all') {
            renderSupps(allSupps);
        } else {
            // Filtramos por cost_center que es la clave financiera
            const filtered = allSupps.filter(s => s.cost_center === filter);
            renderSupps(filtered);
        }
    }

    // Buscador
    document.getElementById('searchSupp').oninput = (e) => {
        const t = e.target.value.toLowerCase();
        const filtered = allSupps.filter(s => 
            s.name.toLowerCase().includes(t) || 
            (s.tax_id && s.tax_id.includes(t)) ||
            (s.category && s.category.toLowerCase().includes(t))
        );
        renderSupps(filtered);
    }

    // Lógica del Modal
    window.toggleCuit = () => {
        const val = document.getElementById('sBillCond').value;
        const div = document.getElementById('divCuit');
        if(val === 'SIN_FACTURA' || val === 'RECIBO_X') {
            div.style.opacity = '0.3'; 
            document.getElementById('sCuit').disabled = true;
        } else {
            div.style.opacity = '1';
            document.getElementById('sCuit').disabled = false;
        }
    }

    window.modalSupp = () => {
        document.getElementById('sId').value = '';
        document.getElementById('sName').value = '';
        document.getElementById('sContact').value = '';
        document.getElementById('sCbu').value = '';
        document.getElementById('sCuit').value = '';
        // Defaults
        document.getElementById('sCostCenter').value = 'OPEX';
        document.getElementById('sCategory').value = 'SERVICIOS';
        document.getElementById('sBillCond').value = 'FACTURA_A';
        document.getElementById('sPayTerms').value = 'CONTADO';
        
        toggleCuit();
        document.getElementById('suppModal').style.display = 'flex';
    }

    window.closeModal = () => { document.getElementById('suppModal').style.display = 'none'; }

    window.editS = (id) => {
        const s = allSupps.find(x => x.id === id);
        document.getElementById('sId').value = s.id;
        document.getElementById('sName').value = s.name;
        document.getElementById('sCostCenter').value = s.cost_center || 'OPEX';
        document.getElementById('sCategory').value = s.category || 'SERVICIOS';
        document.getElementById('sBillCond').value = s.billing_condition || 'FACTURA_A';
        document.getElementById('sPayTerms').value = s.payment_terms || 'CONTADO';
        document.getElementById('sCuit').value = s.tax_id || '';
        document.getElementById('sContact').value = s.contact_info || '';
        document.getElementById('sCbu').value = s.cbu_alias || ''; // Usamos cbu_alias genérico
        
        toggleCuit();
        document.getElementById('suppModal').style.display = 'flex';
    }

    window.saveSupp = async () => {
        const id = document.getElementById('sId').value;
        const data = {
            name: document.getElementById('sName').value.toUpperCase(),
            cost_center: document.getElementById('sCostCenter').value,
            category: document.getElementById('sCategory').value,
            billing_condition: document.getElementById('sBillCond').value,
            payment_terms: document.getElementById('sPayTerms').value,
            tax_id: document.getElementById('sCuit').value,
            contact_info: document.getElementById('sContact').value,
            cbu_alias: document.getElementById('sCbu').value // Guardamos info bancaria en este campo
        };

        if(!data.name) return alert("El nombre es obligatorio");

        if(id) {
            await client.from('suppliers').update(data).eq('id', id);
        } else {
            await client.from('suppliers').insert(data);
        }

        closeModal();
        loadSupps();
    }
  </script>
</body>
</html>
