<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Solicitudes</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    .insta-toolbar { background: #111; border: 1px solid #333; padding: 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; border-radius: 8px; }
    .insta-input { background: #000; border: 1px solid #444; color: #fff; padding: 8px; width: 60px; text-align: center; border-radius: 4px; }
    .filters-toolbar { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
    .filter-chip { background: #111; border: 1px solid #333; color: #888; padding: 8px 15px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 11px; text-transform: uppercase; font-weight: 700; }
    .filter-chip.active { background: var(--mc-red); color: #fff; border-color: var(--mc-red); }
    
    .request-card { background: #111; border: 1px solid #222; border-left: 4px solid #444; padding: 15px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .req-info h3 { margin: 0; color: #fff; font-size: 14px; text-transform: uppercase; }
    .req-detail { font-size: 11px; color: #666; margin-right: 10px; }
    .btn-action { padding: 6px 12px; border: none; border-radius: 4px; font-weight: 800; cursor: pointer; font-size: 10px; text-transform: uppercase; margin-left: 5px; }
    .btn-approve { background: var(--mc-accent-green); color: #000; }
    .btn-reject { background: #333; color: #fff; }
    .req-index { font-family: 'Outfit'; font-size: 20px; color: #333; margin-right: 15px; font-weight: 900; }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-red);">ADMIN</span></div>
    <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
  </header>

  <div class="admin-container">
    <div class="section-header">
      <h2 class="section-title">Solicitudes</h2>
      <button onclick="loadRequests(currentFilter)" class="btn-refresh">↻</button>
    </div>

    <div class="insta-toolbar">
      <span style="font-size:11px; color:#888;">INSTAGRAMS:</span>
      <input type="number" id="instaFrom" class="insta-input" placeholder="DE">
      <input type="number" id="instaTo" class="insta-input" placeholder="A">
      <button onclick="openBulkInstagrams()" class="btn-refresh" style="background:#fff; color:#000;">ABRIR ↗</button>
    </div>

    <div class="search-bar-container">
        <input type="text" id="searchMembers" class="search-input-admin" placeholder="🔍 Buscar socio...">
    </div>

    <div class="filters-toolbar">
        <button class="filter-chip active" data-status="pendiente">Pendientes</button>
        <button class="filter-chip" data-status="activo">Activos</button>
        <button class="filter-chip" data-status="rechazado">Rechazados</button>
        <button class="filter-chip" data-status="all">Todos</button>
    </div>

    <div id="requests-list"><div class="loading-state">Cargando...</div></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const EMAILJS_KEY = "FaYbPCI_5oJSsC9g4";
    try { emailjs.init(EMAILJS_KEY); } catch(e){}

    const role = localStorage.getItem('mc_admin_role')||'invitado';
    const user = localStorage.getItem('mc_admin_user')||'';
    const canApprove = ['superadmin','admin','manager'].includes(role);
    let currentFilter = 'pendiente';
    let currentData = [];

    window.onload = () => {
        document.querySelectorAll('.filter-chip').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.status;
                loadRequests(currentFilter);
            }
        });
        loadRequests('pendiente');
        
        document.getElementById('searchMembers').oninput = (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = currentData.filter(r => 
                (r.nombre&&r.nombre.toLowerCase().includes(term)) || 
                (r.member_id&&r.member_id.toLowerCase().includes(term))
            );
            renderList(filtered);
        };
    };

    async function loadRequests(status) {
        document.getElementById('requests-list').innerHTML = '<div class="loading-state">Cargando...</div>';
        let q = client.from('members').select('*').order('created_at',{ascending:false});
        if(status!=='all') q = q.eq('status', status);
        const { data, error } = await q;
        if(error) { alert(error.message); return; }
        currentData = data;
        renderList(data);
    }

    function renderList(data) {
        const c = document.getElementById('requests-list');
        if(!data.length) { c.innerHTML = '<div class="empty-state">No hay solicitudes.</div>'; return; }
        c.innerHTML = data.map((r, i) => {
            let actions = '';
            let color = '#444';
            if(r.status==='pendiente' && canApprove) {
                color = 'var(--mc-red)';
                actions = `<button class="btn-action btn-approve" onclick="process('${r.id}','activo','${r.nombre}','${r.email}','${r.member_id}')">APROBAR</button>
                           <button class="btn-action btn-reject" onclick="process('${r.id}','rechazado','${r.nombre}','')">RECHAZAR</button>`;
            } else if(r.status==='activo') {
                color = 'var(--mc-accent-green)';
                actions = canApprove ? `<button class="btn-action btn-reject" onclick="process('${r.id}','rechazado','','')">BAJA</button>` : '';
            }
            return `
            <div class="request-card" style="border-left-color:${color}">
                <div style="display:flex; align-items:center;">
                    <span class="req-index">#${i+1}</span>
                    <div class="req-info">
                        <h3>${r.nombre}</h3>
                        <div><span class="req-detail">ID: ${r.member_id||'-'}</span><span class="req-detail">IG: ${r.instagram}</span></div>
                    </div>
                </div>
                <div>${actions}</div>
            </div>`;
        }).join('');
    }

    async function process(id, status, name, email, oldId) {
        if(!confirm("¿Confirmar acción?")) return;
        let update = { status: status };
        let pass = '---';
        let newId = oldId;

        if(status==='activo') {
            if(!oldId || oldId.length<3) { newId = 'MC-'+Math.floor(1000+Math.random()*9000); update.member_id = newId; }
            pass = Math.random().toString(36).slice(-6).toUpperCase();
            update.access_password = pass;
        }

        await client.from('members').update(update).eq('id', id);
        client.from('admin_logs').insert({ admin_name: user, action: 'STATUS_'+status, details: name }).then();

        if(status==='activo' && email && email.includes('@')) {
            const params = { to_name: name, to_email: email, member_id: newId, member_pass: pass, login_url: 'https://midnightclub.com.ar' };
            emailjs.send("service_j7h80jk", "template_l425bfo", params);
        }
        loadRequests(currentFilter);
    }

    function openBulkInstagrams() {
        const from = parseInt(document.getElementById('instaFrom').value);
        const to = parseInt(document.getElementById('instaTo').value);
        if(!from || !to) return;
        currentData.slice(from-1, to).forEach(r => {
            if(r.instagram) window.open(`https://instagram.com/${r.instagram.replace('@','')}`, '_blank');
        });
    }
  </script>
</body>
</html>
