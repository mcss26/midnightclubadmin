<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Solicitudes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    /* Estilos base */
    .search-bar-container { margin-bottom: 20px; }
    .search-input-admin { width: 100%; padding: 12px 15px; background: #111; border: 1px solid #444; color: #fff; font-size: 14px; border-radius: 4px; outline: none; font-family: 'Inter'; }
    
    .insta-toolbar { background: var(--mc-card-bg); border: 1px solid var(--mc-border); padding: 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; border-radius: 8px; }
    .insta-input { background: #000; border: 1px solid #444; color: #fff; padding: 8px; width: 60px; text-align: center; font-weight: 700; border-radius: 4px; }
    .btn-bulk { background: #fff; color: #000; border: none; padding: 8px 15px; font-weight: 800; cursor: pointer; font-size: 11px; border-radius: 4px; flex: 1; text-transform: uppercase; transition: opacity 0.2s; }
    .btn-back { text-decoration: none; color: #888; font-size: 12px; display: flex; align-items: center; gap: 5px; margin-bottom: 20px; font-weight: 600; }

    /* FILTROS Y SORT */
    .filters-container {
        display: flex; justify-content: space-between; align-items: center; gap: 10px;
        margin-bottom: 25px; flex-wrap: wrap;
    }
    .filters-toolbar {
        display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;
        scrollbar-width: none; flex: 1;
    }
    .filters-toolbar::-webkit-scrollbar { display: none; }

    /* Selector de Orden (NUEVO) */
    .sort-select {
        background: #000; border: 1px solid #333; color: #fff;
        padding: 8px 12px; border-radius: 20px; outline: none;
        font-family: 'Inter'; font-size: 11px; font-weight: 700; text-transform: uppercase;
        cursor: pointer; height: 38px; min-width: 140px;
    }
    .sort-select:hover { border-color: #555; }

    /* Estilos Tarjetas */
    .req-index {
        font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 900; color: #333;
        margin-right: 20px; min-width: 30px; text-align: right;
    }
    .btn-trash {
        background: transparent; border: 1px solid #333; color: #666; padding: 10px;
        border-radius: 6px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .btn-trash:hover { border-color: var(--mc-red); color: var(--mc-red); background: rgba(232, 55, 47, 0.1); }
    
    .btn-revive { background: #fff; color: #000; } 
    .btn-ban { background: #333; color: #ccc; border: 1px solid #555; }
    
    .req-actions { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-red);">ADMIN</span> / SOCIOS</div>
    <div style="display:flex; gap:15px; align-items:center;">
        <span id="roleBadge" style="font-size:10px; border:1px solid #333; padding:4px 8px; border-radius:4px; color:#888;"></span>
        <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
    </div>
  </header>

  <div class="admin-container" style="grid-template-columns: 1fr;"> <main>
      <div class="section-header">
        <h2 class="section-title">Gestión de Solicitudes</h2>
        <button onclick="loadRequests(currentFilter)" class="btn-refresh">↻</button>
      </div>

      <div class="insta-toolbar">
        <span style="font-size:11px; font-weight:700; color:#aaa; text-transform: uppercase;">Abrir Instagrams:</span>
        <input type="number" id="instaFrom" class="insta-input" placeholder="DE" min="1">
        <input type="number" id="instaTo" class="insta-input" placeholder="A" min="1">
        <button onclick="openBulkInstagrams()" class="btn-bulk">Abrir ↗</button>
      </div>

      <div class="search-bar-container">
        <input type="text" id="searchMembers" class="search-input-admin" placeholder="🔍 Buscar por Nombre, Instagram, ID o Email...">
      </div>

      <div class="filters-container">
          <div class="filters-toolbar">
            <button class="filter-chip active" data-status="pendiente">Pendientes</button>
            <button class="filter-chip" data-status="activo">Activos</button>
            <button class="filter-chip" data-status="rechazado">Rechazados</button>
            <button class="filter-chip" data-status="all">Todos</button>
          </div>
          
          <select id="sortOrder" class="sort-select" onchange="changeSort(this.value)">
              <option value="desc">⬇ Más Recientes</option>
              <option value="asc">⬆ Más Antiguos</option>
          </select>
      </div>

      <div id="requests-list">
        <div class="loading-state">Cargando solicitudes...</div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258'; 
    const EMAILJS_PUBLIC_KEY = "FaYbPCI_5oJSsC9g4";
    const EMAILJS_SERVICE_ID = "service_j7h80jk";
    const EMAILJS_TEMPLATE_APROBADO = "template_l425bfo"; 

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    (function(){ try { emailjs.init(EMAILJS_PUBLIC_KEY); } catch(e) {} })();
    
    // --- SEGURIDAD RBAC ---
    const role = localStorage.getItem('mc_admin_role') || 'invitado';
    const user = localStorage.getItem('mc_admin_user') || 'Desconocido';
    const canApprove = ['superadmin', 'admin', 'manager'].includes(role);

    let currentFilter = 'pendiente';
    let currentSort = 'desc'; // 'desc' = Recientes, 'asc' = Antiguos
    let currentRequestsData = [];

    window.addEventListener('load', () => {
        document.getElementById('roleBadge').innerText = user + ' | ' + role.toUpperCase();
        setupFilters();
        loadRequests(currentFilter);
        setupSearch();
    });

    function setupFilters() {
      const chips = document.querySelectorAll('.filter-chip');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          chips.forEach(c => c.classList.remove('active')); chip.classList.add('active');
          currentFilter = chip.dataset.status;
          document.getElementById('searchMembers').value = ''; 
          loadRequests(currentFilter);
        });
      });
    }

    // --- NUEVA FUNCIÓN PARA CAMBIAR ORDEN ---
    function changeSort(order) {
        currentSort = order;
        loadRequests(currentFilter);
    }

    async function loadRequests(statusFilter) {
      const listContainer = document.getElementById('requests-list');
      listContainer.innerHTML = '<div class="loading-state">Actualizando datos...</div>';
      
      // APLICAR ORDEN DINÁMICO
      let query = client.from('members').select('*')
        .order('created_at', { ascending: (currentSort === 'asc') }); 

      if (statusFilter && statusFilter !== 'all') { query = query.eq('status', statusFilter); }
      
      const { data: requests, error } = await query;
      if (error) { listContainer.innerHTML = `<div class="error-state">Error: ${error.message}</div>`; return; }
      if (!requests || requests.length === 0) { listContainer.innerHTML = '<div class="empty-state">No hay solicitudes.</div>'; return; }
      
      currentRequestsData = requests;
      renderList(currentRequestsData);
    }

    function renderList(data) {
      const listContainer = document.getElementById('requests-list');
      if (data.length === 0) { listContainer.innerHTML = '<div class="empty-state">No se encontraron resultados.</div>'; return; }

      let html = '';
      
      data.forEach((req, index) => {
        const safeName = req.nombre ? req.nombre.replace(/'/g, "\\'") : 'Usuario';
        const safeEmail = req.email || '';
        const safeMemberID = req.member_id || '';
        let rightPanel = ''; 
        let borderColor = '';

        if (canApprove) {
            // USUARIO CON PERMISOS
            if (req.status === 'pendiente') {
                borderColor = 'var(--mc-red)';
                rightPanel = `
                  <div class="req-actions">
                    <button class="btn-action btn-approve" onclick="procesar('${req.id}', 'activo', '${safeName}', '${safeEmail}', '${safeMemberID}')">APROBAR</button>
                    <button class="btn-action btn-reject" onclick="procesar('${req.id}', 'rechazado', '${safeName}', '${safeEmail}')">RECHAZAR</button>
                    <button class="btn-trash" onclick="eliminar('${req.id}', '${safeName}')" title="Eliminar Definitivamente">🗑️</button>
                  </div>`;
            } else if (req.status === 'activo') {
                borderColor = 'var(--mc-accent-green)';
                rightPanel = `
                  <div class="req-actions">
                    <span class="status-badge status-active" style="margin-right:10px;">ACTIVO</span>
                    <button class="btn-action btn-ban" onclick="procesar('${req.id}', 'rechazado', '${safeName}', '${safeEmail}')" title="Dar de Baja">BAJA</button>
                    <button class="btn-trash" onclick="eliminar('${req.id}', '${safeName}')" title="Eliminar Definitivamente">🗑️</button>
                  </div>`;
            } else { // Rechazado
                borderColor = '#666';
                rightPanel = `
                  <div class="req-actions">
                    <span class="status-badge status-rejected" style="margin-right:10px;">RECHAZADO</span>
                    <button class="btn-action btn-revive" onclick="procesar('${req.id}', 'activo', '${safeName}', '${safeEmail}', '${safeMemberID}')" title="Reactivar Socio">REACTIVAR</button>
                    <button class="btn-trash" onclick="eliminar('${req.id}', '${safeName}')" title="Eliminar Definitivamente">🗑️</button>
                  </div>`;
            }
        } else {
            // SIN PERMISOS
            borderColor = '#333';
            const badge = req.status === 'activo' ? '✅ ACTIVO' : (req.status==='pendiente' ? '⏳ PENDIENTE' : '❌ RECHAZADO');
            rightPanel = `<span style="color:#666; font-size:10px; font-weight:700; border:1px solid #333; padding:5px;">${badge}</span>`;
        }

        html += `
          <div class="request-card" style="border-left: 4px solid ${borderColor}">
            <div style="display:flex; align-items:center; width:100%;">
                <div class="req-index">#${index + 1}</div>
                <div class="req-info" style="flex:1;">
                  <h3>${req.nombre} <span class="req-id-badge">${req.member_id || 'Sin ID'}</span></h3>
                  <div class="req-detail-row"><span class="req-detail">🎂 ${req.nacimiento || '—'}</span><span class="req-detail">📱 ${req.telefono}</span></div>
                  <div class="req-detail-row">
                    <span class="req-detail">📸 <a href="https://instagram.com/${req.instagram}" target="_blank" style="color:inherit; text-decoration:underline;">${req.instagram}</a></span>
                    <span class="req-detail">📧 ${req.email}</span>
                  </div>
                  <div class="req-pass"><span class="pass-label">ACCESO INICIAL:</span> ${req.access_password || '—'}</div>
                </div>
            </div>
            ${rightPanel}
          </div>`;
      });
      listContainer.innerHTML = html;
      if (!canApprove) document.querySelector('.section-title').innerHTML = 'Solicitudes <span style="font-size:10px; border:1px solid #444; padding:2px 5px; color:#888;">LECTURA</span>';
    }

    async function procesar(id, nuevoEstado, nombre, email, currentMemberId) {
      if(!canApprove) return;
      
      const accionTexto = nuevoEstado === 'activo' ? 'ACTIVAR' : 'DAR DE BAJA';
      if(!confirm(`¿Estás seguro de ${accionTexto} a ${nombre}?`)) return;

      let updates = { status: nuevoEstado };
      let finalMemberId = currentMemberId;
      let finalPassword = '---';

      if (nuevoEstado === 'activo') {
          if (!finalMemberId || finalMemberId === 'Sin ID' || finalMemberId.length < 3) {
              const randomNum = Math.floor(1000 + Math.random() * 9000); 
              finalMemberId = 'MC-' + randomNum;
              updates.member_id = finalMemberId;
          }
          finalPassword = Math.random().toString(36).slice(-6).toUpperCase();
          updates.access_password = finalPassword;
      }

      document.body.style.cursor = 'wait';
      const { error } = await client.from('members').update(updates).eq('id', id);
      document.body.style.cursor = 'default';

      if(error) { 
          alert("Error actualizando DB: " + error.message); 
      } else { 
        client.from('admin_logs').insert({ 
            admin_name: user, 
            action: nuevoEstado === 'activo' ? 'APROBAR/REACTIVAR' : 'RECHAZAR/BAJA', 
            details: `${nombre} -> ${nuevoEstado}` 
        }).then();

        if (nuevoEstado === 'activo' && email && email.includes('@')) {
           const templateParams = { 
               to_name: nombre, 
               to_email: email, 
               member_id: finalMemberId,      
               member_pass: finalPassword, 
               login_url: 'midnightclub.com.ar' 
           };
           emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_APROBADO, templateParams)
             .then(() => console.log("Email enviado"))
             .catch(e => alert("Error enviando email: " + JSON.stringify(e)));
        }
        
        loadRequests(currentFilter);
      }
    }

    async function eliminar(id, nombre) {
        if(!canApprove) return;
        if(!confirm(`⚠️ PELIGRO ⚠️\n¿Eliminar DEFINITIVAMENTE a ${nombre}?\nEsta acción no se puede deshacer.`)) return;

        document.body.style.cursor = 'wait';
        const { error } = await client.from('members').delete().eq('id', id);
        document.body.style.cursor = 'default';

        if(error) {
            alert("Error al eliminar: " + error.message);
        } else {
            client.from('admin_logs').insert({ admin_name: user, action: 'ELIMINAR_DB', details: `Borró a ${nombre}` }).then();
            loadRequests(currentFilter);
        }
    }

    function setupSearch() {
      document.getElementById('searchMembers').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        if (term === '') { renderList(currentRequestsData); } else {
          const filtered = currentRequestsData.filter(req => 
            (req.nombre && req.nombre.toLowerCase().includes(term)) ||
            (req.instagram && req.instagram.toLowerCase().includes(term)) ||
            (req.member_id && req.member_id.toLowerCase().includes(term))
          );
          renderList(filtered);
        }
      });
    }

    function openBulkInstagrams() {
      const from = parseInt(document.getElementById('instaFrom').value);
      const to = parseInt(document.getElementById('instaTo').value);
      if (isNaN(from) || isNaN(to) || from < 1 || to < from) return;
      const slice = currentRequestsData.slice(from - 1, to);
      slice.forEach(req => { if(req.instagram && req.instagram.length > 2) window.open(`https://instagram.com/${req.instagram.replace('@','')}`, '_blank'); });
    }
  </script>
</body>
</html>
