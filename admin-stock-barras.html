<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Stock Barras</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Estilos Tipo App (Simil Caja) */
    .bar-selector-card { 
        background: #111; padding: 25px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px;
    }
    
    .mode-header { 
        padding: 20px; border-radius: 8px 8px 0 0; text-align: center; border: 1px solid; border-bottom: none;
    }
    .mode-open { background: rgba(0, 234, 255, 0.1); border-color: var(--mc-accent-blue); color: var(--mc-accent-blue); }
    .mode-close { background: rgba(255, 165, 0, 0.1); border-color: orange; color: orange; }

    .stock-list-container {
        background: #000; border: 1px solid #333; border-top: none; 
        border-radius: 0 0 12px 12px; padding: 10px;
    }

    .stock-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px; border-bottom: 1px solid #222;
    }
    .item-info { flex: 1; }
    .item-name { font-weight: 700; color: #fff; font-size: 14px; margin-bottom: 4px; }
    .item-meta { font-size: 10px; color: #666; font-family: monospace; }
    
    .qty-control { display: flex; align-items: center; gap: 10px; }
    .big-input { 
        width: 70px; background: #111; border: 1px solid #444; color: #fff; 
        font-size: 20px; padding: 10px; text-align: center; border-radius: 8px; font-weight: 700;
        outline: none;
    }
    .big-input:focus { border-color: #fff; background: #000; }
    
    .cat-header { 
        background: #222; color: #aaa; font-size: 10px; font-weight: 800; 
        padding: 8px 15px; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; border-radius: 4px;
    }

    .info-mapping { font-size: 11px; color: #666; margin-top: 5px; font-style: italic; }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-accent-blue);">BARRA</span></div>
    <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
  </header>

  <div class="admin-container" style="max-width: 600px;">
    
    <div class="bar-selector-card">
        <label class="input-label">1. ELEGIR FECHA Y BARRA</label>
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-bottom: 10px;">
            <input type="date" id="opDate" class="modal-input" style="margin:0;" onchange="checkSession()">
            <select id="barSelect" class="modal-select" style="margin:0;" onchange="updateMappingInfo(); checkSession()">
                <option value="" disabled selected>Seleccionar ubicación...</option>
                </select>
        </div>
        <div id="mappingText" class="info-mapping">Selecciona una barra para ver sus cajas asociadas.</div>
    </div>

    <div id="loadingState" class="loading-state" style="display:none;">Buscando sesión activa...</div>
    <div id="emptyState" class="empty-state">Selecciona una barra para comenzar.</div>

    <div id="opPanel" style="display:none;">
        
        <div id="modeHeader" class="mode-header">
            <h2 style="margin:0; font-family:'Outfit'; font-size:20px;" id="modeTitle">--</h2>
            <div style="font-size:11px; margin-top:5px; opacity:0.8;" id="modeSubtitle">--</div>
        </div>

        <div class="stock-list-container" id="stockList">
            </div>

        <div style="margin-top: 20px;">
            <button id="btnAction" class="btn-primary" onclick="saveSession()" style="width:100%; padding:18px; font-size:16px; border-radius:8px;">CONFIRMAR ACCIÓN</button>
        </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const user = localStorage.getItem('mc_admin_user');

    // CONFIGURACIÓN DE BARRAS (Tu estructura real)
    const BARS_CONFIG = [
        { name: "BARRA 1", map: "Corresponde a Caja 1 y Caja 1.2" },
        { name: "BARRA 2", map: "Corresponde a Caja 2 y Caja 3" },
        { name: "BARRA VIP", map: "Corresponde a Caja 4" },
        { name: "BARRA PATIO", map: "Corresponde a Caja 5" }
    ];

    let currentSession = null;
    let products = [];
    let itemsMap = {}; 

    // Inicialización
    document.getElementById('opDate').valueAsDate = new Date();
    
    // Cargar Select
    const sel = document.getElementById('barSelect');
    BARS_CONFIG.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.name;
        opt.innerText = b.name;
        sel.appendChild(opt);
    });

    function updateMappingInfo() {
        const val = document.getElementById('barSelect').value;
        const conf = BARS_CONFIG.find(b => b.name === val);
        document.getElementById('mappingText').innerText = conf ? `ℹ️ ${conf.map}` : '';
    }

    async function checkSession() {
        const date = document.getElementById('opDate').value;
        const bar = document.getElementById('barSelect').value;
        if(!bar) return;

        // UI Reset
        document.getElementById('opPanel').style.display = 'none';
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('loadingState').style.display = 'block';

        // 1. Buscar Sesión
        const { data: session } = await client.from('bar_sessions')
            .select('*').eq('event_date', date).eq('bar_name', bar).maybeSingle();
        currentSession = session;

        // 2. Cargar Productos (Solo SKUs relevantes para barra)
        // Definir categorías de bebidas
        const cats = ['APERITIVO','VODKA','GIN','WHISKY','RON','CERVEZA','CHAMPAGNE','VINOS','ENERGIZANTE','SOFT'];
        const { data: skus } = await client.from('inventory_skus')
            .select('id, name, category, stock_current')
            .in('category', cats)
            .order('category').order('name');
        products = skus || [];

        // 3. Cargar Items previos si hay sesión
        itemsMap = {};
        if (session) {
            const { data: items } = await client.from('bar_session_items').select('*').eq('session_id', session.id);
            if(items) items.forEach(i => itemsMap[i.sku_id] = i);
        }

        renderAppMode();
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('opPanel').style.display = 'block';
    }

    function renderAppMode() {
        const container = document.getElementById('stockList');
        const header = document.getElementById('modeHeader');
        const title = document.getElementById('modeTitle');
        const sub = document.getElementById('modeSubtitle');
        const btn = document.getElementById('btnAction');
        
        container.innerHTML = '';
        let html = '';
        let lastCat = '';

        // DEFINIR MODO
        const isClosed = currentSession?.status === 'closed';
        const isOpen = currentSession?.status === 'open';
        let mode = 'INIT'; // INIT (Crear), OPEN (Cerrar), READ (Ver)

        if (!currentSession) mode = 'INIT';
        else if (isOpen) mode = 'OPEN';
        else mode = 'READ';

        // AJUSTAR UI SEGÚN MODO
        if (mode === 'INIT') {
            header.className = 'mode-header mode-open';
            title.innerText = 'APERTURA DE BARRA';
            sub.innerText = 'Ingresa el stock inicial que sacas del depósito.';
            btn.innerText = 'CONFIRMAR APERTURA Y RESTAR DEPÓSITO';
            btn.style.background = 'var(--mc-accent-blue)';
            btn.disabled = false;
        } else if (mode === 'OPEN') {
            header.className = 'mode-header mode-close';
            title.innerText = 'CIERRE DE BARRA';
            sub.innerText = 'Cuenta las botellas que quedaron (Llenas + Abiertas).';
            btn.innerText = 'GUARDAR CONTEO FINAL';
            btn.style.background = 'orange';
            btn.disabled = false;
        } else {
            header.className = 'mode-header';
            header.style.background = '#222'; header.style.color='#fff'; header.style.borderColor='#444';
            title.innerText = 'BARRA CERRADA';
            sub.innerText = 'Inventario finalizado.';
            btn.innerText = 'CERRADO';
            btn.style.background = '#333';
            btn.disabled = true;
        }

        // RENDERIZAR LISTA
        products.forEach(p => {
            // Separadores de Categoría
            if (p.category !== lastCat) {
                html += `<div class="cat-header">${p.category}</div>`;
                lastCat = p.category;
            }

            const prev = itemsMap[p.id] || { qty_initial:0, qty_added:0, qty_final:0 };
            
            // Lógica de Inputs Intuitivos
            let inputHtml = '';
            
            if (mode === 'INIT') {
                // Solo muestra Input de Apertura
                inputHtml = `
                    <div style="text-align:right;">
                        <div style="font-size:9px; color:#aaa; margin-bottom:2px;">INICIO</div>
                        <input type="number" class="big-input" id="inp_${p.id}" placeholder="0" value="${prev.qty_initial||''}">
                    </div>`;
            } else if (mode === 'OPEN') {
                // Muestra Info de Inicio y Input de Final
                inputHtml = `
                    <div style="display:flex; gap:15px; align-items:center;">
                        <div style="text-align:center;">
                            <div style="font-size:14px; font-weight:700; color:#fff;">${prev.qty_initial + prev.qty_added}</div>
                            <div style="font-size:8px; color:#666;">TOTAL INI</div>
                        </div>
                        <div style="text-align:right;">
                             <div style="font-size:9px; color:orange; margin-bottom:2px;">FINAL</div>
                             <input type="number" class="big-input" id="inp_${p.id}" placeholder="0" style="border-color:orange; color:orange;">
                        </div>
                    </div>`;
            } else {
                // Solo Lectura
                const consumed = (prev.qty_initial + prev.qty_added) - prev.qty_final;
                inputHtml = `
                    <div style="text-align:right;">
                        <span style="color:#666;">Consumo: </span><span style="color:#fff; font-weight:700; font-size:14px;">${consumed}</span>
                    </div>`;
            }

            html += `
            <div class="stock-item">
                <div class="item-info">
                    <div class="item-name">${p.name}</div>
                    <div class="item-meta">En Depósito: ${p.stock_current}</div>
                </div>
                ${inputHtml}
            </div>`;
        });
        container.innerHTML = html;
    }

    async function saveSession() {
        const date = document.getElementById('opDate').value;
        const bar = document.getElementById('barSelect').value;
        const isOpening = !currentSession; // Si no hay sesión, estamos abriendo

        if(!confirm(isOpening ? "¿Confirmar Apertura? Se restará mercadería del depósito global." : "¿Confirmar Cierre Final?")) return;

        let sessionId = currentSession?.id;

        // 1. CREAR SESIÓN SI ES APERTURA
        if (isOpening) {
            const { data: newS, error } = await client.from('bar_sessions')
                .insert({ event_date: date, bar_name: bar, opened_by: user, status: 'open' })
                .select().single();
            if(error) return alert("Error creando sesión: " + error.message);
            sessionId = newS.id;
        }

        const updates = [];
        const movements = [];

        // 2. RECORRER INPUTS
        for (const p of products) {
            const input = document.getElementById(`inp_${p.id}`);
            if(!input) continue; // Si estamos en modo lectura, no hay inputs

            const val = parseFloat(input.value) || 0;
            const old = itemsMap[p.id] || { qty_initial:0, qty_added:0, qty_final:0 };

            if (isOpening) {
                // LOGICA APERTURA: Guardamos qty_initial
                if (val > 0) { // Solo si cargó algo
                    updates.push({
                        session_id: sessionId,
                        sku_id: p.id,
                        qty_initial: val,
                        qty_added: 0,
                        qty_final: 0
                    });
                    
                    // Movimiento de Stock (Resta Depósito)
                    movements.push({
                        sku_id: p.id,
                        change_amount: -val,
                        movement_type: 'APERTURA_BARRA',
                        admin_name: user,
                        notes: `${bar} - Apertura`
                    });

                    // Actualizar Depósito Global (Manual update para asegurar)
                    const {data:curr} = await client.from('inventory_skus').select('stock_current').eq('id',p.id).single();
                    if(curr) await client.from('inventory_skus').update({stock_current: curr.stock_current - val}).eq('id',p.id);
                }
            } else {
                // LOGICA CIERRE: Guardamos qty_final (Upsert sobre lo existente)
                updates.push({
                    session_id: sessionId,
                    sku_id: p.id,
                    qty_initial: old.qty_initial,
                    qty_added: old.qty_added,
                    qty_final: val
                });
            }
        }

        // 3. IMPACTAR DB
        // Borrar detalle previo y re-insertar (estrategia segura para evitar duplicados en listas simples)
        if(updates.length > 0) {
            await client.from('bar_session_items').delete().eq('session_id', sessionId);
            await client.from('bar_session_items').insert(updates);
        }

        if (movements.length > 0) {
            await client.from('inventory_movements').insert(movements);
        }

        // 4. CERRAR SESIÓN (Si correspondía)
        if (!isOpening) {
            await client.from('bar_sessions').update({ status: 'closed', closed_by: user, closed_at: new Date() }).eq('id', sessionId);
        }

        alert("✅ Operación guardada.");
        checkSession(); // Recargar vista
    }
  </script>
</body>
</html>
