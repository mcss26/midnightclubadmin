<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Logs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .log-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
    .log-table th { text-align: left; padding: 15px; color: #666; font-weight: 700; border-bottom: 1px solid #333; text-transform: uppercase; font-size: 11px; }
    .log-table td { padding: 15px; border-bottom: 1px solid #222; color: #ccc; }
    .log-user { color: #fff; font-weight: 700; }
    .log-action { color: #00eaff; font-weight: 600; text-transform: uppercase; font-size: 11px; border: 1px solid rgba(0, 234, 255, 0.3); padding: 4px 8px; border-radius: 4px; display: inline-block; }
    .log-time { color: #666; font-family: monospace; }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: #00eaff;">LOGS</span></div>
    <div style="display:flex; gap:15px; align-items:center;">
        <span id="roleBadge" style="font-size:10px; border:1px solid #333; padding:4px 8px; border-radius:4px; color:#888;"></span>
        <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
    </div>
  </header>

  <div class="admin-container">
    <main>
      <div class="section-header">
        <h2 class="section-title" style="color:#00eaff;">Auditoría de Seguridad</h2>
        <button onclick="loadLogs()" class="btn-refresh">↻ Recargar</button>
      </div>

      <div id="logs-container">
        <table class="log-table">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Usuario</th>
                    <th>Acción</th>
                    <th>Detalles</th>
                </tr>
            </thead>
            <tbody id="logs-body">
                <tr><td colspan="4" style="text-align:center; padding:40px;">Cargando...</td></tr>
            </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- SEGURIDAD: Solo Superadmin ---
    const role = localStorage.getItem('mc_admin_role');
    const user = localStorage.getItem('mc_admin_user');

    if (role !== 'superadmin') {
        alert("⛔ ACCESO DENEGADO\nSolo el Superadmin puede ver los logs.");
        window.location.href = 'index.html'; // Expulsar
    }

    window.addEventListener('load', () => {
        document.getElementById('roleBadge').innerText = user + ' | ' + role.toUpperCase();
        loadLogs();
    });

    async function loadLogs() {
        const tbody = document.getElementById('logs-body');
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#666;">Cargando historial...</td></tr>';

        const { data, error } = await client
            .from('admin_logs')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(50);

        if (error) { tbody.innerHTML = `<tr><td colspan="4">Error: ${error.message}</td></tr>`; return; }

        let html = '';
        data.forEach(log => {
            const date = new Date(log.created_at).toLocaleString('es-AR', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
            html += `
                <tr>
                    <td class="log-time">${date}</td>
                    <td class="log-user">${log.admin_name}</td>
                    <td><span class="log-action">${log.action}</span></td>
                    <td>${log.details || '-'}</td>
                </tr>`;
        });
        tbody.innerHTML = html;
    }
  </script>
</body>
</html>
