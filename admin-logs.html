<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Logs</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: #666;">LOGS</span></div>
    <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
  </header>
  <div class="admin-container">
    <div class="section-header"><h2 class="section-title">Auditoría de Seguridad</h2></div>
    <div class="table-responsive">
        <table class="log-table">
            <thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead>
            <tbody id="logsBody"><tr><td colspan="4" style="text-align:center;">Cargando...</td></tr></tbody>
        </table>
    </div>
  </div>
  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const role = localStorage.getItem('mc_admin_role');
    
    if (role !== 'superadmin') { document.body.innerHTML = '<div class="error-state">ACCESO DENEGADO</div>'; }
    else { loadLogs(); }

    async function loadLogs() {
        const { data, error } = await client.from('admin_logs').select('*').order('created_at', { ascending: false }).limit(50);
        const tbody = document.getElementById('logsBody');
        if (error || !data.length) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Sin registros.</td></tr>'; return; }
        
        tbody.innerHTML = data.map(log => `
            <tr>
                <td style="font-family:monospace; color:#666;">${new Date(log.created_at).toLocaleString()}</td>
                <td style="font-weight:700;">${log.admin_name}</td>
                <td><span style="border:1px solid #333; padding:2px 5px; border-radius:4px; font-size:10px;">${log.action}</span></td>
                <td>${log.details || '-'}</td>
            </tr>
        `).join('');
    }
  </script>
</body>
</html>
