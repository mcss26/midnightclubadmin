<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — RRHH Pagos</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: #d600ff;">RRHH</span></div>
    <div style="display:flex; gap:10px;">
        <span id="roleBadge" style="font-size:10px; color:#888; padding:5px;"></span>
        <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
    </div>
  </header>

  <div class="admin-container">
    <div class="rrhh-grid">
        <div>
            <div class="section-header"><h2 class="section-title">Directorio Staff</h2><button onclick="modStaff()" class="btn-refresh">+ ALTA</button></div>
            <div id="staffList" class="data-list"><div class="loading-state">Cargando...</div></div>
        </div>
        
        <div class="data-card" style="display:block; height:auto; cursor:default;">
            <div class="section-header" style="border:none; padding:0; margin-bottom:15px;">
                <h2 class="section-title" style="color:#d600ff;">Gestión Pagos</h2>
            </div>
            
            <label class="input-label">SELECCIONAR FECHA A LIQUIDAR</label>
            <input type="date" id="evDate" class="modal-input" onchange="loadEv()">
            
            <div style="display:flex; justify-content:space-between; margin:15px 0;">
                <span class="input-label">TOTAL NÓMINA</span>
                <span id="totPay" style="font-size:18px; font-weight:900; color:#fff;">$0</span>
            </div>

            <table class="ops-table"><tbody id="evList"></tbody></table>
        </div>
    </div>
  </div>

  <div id="staffModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Nuevo Empleado</h3>
        <input type="text" id="nName" class="modal-input" placeholder="Nombre Completo">
        <input type="text" id="nDni" class="modal-input" placeholder="DNI">
        <select id="nRole" class="modal-select"></select>
        <div class="modal-btns"><button onclick="closeM()" class="btn-modal-cancel">CANCELAR</button><button onclick="saveS()" class="btn-modal-save">GUARDAR</button></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const user = localStorage.getItem('mc_admin_user');
    document.getElementById('roleBadge').innerText = user;
    document.getElementById('evDate').valueAsDate = new Date();

    window.onload = async () => {
        loadStaff(); loadEv();
        // Cargar roles en modal
        const { data } = await client.from('staff_roles').select('*');
        if(data) document.getElementById('nRole').innerHTML = data.map(r=>`<option value="${r.id}">${r.role_name}</option>`).join('');
    };

    async function loadStaff(){
        const { data } = await client.from('staff_members').select('*, staff_roles(role_name)').eq('status','active').order('full_name');
        document.getElementById('staffList').innerHTML = data.map(s => `
            <div class="data-card" style="padding:10px;">
                <div><div style="font-weight:700;">${s.full_name}</div><div class="card-sub">${s.staff_roles?.role_name}</div></div>
            </div>`).join('');
    }

    async function loadEv(){
        const d = document.getElementById('evDate').value;
        const { data: ev } = await client.from('events').select('id').eq('date', d).single();
        
        if(!ev) { document.getElementById('evList').innerHTML='<tr><td colspan="3">Sin evento.</td></tr>'; return; }
        
        const { data: st } = await client.from('event_staffing').select('*, staff_members(full_name)').eq('event_id', ev.id);
        let tot = 0;
        
        document.getElementById('evList').innerHTML = st.map(r => {
            tot += r.agreed_pay;
            const btn = r.payment_status==='paid' ? '<span style="color:#00eaff;">PAGADO</span>' : `<button onclick="pay(${r.id})" style="border:1px solid #cdfb3e; color:#cdfb3e; background:none; cursor:pointer; border-radius:4px;">PAGAR</button>`;
            return `<tr><td>${r.staff_members.full_name}</td><td>$${r.agreed_pay}</td><td>${btn}</td></tr>`;
        }).join('');
        document.getElementById('totPay').innerText = '$'+tot.toLocaleString();
    }

    async function pay(id){
        if(confirm("¿Confirmar pago?")) {
            await client.from('event_staffing').update({ payment_status:'paid' }).eq('id', id);
            loadEv();
        }
    }
    
    // Funciones ABM Staff simplificadas
    function modStaff(){ document.getElementById('staffModal').style.display='flex'; }
    function closeM(){ document.getElementById('staffModal').style.display='none'; }
    async function saveS(){
        await client.from('staff_members').insert({ 
            full_name:document.getElementById('nName').value, 
            dni:document.getElementById('nDni').value, 
            default_role_id:document.getElementById('nRole').value 
        });
        closeM(); loadStaff();
    }
  </script>
</body>
</html>
