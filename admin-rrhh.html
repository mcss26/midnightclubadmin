<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — RRHH</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: #d600ff;">RRHH</span></div>
    <div style="display:flex; gap:10px;">
        <span id="roleBadge" style="font-size:10px; color:#888; padding:5px;"></span>
        <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
    </div>
  </header>

  <div class="admin-container">
    <div class="rrhh-grid">
        <div>
            <div class="section-header"><h2 class="section-title">Staff</h2><button onclick="modStaff()" class="btn-refresh" style="background:#fff; color:#000;">+ ALTA</button></div>
            <div id="staffList" class="data-list"><div class="loading-state">Cargando...</div></div>
        </div>
        <div class="data-card" style="display:block; height:auto; cursor:default;">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <div><label class="card-sub">EVENTO</label><input type="date" id="evDate" class="modal-input" style="width:auto; padding:5px;" onchange="loadEv()"></div>
                <div style="text-align:right;"><label class="card-sub">NÓMINA</label><div id="totPay" style="font-size:20px; font-weight:900;">$0</div></div>
            </div>
            <table class="ops-table"><tbody id="evList"></tbody></table>
        </div>
    </div>
  </div>

  <div id="staffModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Empleado</h3>
        <input type="text" id="nName" class="modal-input" placeholder="Nombre">
        <input type="text" id="nDni" class="modal-input" placeholder="DNI">
        <div style="display:flex; gap:10px;">
            <select id="nRole" class="modal-select"><option>Bartender</option><option>Cajera</option><option>Seguridad</option><option>Runner</option></select>
            <input type="number" id="nPay" class="modal-input" placeholder="$ Base">
        </div>
        <div class="modal-btns"><button onclick="closeM()" class="btn-modal-cancel">CANCELAR</button><button onclick="saveS()" class="btn-modal-save">GUARDAR</button></div>
    </div>
  </div>

  <div id="payModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Pago</h3>
        <p id="pName" class="card-sub">...</p>
        <input type="number" id="pAmt" class="modal-input" style="font-size:24px; font-weight:900; color:#cdfb3e; text-align:center;">
        <label class="card-sub">FIRMA DIGITAL</label>
        <canvas id="sigPad" height="150" style="border:1px solid #444; width:100%; background:#fff;"></canvas>
        <button onclick="clsSig()" style="background:none; border:none; color:#888; width:100%; text-align:right; cursor:pointer;">Limpiar</button>
        <div class="modal-btns"><button onclick="closeM()" class="btn-modal-cancel">CANCELAR</button><button onclick="doPay()" class="btn-modal-save" style="background:#00eaff; color:#000;">CONFIRMAR</button></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const user = localStorage.getItem('mc_admin_user');
    document.getElementById('roleBadge').innerText = user;
    document.getElementById('evDate').valueAsDate = new Date();

    let allS=[], curEv=null, payId=null;
    const cvs = document.getElementById('sigPad'); const ctx = cvs.getContext('2d');
    let draw=false;
    ['mousedown','touchstart'].forEach(e=>cvs.addEventListener(e, (ev)=>{ draw=true; ctx.beginPath(); }));
    ['mousemove','touchmove'].forEach(e=>cvs.addEventListener(e, (ev)=>{ if(!draw)return; const r=cvs.getBoundingClientRect(); const x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left; const y=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top; ctx.lineTo(x,y); ctx.stroke(); ev.preventDefault(); }));
    ['mouseup','touchend'].forEach(e=>cvs.addEventListener(e, ()=>{ draw=false; }));
    function clsSig(){ ctx.clearRect(0,0,cvs.width,cvs.height); }

    window.onload = () => { loadStaff(); loadEv(); };

    async function loadStaff(){
        const { data } = await client.from('staff_members').select('*, staff_roles(role_name,base_pay)').eq('status','active').order('full_name');
        allS = data;
        document.getElementById('staffList').innerHTML = data.map(s => `
            <div class="data-card" onclick="add2Ev(${s.id}, ${s.default_role_id}, ${s.staff_roles?.base_pay||0})" style="cursor:pointer;">
                <div><div style="font-weight:700;">${s.full_name}</div><div class="card-sub">${s.staff_roles?.role_name}</div></div>
                <div style="font-weight:700;">+</div>
            </div>`).join('');
    }

    async function loadEv(){
        const d = document.getElementById('evDate').value;
        let { data: ev } = await client.from('events').select('*').eq('date', d).single();
        if(!ev) { const { data: n } = await client.from('events').insert({date:d, name:'Noche '+d}).select().single(); ev=n; }
        curEv = ev.id;
        
        const { data: st } = await client.from('event_staffing').select('*, staff_members(full_name), staff_roles(role_name)').eq('event_id', curEv);
        let tot = 0;
        document.getElementById('evList').innerHTML = st.length ? st.map(r => {
            tot += parseFloat(r.agreed_pay);
            const status = r.payment_status==='paid' ? '<span style="color:#00eaff;">PAGADO</span>' : `<button onclick="modPay(${r.id},'${r.staff_members.full_name}',${r.agreed_pay})" style="background:none; border:1px solid #cdfb3e; color:#cdfb3e; border-radius:4px; cursor:pointer;">PAGAR</button>`;
            return `<tr><td>${r.staff_members.full_name}</td><td>$${r.agreed_pay}</td><td>${status}</td></tr>`;
        }).join('') : '<tr><td colspan="3" style="text-align:center; color:#666;">Vacío</td></tr>';
        document.getElementById('totPay').innerText = '$'+tot.toLocaleString();
    }

    async function add2Ev(sId, rId, pay){ await client.from('event_staffing').insert({event_id:curEv, staff_id:sId, assigned_role_id:rId, agreed_pay:pay}); loadEv(); }
    
    function modPay(id, name, amt){ payId=id; document.getElementById('pName').innerText=name; document.getElementById('pAmt').value=amt; clsSig(); document.getElementById('payModal').style.display='flex'; }
    function modStaff(){ document.getElementById('staffModal').style.display='flex'; }
    function closeM(){ document.querySelectorAll('.modal-overlay').forEach(m=>m.style.display='none'); }

    async function saveS(){
        const n = document.getElementById('nName').value;
        const r = document.getElementById('nRole').value;
        const p = document.getElementById('nPay').value;
        let { data: role } = await client.from('staff_roles').select('id').eq('role_name', r).single();
        if(!role) { const { data: nr } = await client.from('staff_roles').insert({role_name:r, base_pay:p}).select().single(); role=nr; }
        await client.from('staff_members').insert({ full_name:n, dni:document.getElementById('nDni').value, default_role_id:role.id });
        closeM(); loadStaff();
    }

    async function doPay(){
        const sig = cvs.toDataURL();
        await client.from('event_staffing').update({ payment_status:'paid', agreed_pay:document.getElementById('pAmt').value, signature_url:sig }).eq('id', payId);
        client.from('admin_logs').insert({ admin_name:user, action:'PAY', details:'ID '+payId });
        closeM(); loadEv();
    }
  </script>
</body>
</html>
