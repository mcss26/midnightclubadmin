<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight — Solicitudes</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .req-item { display:flex; gap:10px; margin-bottom:10px; }
    .sku-sel { flex:1; }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: #fff;">OPS</span> / PEDIDOS</div>
    <button onclick="window.location.href='operativo-index.html'" class="btn-logout">VOLVER</button>
  </header>

  <div class="admin-container" style="max-width:600px;">
    <div class="dash-card" style="height:auto; cursor:default;">
        <h3>Nueva Solicitud de Reposición</h3>
        <p style="color:#666; font-size:12px;">Esto enviará una alerta a Administración.</p>
        
        <div id="itemsList"></div>
        <button onclick="addRow()" class="btn-refresh" style="width:100%; margin-top:10px;">+ AGREGAR PRODUCTO</button>

        <textarea id="reqNote" class="modal-input" placeholder="Nota opcional (Ej: Urgente para el Sábado)" style="margin-top:20px;"></textarea>
        
        <button onclick="sendRequest()" class="btn-primary" style="width:100%; padding:15px; margin-top:10px;">ENVIAR SOLICITUD 🚀</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const user = localStorage.getItem('mc_admin_user');

    let skus = [];

    window.onload = async () => {
        const { data } = await client.from('inventory_skus').select('id,name').eq('is_active',true).order('name');
        skus = data || [];
        addRow();
    };

    function addRow() {
        const div = document.createElement('div'); div.className = 'req-item';
        div.innerHTML = `
            <select class="modal-select sku-sel" style="margin:0;">
                <option value="">Producto...</option>
                ${skus.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
            </select>
            <input type="number" class="modal-input qty-inp" placeholder="Cant" style="width:80px; margin:0;">
            <button onclick="this.parentElement.remove()" style="border:none; background:none; color:#666;">✕</button>
        `;
        document.getElementById('itemsList').appendChild(div);
    }

    async function sendRequest() {
        const rows = document.querySelectorAll('.req-item');
        const items = [];
        
        rows.forEach(r => {
            const sku = r.querySelector('.sku-sel').value;
            const qty = r.querySelector('.qty-inp').value;
            if(sku && qty) items.push({ sku_id: sku, quantity_ordered: qty, unit_cost: 0 }); 
        });

        if(!items.length) return alert("Agrega al menos un producto.");

        // Crear Orden en estado 'requested' (Pendiente de Aprobación/Compra)
        // Usamos un proveedor genérico o NULL si la base lo permite. 
        // TRUCO: Si la DB exige supplier_id, deberíamos tener un proveedor "GENERICO INTERNO" o dejarlo null si tu schema lo permite. 
        // Asumiré que permite NULL o que usarás un ID existente temporalmente.
        // Si falla, crea un proveedor "STOCK INTERNO".

        const note = `SOLICITUD OPS (${user}): ` + document.getElementById('reqNote').value;

        const { data: ord, error } = await client.from('purchase_orders').insert({
            status: 'requested', // ESTADO CLAVE
            created_at: new Date(),
            total_amount: 0, // Se define cuando Admin compre
            supplier_id: null, // Admin definirá a quién comprarle
            // Podríamos guardar la nota en un campo notes si agregaste la columna a purchase_orders
        }).select().single();

        if(error) return alert("Error: " + error.message);

        // Guardar items
        const itemsPayload = items.map(i => ({ ...i, order_id: ord.id }));
        await client.from('purchase_items').insert(itemsPayload);

        alert("✅ Solicitud enviada a Administración.");
        window.location.reload();
    }
  </script>
</body>
</html>
