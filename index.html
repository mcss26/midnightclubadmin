<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight CMS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="back-styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="back-config.js"></script>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen" class="login-wrapper">
    <div class="login-box">
      <h2 class="login-title">MIDNIGHT CMS</h2>
      <div id="loginError" class="login-error">Credenciales inválidas</div>
      <input type="text" id="userInput" class="login-input" placeholder="USUARIO" autocomplete="off" />
      <input type="password" id="passInput" class="login-input" placeholder="CONTRASEÑA" />
      <button id="btnLogin" class="btn-login">INGRESAR</button>
    </div>
  </div>

  <!-- APP -->
  <div id="main-content" style="display:none;">
    <header class="admin-header">
      <div class="admin-logo">MIDNIGHT<span style="color:var(--mc-red);">CMS</span></div>
      <div style="display:flex;align-items:center;gap:10px;">
        <a id="logsLink" href="admin-logs.html" class="btn-ghost" style="display:none;">LOGS</a>
        <span id="userDisplay" style="color:#666;font-size:11px;font-weight:700;text-transform:uppercase;"></span>
        <button onclick="logout()" class="btn-logout">SALIR</button>
      </div>
    </header>

    <div class="admin-container">
      <section class="dashboard-section">
        <div class="section-header">
          <div class="section-title">CMS</div>
          <button class="btn-refresh" onclick="loadDashboard()">REFRESCAR</button>
        </div>

        <div class="dashboard-grid">
          <!-- 1. SOLICITUDES -->
          <a href="back-solicitudes.html" class="dash-card">
            <div class="dash-title">SOLICITUDES</div>
            <div class="dash-stat" style="font-size:13px;line-height:1.6;">
              <div>PEND: <span id="count-pending">--</span></div>
              <div>ACT: <span id="count-active">--</span></div>
            </div>
          </a>

          <!-- 2. ACCESOS -->
          <a href="back-accesos.html" class="dash-card">
            <div class="dash-title">ACCESOS</div>
            <div class="dash-stat" style="font-size:14px;">
              ACTIVOS: <span id="count-access-active">--</span>
            </div>
          </a>

          <!-- 3. CUMPLEAÑOS -->
          <a href="back-cumples.html" class="dash-card">
            <div class="dash-title">CUMPLEAÑOS</div>
            <div class="dash-stat" style="font-size:14px;">
              SEMANA: <span id="count-birthdays">--</span>
            </div>
          </a>

          <!-- 4. CARTA -->
          <a href="back-carta.html" class="dash-card">
            <div class="dash-title">CARTA</div>
            <div class="coming-soon">SIN MÉTRICAS</div>
          </a>
        </div>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'mid_cms_admin_v1';
    let client = null;
    let currentAdmin = null;

    document.addEventListener('DOMContentLoaded', () => {
      try {
        client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      } catch (e) {
        console.error('Supabase init error', e);
      }

      // Autologin
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const admin = JSON.parse(saved);
          if (admin && admin.username) {
            currentAdmin = admin;
            enterApp(admin);
          }
        }
      } catch (e) {}

      document.getElementById('btnLogin')?.addEventListener('click', doLogin);
      ['userInput', 'passInput'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('keydown', ev => {
          if (ev.key === 'Enter') doLogin();
        });
      });
    });

    async function doLogin() {
      const userEl = document.getElementById('userInput');
      const passEl = document.getElementById('passInput');
      const errorEl = document.getElementById('loginError');
      if (!userEl || !passEl || !client) return;

      const username = (userEl.value || '').trim();
      const password = (passEl.value || '').trim();

      if (!username || !password) {
        if (errorEl) {
          errorEl.textContent = 'Ingresá usuario y contraseña';
          errorEl.style.display = 'block';
        }
        return;
      }
      if (errorEl) errorEl.style.display = 'none';

      try {
        const { data, error } = await client
          .from('admins')
          .select('id, username, role')
          .eq('username', username)
          .eq('password', password)
          .limit(1)
          .single();

        if (error || !data) {
          if (errorEl) {
            errorEl.textContent = 'Credenciales inválidas';
            errorEl.style.display = 'block';
          }
          return;
        }

        currentAdmin = data;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {}

        enterApp(data);
      } catch (e) {
        console.error('Login error', e);
        if (errorEl) {
          errorEl.textContent = 'Error al conectar. Intentá de nuevo.';
          errorEl.style.display = 'block';
        }
      }
    }

    function enterApp(admin) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      document.getElementById('userDisplay').textContent = admin.username || '';
      updateLogsVisibility(admin);
      loadDashboard();
    }

    function updateLogsVisibility(admin) {
      const logsLink = document.getElementById('logsLink');
      if (!logsLink || !admin) return;
      const role = (admin.role || '').toLowerCase();

      const canSeeLogs =
        role === 'gerencia_general' ||
        role === 'gg' ||
        role === 'manager' ||
        role.includes('gerencia');

      logsLink.style.display = canSeeLogs ? 'inline-flex' : 'none';
    }

    function logout() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      window.location.reload();
    }

    async function loadDashboard() {
      if (!client) return;

      const elPending = document.getElementById('count-pending');
      const elActive = document.getElementById('count-active');
      const elAccessActive = document.getElementById('count-access-active');
      const elBirthdays = document.getElementById('count-birthdays');

      if (elPending) elPending.textContent = '--';
      if (elActive) elActive.textContent = '--';
      if (elAccessActive) elAccessActive.textContent = '--';
      if (elBirthdays) elBirthdays.textContent = '--';

      try {
        const { data, error } = await client
          .from('members')
          .select('status, nacimiento');

        if (error || !data) {
          console.error('Error members', error);
          return;
        }

        let pending = 0;
        let active = 0;

        data.forEach(m => {
          if (m.status === 'pendiente') pending++;
          if (m.status === 'activo') active++;
        });

        if (elPending) elPending.textContent = pending;
        if (elActive) elActive.textContent = active;
        if (elAccessActive) elAccessActive.textContent = active;

        // Cumpleaños semana (lo dejamos igual, solo número)
        const today = new Date();
        const dayOfWeek = today.getDay(); // 0 domingo
        const monday = new Date(today);
        monday.setHours(0, 0, 0, 0);
        monday.setDate(today.getDate() - ((dayOfWeek + 6) % 7));
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        sunday.setHours(23, 59, 59, 999);

        let bdayCount = 0;

        data.forEach(m => {
          if (!m.nacimiento) return;
          const n = String(m.nacimiento);
          let bMonth, bDay;

          if (n.includes('-')) {
            const parts = n.split('-'); // yyyy-mm-dd
            if (parts.length < 3) return;
            bMonth = parseInt(parts[1], 10) - 1;
            bDay = parseInt(parts[2], 10);
          } else if (n.includes('/')) {
            const parts = n.split('/'); // dd/mm/(yyyy)
            if (parts.length < 2) return;
            bDay = parseInt(parts[0], 10);
            bMonth = parseInt(parts[1], 10) - 1;
          } else {
            return;
          }

          if (isNaN(bDay) || isNaN(bMonth)) return;

          const bdayThisYear = new Date(today.getFullYear(), bMonth, bDay);
          if (bdayThisYear >= monday && bdayThisYear <= sunday) {
            bdayCount++;
          }
        });

        if (elBirthdays) elBirthdays.textContent = bdayCount;
      } catch (e) {
        console.error('loadDashboard error', e);
      }
    }
  </script>
</body>
</html>
