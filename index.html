<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin Panel</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="admin-styles.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-red);">ADMIN</span></div>
    <button onclick="logout()" class="btn-logout">CERRAR SESIÓN</button>
  </header>

  <div class="admin-container">

    <main>
      <div class="section-header">
        <h2 class="section-title">Gestión de Socios</h2>
        <button onclick="loadRequests(currentFilter)" class="btn-refresh" title="Actualizar lista">↻</button>
      </div>

      <div class="filters-toolbar">
        <button class="filter-chip active" data-status="pendiente">Pendientes</button>
        <button class="filter-chip" data-status="activo">Activos</button>
        <button class="filter-chip" data-status="rechazado">Rechazados</button>
        <button class="filter-chip" data-status="all">Todos</button>
      </div>

      <div id="requests-list">
        <div class="loading-state">Cargando solicitudes...</div>
      </div>
    </main>

    <aside>
      
      <div class="sidebar-card">
        <div class="birthday-header">
          <span class="birthday-title">Cumpleaños</span>
          <span style="font-size: 20px;">🎂</span>
        </div>
        <span class="birthday-subtitle">Semana actual (Lun - Dom)</span>
        
        <ul id="birthday-list" class="bd-list">
          <li class="no-birthdays">Cargando fechas...</li>
        </ul>
      </div>

      <div class="section-header" style="margin-bottom: 20px;">
        <h2 class="section-title" style="font-size: 18px;">Tickets & Accesos</h2>
      </div>
      <div class="sidebar-card" id="config-list">
        <div class="loading-state" style="padding: 20px 0; font-size: 12px;">Cargando configuración...</div>
      </div>

      <div class="section-header" style="margin-top: 40px; margin-bottom: 20px;">
        <h2 class="section-title" style="font-size: 18px;">Portada Home</h2>
      </div>
      <div class="sidebar-card">
        <input type="text" id="heroImgInput" class="config-input" placeholder="URL de la imagen (https://...)" autocomplete="off">
        <button onclick="saveHeroImage()" class="btn-save">GUARDAR IMAGEN</button>
        <p class="help-text">Escribe "default" para restaurar la original.</p>
      </div>

    </aside>

  </div> <script>
    // --- CONFIGURACIÓN INICIAL ---
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    // 👇👇👇 ¡PEGA TU CLAVE AQUÍ! 👇👇👇
    const SUPABASE_KEY = 'PEGAR_AQUI_TU_CLAVE_ANON'; 
    
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // Estado global del filtro actual
    let currentFilter = 'pendiente';

    // Al cargar la página, iniciar todo
    window.addEventListener('load', () => {
      checkAdminAuth();      // 1. Seguridad
      setupFilters();        // 2. Listeners de filtros
      loadRequests(currentFilter); // 3. Cargar lista inicial
      loadConfig();          // 4. Cargar switches
      loadHeroImage();       // 5. Cargar imagen hero
      loadWeeklyBirthdays(); // 6. Cargar cumpleaños
    });


    // --- FUNCIONES DE SEGURIDAD ---
    function checkAdminAuth() {
      // NOTA: Esto es seguridad básica de frontend. Idealmente usar Supabase Auth.
      const secret = prompt("Acceso Administrativo. Ingrese clave maestra:");
      if (secret !== "midnight2026") { // <--- CLAVE TEMPORAL
        window.location.href = "index.html";
      }
    }
    function logout() {
      if(confirm("¿Cerrar sesión de administrador?")) {
        window.location.href = "index.html";
      }
    }


    // --- 1. LÓGICA DE FILTROS ---
    function setupFilters() {
      const chips = document.querySelectorAll('.filter-chip');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          chips.forEach(c => c.classList.remove('active')); // Desactivar todos
          chip.classList.add('active'); // Activar el clickeado
          currentFilter = chip.dataset.status; // Actualizar estado global
          loadRequests(currentFilter); // Recargar lista
        });
      });
    }


    // --- 2. GESTIÓN DE SOLICITUDES (Carga y Renderizado) ---
    async function loadRequests(statusFilter) {
      const listContainer = document.getElementById('requests-list');
      listContainer.innerHTML = '<div class="loading-state">Actualizando datos...</div>';

      // Query base: Traer todos, los más nuevos primero
      let query = client
        .from('members')
        .select('*')
        .order('created_at', { ascending: false });

      // Aplicar filtro si no es "todos"
      if (statusFilter !== 'all') {
        query = query.eq('status', statusFilter);
      }

      const { data: requests, error } = await query;

      if (error) {
        listContainer.innerHTML = `<div class="error-state">Error de conexión: ${error.message}</div>`;
        return;
      }

      if (!requests || requests.length === 0) {
        listContainer.innerHTML = '<div class="empty-state">No hay solicitudes en esta categoría.</div>';
        return;
      }

      // Renderizar HTML
      let html = '';
      requests.forEach(req => {
        // Determinar el panel derecho (botones o badge de estado)
        let rightPanel = '';
        let borderColor = '';

        if (req.status === 'pendiente') {
            borderColor = 'var(--mc-red)';
            rightPanel = `
              <div class="req-actions">
                <button class="btn-action btn-approve" onclick="procesar('${req.id}', 'activo', '${req.nombre}')">APROBAR</button>
                <button class="btn-action btn-reject" onclick="procesar('${req.id}', 'rechazado', '${req.nombre}')">RECHAZAR</button>
              </div>`;
        } else if (req.status === 'activo') {
            borderColor = 'var(--mc-accent-green)';
            rightPanel = `<span class="status-badge status-active">ACTIVO ✅</span>`;
        } else {
             borderColor = '#666';
             rightPanel = `<span class="status-badge status-rejected">RECHAZADO ❌</span>`;
        }

        // Formatear datos nulos
        const idBadge = req.member_id || 'Sin ID';
        const bday = req.nacimiento || '—';
        const pass = req.access_password || '—';

        html += `
          <div class="request-card" style="border-left: 4px solid ${borderColor}">
            <div class="req-info">
              <h3>${req.nombre} <span class="req-id-badge">${idBadge}</span></h3>
              
              <div class="req-detail-row">
                <span class="req-detail"><span class="req-icon">🎂</span> ${bday}</span>
                <span class="req-detail"><span class="req-icon">📱</span> ${req.telefono}</span>
              </div>
              <div class="req-detail-row">
                <span class="req-detail"><span class="req-icon">📸</span> ${req.instagram}</span>
                <span class="req-detail"><span class="req-icon">📧</span> ${req.email}</span>
              </div>

              <div class="req-pass">
                <span class="pass-label">ACCESO INICIAL:</span> ${pass}
              </div>
            </div>
            ${rightPanel}
          </div>
        `;
      });
      listContainer.innerHTML = html;
    }

    // Función para Aprobar/Rechazar
    async function procesar(id, nuevoEstado, nombre) {
      // Bloquear interfaz temporalmente (opcional)
      document.body.style.cursor = 'wait';

      const { error } = await client.from('members').update({ status: nuevoEstado }).eq('id', id);
      
      document.body.style.cursor = 'default';

      if(error) { 
        alert("Error al procesar la solicitud: " + error.message);
      } else {
        // Recargar lista manteniendo el filtro actual
        loadRequests(currentFilter);
        // Feedback rápido (opcional)
        console.log(`${nombre} marcado como ${nuevoEstado}`);
      }
    }


    // --- 3. WIDGET CUMPLEAÑOS SEMANALES (Lunes a Domingo) ---
    async function loadWeeklyBirthdays() {
      const bdList = document.getElementById('birthday-list');
      
      // 1. Calcular fechas límite de la semana actual
      const today = new Date();
      const currentDay = today.getDay(); // 0=Domingo, 1=Lunes...
      
      // Ajuste para que la semana empiece el Lunes: Si es Domingo(0), lo contamos como día 7.
      const dayAdjusted = currentDay === 0 ? 7 : currentDay;
      
      // Calcular Lunes (Inicio)
      const monday = new Date(today);
      monday.setDate(today.getDate() - (dayAdjusted - 1));
      monday.setHours(0,0,0,0);

      // Calcular Domingo (Fin)
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      sunday.setHours(23,59,59,999);
      
      // 2. Obtener SOLO miembros ACTIVOS de la base de datos
      const { data: members, error } = await client
        .from('members')
        .select('id, nombre, member_id, nacimiento')
        .eq('status', 'activo');

      if (error || !members) {
        bdList.innerHTML = '<li class="no-birthdays">No se pudieron cargar las fechas.</li>';
        return;
      }

      // 3. Filtrar en JavaScript quiénes cumplen años en este rango de fechas
      const upcomingBirthdays = members.filter(member => {
        if (!member.nacimiento || member.nacimiento.length < 5) return false;
        
        // Detectar formato (YYYY-MM-DD o DD/MM/YYYY) y extraer día/mes
        let birthMonth, birthDay;
        if (member.nacimiento.includes('-')) {
           const parts = member.nacimiento.split('-');
           birthMonth = parseInt(parts[1], 10) - 1; // Mes en JS es 0-11
           birthDay = parseInt(parts[2], 10);
        } else if (member.nacimiento.includes('/')) {
           const parts = member.nacimiento.split('/');
           birthMonth = parseInt(parts[1], 10) - 1;
           birthDay = parseInt(parts[0], 10);
        } else return false; // Formato no reconocido
        
        // Crear fecha de cumpleaños en el AÑO ACTUAL para comparar
        const bdayThisYear = new Date(today.getFullYear(), birthMonth, birthDay);
        
        // Verificar si la fecha cae entre el Lunes y Domingo calculados
        return bdayThisYear >= monday && bdayThisYear <= sunday;
      });

      // 4. Renderizar resultados
      if (upcomingBirthdays.length === 0) {
        bdList.innerHTML = '<li class="no-birthdays">No hay cumpleaños registrados esta semana.</li>';
        return;
      }

      // Ordenar por día de la semana (Lunes primero)
      upcomingBirthdays.sort((a, b) => {
         const getDay = (dateStr) => parseInt(dateStr.includes('-') ? dateStr.split('-')[2] : dateStr.split('/')[0], 10);
         return getDay(a.nacimiento) - getDay(b.nacimiento);
      });

      let html = '';
      const daysShort = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];

      upcomingBirthdays.forEach(member => {
        // Volver a procesar fecha para mostrar
        let birthMonth, birthDay;
        if (member.nacimiento.includes('-')) {
           const parts = member.nacimiento.split('-'); birthMonth = parseInt(parts[1],10)-1; birthDay = parseInt(parts[2],10);
        } else {
           const parts = member.nacimiento.split('/'); birthMonth = parseInt(parts[1],10)-1; birthDay = parseInt(parts[0],10);
        }
        const bdayDate = new Date(today.getFullYear(), birthMonth, birthDay);
        const dayName = daysShort[bdayDate.getDay()];

        html += `
          <li class="bd-item">
            <div class="bd-date-box">
              <span class="bd-day">${dayName}</span>
              <span class="bd-num">${birthDay}</span>
            </div>
            <div>
              <div class="bd-name">${member.nombre}</div>
              <div class="bd-id">${member.member_id || 'Sin ID'}</div>
            </div>
          </li>
        `;
      });
      bdList.innerHTML = html;
    }


    // --- 4. CONFIGURACIÓN DEL SITIO (Tickets y Hero) ---
    async function loadConfig() {
      const container = document.getElementById('config-list');
      // Se requiere que la tabla 'site_config' exista en Supabase
      const { data: configs, error } = await client.from('site_config').select('*').order('id');
      
      if (error) {
        container.innerHTML = '<div class="error-state" style="font-size:12px;">Error: No se encontró la tabla de configuración.</div>';
        console.error("Error config:", error);
        return;
      }
      
      let html = '';
      configs.forEach(conf => {
        // Filtrar solo las keys de accesos y members
        if(conf.key.startsWith('access_') || conf.key.startsWith('mem_')) {
           html += `
            <div class="config-item">
              <div class="config-header">
                <span class="config-label">${conf.label}</span>
                <label class="switch">
                  <input type="checkbox" ${conf.is_active ? 'checked' : ''} onchange="toggleConfig('${conf.key}', this.checked)">
                  <span class="slider"></span>
                </label>
              </div>
              <input type="text" class="config-input" value="${conf.url || ''}" onchange="updateConfigUrl('${conf.key}', this.value)" placeholder="Pegar URL de Passline aquí...">
            </div>`;
        }
      });
      container.innerHTML = html || '<div class="empty-state">No hay configuraciones disponibles.</div>';
    }

    async function toggleConfig(key, isActive) {
      // Actualizar estado on/off
      await client.from('site_config').update({ is_active: isActive }).eq('key', key);
    }
    async function updateConfigUrl(key, newUrl) {
      // Actualizar URL del ticket
      await client.from('site_config').update({ url: newUrl }).eq('key', key);
    }

    async function loadHeroImage() {
      // Cargar imagen actual en el input
      const { data } = await client.from('site_config').select('value').eq('key', 'hero_image').single();
      if(data) document.getElementById('heroImgInput').value = data.value;
    }
    async function saveHeroImage() {
      // Guardar nueva imagen
      const btn = document.querySelector('.btn-save');
      const originalText = btn.textContent;
      btn.textContent = "GUARDANDO..."; btn.disabled = true;

      const url = document.getElementById('heroImgInput').value.trim();
      // Si está vacío o dice 'default', usar 'default'
      const finalUrl = (url === '' || url.toLowerCase() === 'default') ? 'default' : url;
      
      await client.from('site_config').update({ value: finalUrl }).eq('key', 'hero_image');
      
      btn.textContent = "¡GUARDADO!";
      setTimeout(() => { btn.textContent = originalText; btn.disabled = false; }, 2000);
    }
  </script>
</body>
</html>
