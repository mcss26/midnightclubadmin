<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Midnight Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; padding-bottom: 80px; }
    
    #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .login-box { width: 300px; text-align: center; }
    .login-input { width: 100%; padding: 15px; background: #111; border: 1px solid #333; color: #fff; text-align: center; margin-bottom: 15px; outline: none; }
    
    .dashboard { max-width: 800px; margin: 0 auto; padding: 20px; display: none; } /* Oculto por defecto */
    .section-title { font-size: 18px; color: var(--mc-red); border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 50px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; }
    .btn-action { background: var(--mc-red); color: #fff; border: none; padding: 10px 15px; font-weight: 700; cursor: pointer; font-size: 12px; text-transform: uppercase; border-radius: 4px; }
    .btn-action:hover { opacity: 0.9; }

    /* Config & Upload */
    .config-card { background: #111; border: 1px solid #333; padding: 15px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; border-radius: 6px; }
    .config-header { display: flex; justify-content: space-between; align-items: center; }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; border: none; }
    .status-active { background: #cdfb3e; color: #000; }
    .status-soldout { background: var(--mc-red); color: #fff; }
    .url-group { display: flex; gap: 5px; }
    .url-input { flex: 1; background: #000; border: 1px solid #333; color: #aaa; padding: 8px; font-size: 12px; font-family: monospace; outline: none; }
    .btn-save-url { background: #333; color: #fff; border: none; cursor: pointer; padding: 0 10px; font-size: 16px; }
    .upload-box { border: 2px dashed #333; padding: 30px; text-align: center; margin-bottom: 20px; border-radius: 8px; }
    #fileInput { display: none; }
    .upload-btn { background: #fff; color: #000; padding: 10px 20px; cursor: pointer; font-weight: 700; display: inline-block; border-radius: 4px; }
    #preview-img { max-width: 200px; margin-top: 20px; display: none; border: 1px solid #333; margin-left: auto; margin-right: auto; }

    /* Solicitudes */
    .search-bar-container { margin-bottom: 20px; }
    .search-input-admin { width: 100%; padding: 12px 15px; background: #111; border: 1px solid #444; color: #fff; font-size: 14px; border-radius: 4px; outline: none; }
    .req-card { background: #111; border: 1px solid #222; padding: 15px; margin-bottom: 10px; border-left: 3px solid #444; display: flex; gap: 15px; position: relative; border-radius: 4px; flex-direction: column; }
    @media(min-width: 600px) { .req-card { flex-direction: row; align-items: center; } }
    .req-card.approved { border-left-color: #cdfb3e; opacity: 0.6; }
    .req-number { font-size: 20px; font-weight: 900; color: #333; min-width: 30px; text-align: center; display: flex; align-items: center; }
    .req-content { flex: 1; }
    .req-info a { color: #aaa; text-decoration: underline; }
    .action-group { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    @media(min-width: 600px) { .action-group { margin-top: 0; margin-left: auto; } }
    .btn-delete { background: transparent; border: 1px solid #333; color: #666; padding: 8px; cursor: pointer; font-size: 10px; border-radius: 4px; }
    .btn-delete:hover { border-color: var(--mc-red); color: var(--mc-red); }
    
    .insta-toolbar { background: #111; border: 1px solid #333; padding: 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; position: sticky; top: 10px; z-index: 50; box-shadow: 0 10px 20px rgba(0,0,0,0.5); flex-wrap: wrap; }
    .insta-input { background: #000; border: 1px solid #444; color: #fff; padding: 8px; width: 60px; text-align: center; font-weight: 700; }
    .btn-bulk { background: #fff; color: #000; border: none; padding: 8px 15px; font-weight: 800; cursor: pointer; font-size: 12px; flex: 1; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2 style="color:var(--mc-red);">SYSTEM ADMIN</h2>
      <input type="password" id="passInput" class="login-input" placeholder="PASSWORD">
      <button onclick="login()" class="btn-action" style="width:100%">INGRESAR</button>
    </div>
  </div>

  <div id="dashboard" class="dashboard">
    <h1 style="text-align:center; margin-bottom:40px;">PANEL DE CONTROL</h1>

    <div class="section-title">Gestión de Accesos</div>
    <div id="config-list">Cargando configuración...</div>

    <div class="section-title">Imagen de Portada</div>
    <div class="upload-box">
      <label for="fileInput" class="upload-btn">SUBIR NUEVA FOTO</label>
      <input type="file" id="fileInput" accept="image/*">
      <img id="preview-img" src="" alt="">
      <br><button id="btnSaveHero" class="btn-action" style="margin-top:15px; display:none;" onclick="uploadHero()">GUARDAR FOTO</button>
    </div>

    <div class="section-title">Solicitudes Member ID</div>
    <div class="insta-toolbar">
      <span style="font-size:12px; font-weight:700; color:#aaa;">ABRIR INSTAGRAM:</span>
      <input type="number" id="instaFrom" class="insta-input" placeholder="DE">
      <input type="number" id="instaTo" class="insta-input" placeholder="A">
      <button onclick="openBulkInstagrams()" class="btn-bulk">ABRIR PERFILES ↗</button>
    </div>
    <div class="search-bar-container">
      <input type="text" id="searchMembers" class="search-input-admin" placeholder="🔍 Buscar por Nombre, Instagram, ID...">
    </div>
    <button onclick="loadRequests()" style="margin-bottom:15px; background:none; border:1px solid #333; color:#fff; padding:5px;">↻ Recargar Lista</button>
    <div id="requests-list"></div>
  </div>

  <script>
    // ============================================
    //  CONFIGURACIÓN DE CLAVES (¡COMPLETAR!)
    // ============================================
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    // 👇 PEGA TU CLAVE DE SUPABASE AQUÍ 👇
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258'; 

    // 👇 PEGA TUS CLAVES DE EMAILJS AQUÍ 👇
    const EMAILJS_PUBLIC_KEY = "FaYbPCI_5oJSsC9g4";
    const EMAILJS_SERVICE_ID = "service_j7h80jk";
    const EMAILJS_TEMPLATE_CUMPLE = "template_rmkp7zo"; 
    const EMAILJS_TEMPLATE_APROBADO = "template_l425bfo"; 


    // --- INICIALIZACIÓN ---
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    (function(){ try { emailjs.init(EMAILJS_PUBLIC_KEY); } catch(e) { console.error("Error EmailJS:", e); } })();


    // --- 1. FUNCIÓN DE LOGIN (CORREGIDA) ---
    function login() {
      const pass = document.getElementById('passInput').value;
      // AQUÍ SE DEFINE LA CONTRASEÑA
      if (pass === 'midnight2026') { 
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        // Cargar datos al entrar
        loadConfig();
        loadRequests();
        setupHeroUpload();
      } else {
        alert('Acceso denegado.');
        document.getElementById('passInput').value = '';
      }
    }
    // Permitir login con tecla Enter
    document.getElementById('passInput').addEventListener('keydown', (e) => {
        if(e.key === 'Enter') login();
    });


    // --- 2. GESTIÓN DE ACCESOS (TICKETS) ---
    async function loadConfig() {
      const container = document.getElementById('config-list');
      // Asegurarse de que la tabla site_config exista
      const { data: configs, error } = await client.from('site_config').select('*').order('id');
      
      if (error) { container.innerHTML = '<p style="color:var(--mc-red)">Error cargando configuración.</p>'; return; }
      if (!configs || configs.length === 0) { container.innerHTML = '<p>No hay configuraciones.</p>'; return; }

      let html = '';
      configs.forEach(conf => {
        // Filtrar solo los de acceso y members
        if(conf.key.startsWith('access_') || conf.key.startsWith('mem_')) {
          const statusClass = conf.is_active ? 'status-active' : 'status-soldout';
          const statusText = conf.is_active ? 'ACTIVO' : 'SOLD OUT';
          
          html += `
            <div class="config-card">
              <div class="config-header">
                <strong>${conf.label}</strong>
                <button class="status-badge ${statusClass}" onclick="toggleStatus('${conf.key}', ${!conf.is_active})">${statusText}</button>
              </div>
              <div class="url-group">
                <input type="text" class="url-input" id="url-${conf.key}" value="${conf.url || ''}" placeholder="URL de Passline...">
                <button class="btn-save-url" onclick="saveUrl('${conf.key}')">💾</button>
              </div>
            </div>`;
        }
      });
      container.innerHTML = html;
    }
    async function toggleStatus(key, newStatus) {
      await client.from('site_config').update({ is_active: newStatus }).eq('key', key);
      loadConfig(); // Recargar visualmente
    }
    async function saveUrl(key) {
      const newUrl = document.getElementById('url-' + key).value;
      await client.from('site_config').update({ url: newUrl }).eq('key', key);
      alert("URL guardada.");
    }


    // --- 3. GESTIÓN DE SOLICITUDES (MEMBERS) ---
    let allRequests = []; // Guardar para buscar localmente

    async function loadRequests() {
      const list = document.getElementById('requests-list');
      list.innerHTML = '<p>Cargando...</p>';
      
      // Traer todas las solicitudes, nuevas primero
      const { data, error } = await client.from('members').select('*').order('created_at', { ascending: false });
      
      if (error) { list.innerHTML = 'Error de carga.'; return; }
      allRequests = data;
      renderRequests(allRequests);
    }

    function renderRequests(requestsData) {
      const list = document.getElementById('requests-list');
      if(requestsData.length === 0) { list.innerHTML = '<p>No hay solicitudes.</p>'; return; }
      
      let html = '';
      requestsData.forEach((req, index) => {
        const isApproved = req.status === 'activo';
        const cardClass = isApproved ? 'req-card approved' : 'req-card';
        // Escapar datos para JS
        const safeName = req.nombre ? req.nombre.replace(/'/g, "\\'") : 'Usuario';
        const safeEmail = req.email || '';
        const safeMemberID = req.member_id || '';

        html += `
          <div class="${cardClass}">
            <div class="req-number">${requestsData.length - index}</div>
            <div class="req-content">
              <div class="req-info">
                <strong>${req.nombre || 'Sin Nombre'}</strong> (<a href="https://instagram.com/${req.instagram}" target="_blank">@${req.instagram}</a>)<br>
                ID: ${req.member_id || 'Pendiente'} | Pass: ${req.access_password || 'Pendiente'}<br>
                Email: ${req.email} | Tel: ${req.telefono} | Cumple: ${req.nacimiento}
              </div>
            </div>
            <div class="action-group">
              ${!isApproved ? `<button class="btn-action" onclick="approveMember('${req.id}', '${safeName}', '${safeEmail}', '${safeMemberID}')">APROBAR</button>` : '<span style="color:#cdfb3e; font-weight:700;">APROBADO</span>'}
              <button class="btn-delete" onclick="deleteMember('${req.id}')">ELIMINAR</button>
            </div>
          </div>`;
      });
      list.innerHTML = html;
    }

    async function approveMember(id, name, email, memberId) {
      if(!confirm("¿Aprobar a este socio?")) return;
      const { error } = await client.from('members').update({ status: 'activo' }).eq('id', id);
      if(error) { alert("Error DB."); return; }
      
      // Enviar mail de aprobación
      if(email && email.includes('@')) {
         emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_APROBADO, { to_name: name, to_email: email, member_id: memberId, login_url: 'https://midnightclub.biz' })
         .catch(e => console.error("Mail error:", e));
      }
      loadRequests(); // Recargar lista
    }
    async function deleteMember(id) {
      if(!confirm("¡CUIDADO! ¿Eliminar permanentemente?")) return;
      await client.from('members').delete().eq('id', id);
      loadRequests();
    }

    // Buscador en tiempo real
    document.getElementById('searchMembers').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      if(term === '') { renderRequests(allRequests); return; }
      const filtered = allRequests.filter(r => 
        (r.nombre && r.nombre.toLowerCase().includes(term)) ||
        (r.instagram && r.instagram.toLowerCase().includes(term)) ||
        (r.member_id && r.member_id.toLowerCase().includes(term))
      );
      renderRequests(filtered);
    });


    // --- 4. HERRAMIENTAS (Instagram Bulk) ---
    function openBulkInstagrams() {
      const from = parseInt(document.getElementById('instaFrom').value) - 1;
      const to = parseInt(document.getElementById('instaTo').value);
      if(isNaN(from) || isNaN(to) || from < 0) { alert("Rangos inválidos."); return; }
      
      // Usamos la lista actual (filtrada o no)
      const currentList = allRequests.slice(0).reverse(); // Invertir para usar orden cronológico
      const slice = currentList.slice(from, to);
      
      if(slice.length === 0) { alert("No hay usuarios en ese rango."); return; }
      let count = 0;
      slice.forEach(req => {
        if(req.instagram) { window.open(`https://instagram.com/${req.instagram}`, '_blank'); count++; }
      });
      if(count === 0) alert("Ningún usuario en ese rango tiene Instagram.");
    }

    // --- 5. SUBIDA DE FOTO PORTADA (HERO) ---
    let heroFile = null;
    function setupHeroUpload() {
      document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        heroFile = file;
        const reader = new FileReader();
        reader.onload = (e) => { 
           document.getElementById('preview-img').src = e.target.result; 
           document.getElementById('preview-img').style.display = 'block';
           document.getElementById('btnSaveHero').style.display = 'inline-block';
        };
        reader.readAsDataURL(file);
      });
    }
    async function uploadHero() {
      if (!heroFile) return;
      const btn = document.getElementById('btnSaveHero'); btn.textContent = "SUBIENDO..."; btn.disabled = true;
      
      const fileName = `hero_${Date.now()}.jpg`;
      // Subir al bucket 'images'
      const { data, error } = await client.storage.from('images').upload(fileName, heroFile, { upsert: true });
      
      if (error) { alert("Error subiendo imagen: " + error.message); btn.textContent = "GUARDAR FOTO"; btn.disabled = false; return; }

      // Obtener URL pública
      const { data: { publicUrl } } = client.storage.from('images').getPublicUrl(fileName);
      
      // Guardar URL en site_config
      await client.from('site_config').update({ value: publicUrl }).eq('key', 'hero_image');
      
      alert("¡Portada actualizada con éxito!");
      btn.style.display = 'none'; heroFile = null;
    }
  </script>

</body>
</html>
