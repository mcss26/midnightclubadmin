<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Estilos específicos del admin que pasé en el bloque anterior de CSS */
    /* Asegúrate de pegar aquí el CSS del PASO 1 si no lo pones en styles.css */
    .filters-toolbar{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}.filters-toolbar::-webkit-scrollbar{display:none}.filter-chip{background:0 0;border:1px solid #333;color:#888;padding:8px 16px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .2s}.filter-chip:hover{border-color:#666;color:#fff}.filter-chip.active[data-status=pendiente]{background:var(--mc-red);border-color:var(--mc-red);color:#fff}.filter-chip.active[data-status=activo]{background:#cdfb3e;border-color:#cdfb3e;color:#000}.filter-chip.active[data-status=rechazado]{background:#666;border-color:#666;color:#fff}.filter-chip.active[data-status=all]{background:#fff;border-color:#fff;color:#000}.birthday-card{background:#111;border:1px solid #333;border-radius:8px;padding:20px;margin-bottom:30px}.birthday-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #222}.birthday-title{font-size:14px;font-weight:800;color:#fff;text-transform:uppercase}.birthday-icon{font-size:20px}.bd-list{list-style:none;padding:0;margin:0}.bd-item{display:flex;align-items:center;gap:15px;padding:12px 0;border-bottom:1px dashed #222}.bd-date{display:flex;flex-direction:column;align-items:center;background:#0a0a0a;border:1px solid var(--mc-red);padding:5px 10px;border-radius:6px;color:var(--mc-red)}.bd-day{font-size:10px;font-weight:700;text-transform:uppercase}.bd-num{font-size:16px;font-weight:800}.bd-info{flex:1}.bd-name{color:#fff;font-weight:700;font-size:14px}.bd-id{color:#666;font-size:11px}.no-birthdays{color:#666;font-size:12px;font-style:italic;text-align:center;padding:20px 0}
    
    /* Estilos base del admin previos */
    body { background-color: #000; }
    .admin-container { max-width: 1200px; margin: 80px auto 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 350px; gap: 40px; }
    @media (max-width: 900px) { .admin-container { grid-template-columns: 1fr; } }
    .section-title { font-family: 'Outfit', sans-serif; color: #fff; font-size: 20px; margin-bottom: 20px; text-transform: uppercase; border-left: 4px solid var(--mc-red); padding-left: 15px; }
    .request-card { background: #111; border: 1px solid #222; border-radius: 8px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .req-info h3 { margin: 0 0 5px 0; color: #fff; font-size: 16px; }
    .req-detail { color: #888; font-size: 12px; margin: 2px 0; font-family: monospace; }
    .req-actions { display: flex; gap: 10px; }
    .btn-action { border: none; padding: 10px 15px; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 11px; }
    .btn-approve { background: #cdfb3e; color: #000; }
    .btn-reject { background: #333; color: #fff; }
    .config-card { background: #111; border: 1px solid #333; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    .config-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--mc-red); }
    input:checked + .slider:before { transform: translateX(24px); }
  </style>
</head>
<body>

  <header style="position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); padding: 15px 20px; border-bottom: 1px solid #222; z-index: 100; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-family: 'Outfit'; font-weight: 900; color: #fff; letter-spacing: -1px;">MIDNIGHT<span style="color: var(--mc-red);">ADMIN</span></div>
    <button onclick="logout()" style="background: none; border: 1px solid #333; color: #888; padding: 5px 12px; border-radius: 4px; font-size: 10px; cursor: pointer;">CERRAR SESIÓN</button>
  </header>

  <div class="admin-container">

    <main>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div class="section-title" style="margin-bottom: 0;">Gestión de Socios</div>
        <button onclick="loadRequests()" style="background: #222; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; font-size: 11px; cursor: pointer;">↻ Actualizar</button>
      </div>

      <div class="filters-toolbar">
        <button class="filter-chip active" data-status="pendiente">Pendientes</button>
        <button class="filter-chip" data-status="activo">Activos</button>
        <button class="filter-chip" data-status="rechazado">Rechazados</button>
        <button class="filter-chip" data-status="all">Todos</button>
      </div>

      <div id="requests-list">
        <p style="color: #666;">Cargando solicitudes...</p>
      </div>
    </main>

    <aside>
      <div class="birthday-card">
        <div class="birthday-header">
          <div class="birthday-title">Cumpleaños Semanales</div>
          <div class="birthday-icon">🎂</div>
        </div>
        <p style="color: #666; font-size: 11px; margin-top: -15px; margin-bottom: 15px;">Lunes a Domingo de esta semana</p>
        <ul id="birthday-list" class="bd-list">
          <li class="no-birthdays">Cargando fechas...</li>
        </ul>
      </div>

      <div class="section-title">Estado de Accesos Públicos</div>
      <div id="config-list">Cargando configuración...</div>

      <div class="section-title" style="margin-top: 40px;">Imagen de Portada (Hero)</div>
      <div class="config-card">
        <input type="text" id="heroImgInput" placeholder="URL de la imagen (jpg/png)..." style="width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 10px; margin-bottom: 10px; font-family: monospace; font-size: 12px;">
        <button onclick="saveHeroImage()" style="width: 100%; background: #333; color: #fff; border: none; padding: 12px; font-weight: 700; cursor: pointer; font-size: 11px;">GUARDAR IMAGEN</button>
        <p style="color: #666; font-size: 10px; margin-top: 10px;">Usa "default" para volver a la original.</p>
      </div>
    </aside>

  </div>


  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258'; // <--- ¡NO OLVIDES TU CLAVE!
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Variable global para el filtro actual
    let currentFilter = 'pendiente';

    // Inicializar
    window.addEventListener('load', () => {
      checkAdminAuth();
      setupFilters();
      loadRequests(currentFilter); // Cargar con filtro inicial
      loadConfig();
      loadHeroImage();
      loadWeeklyBirthdays(); // Cargar cumpleaños
    });

    // Seguridad básica
    function checkAdminAuth() {
      const secret = prompt("Acceso Administrativo. Ingrese clave:");
      if (secret !== "midnight2026") { // <--- CLAVE TEMPORAL
        window.location.href = "index.html";
      }
    }
    function logout() { window.location.href = "index.html"; }


    // === 1. LÓGICA DE FILTROS ===
    function setupFilters() {
      const chips = document.querySelectorAll('.filter-chip');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          // Quitar activo a todos
          chips.forEach(c => c.classList.remove('active'));
          // Activar el clickeado
          chip.classList.add('active');
          // Actualizar variable y recargar
          currentFilter = chip.dataset.status;
          loadRequests(currentFilter);
        });
      });
    }


    // === 2. CARGAR SOLICITUDES (CON FILTRO) ===
    async function loadRequests(statusFilter) {
      const listContainer = document.getElementById('requests-list');
      listContainer.innerHTML = '<p style="color:#888;">Cargando...</p>';

      let query = client
        .from('members')
        .select('*')
        .order('created_at', { ascending: false }); // Más recientes primero

      // Aplicar filtro si no es "all"
      if (statusFilter !== 'all') {
        query = query.eq('status', statusFilter);
      }

      const { data: requests, error } = await query;

      if (error) {
        listContainer.innerHTML = `<p style="color:var(--mc-red);">Error: ${error.message}</p>`;
        return;
      }

      if (requests.length === 0) {
        listContainer.innerHTML = '<p style="color:#666; font-style:italic;">No hay solicitudes en esta categoría.</p>';
        return;
      }

      let html = '';
      requests.forEach(req => {
        // Definir botones según el estado
        let actionsBtn = '';
        if (req.status === 'pendiente') {
            actionsBtn = `
              <button class="btn-action btn-approve" onclick="procesar('${req.id}', 'activo', '${req.email}', '${req.nombre}', '${req.member_id}')">APROBAR</button>
              <button class="btn-action btn-reject" onclick="procesar('${req.id}', 'rechazado')">RECHAZAR</button>`;
        } else if (req.status === 'activo') {
            actionsBtn = `<span style="color:#cdfb3e; font-size:11px; font-weight:700;">ACTIVO ✅</span>`;
        } else {
             actionsBtn = `<span style="color:#666; font-size:11px; font-weight:700;">RECHAZADO ❌</span>`;
        }

        html += `
          <div class="request-card" style="border-left: 3px solid ${req.status === 'activo' ? '#cdfb3e' : (req.status === 'rechazado' ? '#666' : 'var(--mc-red)')}">
            <div class="req-info">
              <h3>${req.nombre} <span style="font-size:12px; color:#666;">(${req.member_id || 'Sin ID'})</span></h3>
              <div class="req-detail">🎂 ${req.nacimiento} | 📱 ${req.telefono}</div>
              <div class="req-detail">📸 ${req.instagram} | 📧 ${req.email}</div>
              <div class="req-detail" style="margin-top:5px; color:#fff;">PASS: ${req.access_password || 'Pendiente'}</div>
            </div>
            <div class="req-actions">
              ${actionsBtn}
            </div>
          </div>
        `;
      });
      listContainer.innerHTML = html;
    }

    // PROCESAR (Aprobar/Rechazar) - Sin cambios mayores
    async function procesar(id, nuevoEstado, email, nombre, memberId) {
      const { error } = await client.from('members').update({ status: nuevoEstado }).eq('id', id);
      if(error) { alert("Error al actualizar db"); return; }
      
      // Recargar lista con el filtro actual
      loadRequests(currentFilter);
      
      // (Aquí iría la lógica de envío de mail si la tuvieras implementada)
      if (nuevoEstado === 'activo') {
          console.log(`Enviar mail de bienvenida a ${email} (ID: ${memberId})`);
      }
    }


    // === 3. NUEVO: CUMPLEAÑOS SEMANALES (Lunes a Domingo) ===
    async function loadWeeklyBirthdays() {
      const bdList = document.getElementById('birthday-list');
      
      // 1. Calcular fechas de Lunes y Domingo de esta semana
      const today = new Date();
      const currentDay = today.getDay(); // 0=Dom, 1=Lun, ... 6=Sab
      
      // Ajustar para que la semana empiece el Lunes (si hoy es Dom(0), lo tratamos como día 7 para restar)
      const dayAdjusted = currentDay === 0 ? 7 : currentDay;
      
      const monday = new Date(today);
      monday.setDate(today.getDate() - (dayAdjusted - 1));
      monday.setHours(0,0,0,0);

      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      sunday.setHours(23,59,59,999);
      
      // 2. Obtener miembros ACTIVOS
      const { data: members, error } = await client
        .from('members')
        .select('id, nombre, member_id, nacimiento')
        .eq('status', 'activo');

      if (error || !members) {
        bdList.innerHTML = '<li class="no-birthdays">Error al cargar fechas.</li>';
        return;
      }

      // 3. Filtrar quién cumple esta semana
      const upcomingBirthdays = members.filter(member => {
        if (!member.nacimiento) return false;
        
        // Parsear fecha de nacimiento (YYYY-MM-DD o DD/MM/YYYY)
        let birthMonth, birthDay;
        if (member.nacimiento.includes('-')) {
           const parts = member.nacimiento.split('-');
           birthMonth = parseInt(parts[1], 10) - 1; // Meses en JS son 0-11
           birthDay = parseInt(parts[2], 10);
        } else if (member.nacimiento.includes('/')) {
           const parts = member.nacimiento.split('/');
           birthMonth = parseInt(parts[1], 10) - 1;
           birthDay = parseInt(parts[0], 10);
        } else return false;
        
        // Crear fecha de cumpleaños para ESTE AÑO
        const bdayThisYear = new Date(today.getFullYear(), birthMonth, birthDay);

        // Verificar si cae entre el Lunes y el Domingo calculados
        return bdayThisYear >= monday && bdayThisYear <= sunday;
      });

      // 4. Renderizar
      if (upcomingBirthdays.length === 0) {
        bdList.innerHTML = '<li class="no-birthdays">No hay cumpleaños esta semana.</li>';
        return;
      }

      // Ordenar por día de la semana
      upcomingBirthdays.sort((a, b) => {
         // (Lógica de ordenamiento simplificada basada en el día del mes)
         const getDay = (dateStr) => parseInt(dateStr.includes('-') ? dateStr.split('-')[2] : dateStr.split('/')[0], 10);
         return getDay(a.nacimiento) - getDay(b.nacimiento);
      });

      let html = '';
      const days = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];

      upcomingBirthdays.forEach(member => {
        let birthMonth, birthDay;
        if (member.nacimiento.includes('-')) {
           const parts = member.nacimiento.split('-'); birthMonth = parseInt(parts[1],10)-1; birthDay = parseInt(parts[2],10);
        } else {
           const parts = member.nacimiento.split('/'); birthMonth = parseInt(parts[1],10)-1; birthDay = parseInt(parts[0],10);
        }
        const bdayDate = new Date(today.getFullYear(), birthMonth, birthDay);
        const dayName = days[bdayDate.getDay()];

        html += `
          <li class="bd-item">
            <div class="bd-date">
              <span class="bd-day">${dayName}</span>
              <span class="bd-num">${birthDay}</span>
            </div>
            <div class="bd-info">
              <div class="bd-name">${member.nombre}</div>
              <div class="bd-id">${member.member_id}</div>
            </div>
          </li>
        `;
      });
      bdList.innerHTML = html;
    }


    // === FUNCIONES DE CONFIGURACIÓN (Existentes, sin cambios) ===
    async function loadConfig() {
      const container = document.getElementById('config-list');
      const { data: configs, error } = await client.from('site_config').select('*').order('id');
      if (error) { container.innerHTML = 'Error cargar config'; return; }
      let html = '';
      configs.forEach(conf => {
        if(conf.key.startsWith('access_') || conf.key.startsWith('mem_')) {
           html += `
            <div class="config-card">
              <div class="config-header">
                <span style="color:#fff; font-weight:700;">${conf.label}</span>
                <label class="switch">
                  <input type="checkbox" ${conf.is_active ? 'checked' : ''} onchange="toggleConfig('${conf.key}', this.checked)">
                  <span class="slider"></span>
                </label>
              </div>
              <input type="text" value="${conf.url || ''}" onchange="updateConfigUrl('${conf.key}', this.value)" placeholder="URL del Ticket (Passline)..." style="width:100%; background:#000; border:1px solid #333; color:#666; padding:8px; font-size:11px;">
            </div>`;
        }
      });
      container.innerHTML = html;
    }
    async function toggleConfig(key, isActive) {
      await client.from('site_config').update({ is_active: isActive }).eq('key', key);
    }
    async function updateConfigUrl(key, newUrl) {
      await client.from('site_config').update({ url: newUrl }).eq('key', key);
    }
    async function loadHeroImage() {
      const { data } = await client.from('site_config').select('value').eq('key', 'hero_image').single();
      if(data) document.getElementById('heroImgInput').value = data.value;
    }
    async function saveHeroImage() {
      const url = document.getElementById('heroImgInput').value.trim();
      const finalUrl = url === '' ? 'default' : url;
      await client.from('site_config').update({ value: finalUrl }).eq('key', 'hero_image');
      alert("Imagen actualizada.");
    }

  </script>
</body>
</html>
