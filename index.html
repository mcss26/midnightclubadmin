<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <title>Midnight Manager</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />

  

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>



  <style>

    body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; padding-bottom: 80px; }

    

    #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .login-box { width: 300px; text-align: center; }

    .login-input { width: 100%; padding: 15px; background: #111; border: 1px solid #333; color: #fff; text-align: center; margin-bottom: 15px; outline: none; }

    

    .dashboard { max-width: 800px; margin: 0 auto; padding: 20px; display: none; }

    .section-title { font-size: 18px; color: var(--mc-red); border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 50px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; }

    .btn-action { background: var(--mc-red); color: #fff; border: none; padding: 10px 15px; font-weight: 700; cursor: pointer; font-size: 12px; text-transform: uppercase; border-radius: 4px; }

    .btn-action:hover { opacity: 0.9; }



    /* Flyer Editor */

    .flyer-editor { background: #111; border: 1px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; border-radius: 8px; }

    .flyer-row { display: flex; gap: 10px; flex-wrap: wrap; }

    .flyer-input { flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 12px; font-family: 'Inter', sans-serif; font-weight: 700; text-transform: uppercase; border-radius: 4px; }

    .flyer-preview-container { text-align: center; background: #0a0a0a; padding: 20px; border: 1px solid #222; border-radius: 8px; min-height: 400px; display: flex; align-items: center; justify-content: center; flex-direction: column; }

    .flyer-preview { max-width: 100%; height: auto; max-height: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; }

    

    /* Config & Upload */

    .config-card { background: #111; border: 1px solid #333; padding: 15px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; border-radius: 6px; }

    .config-header { display: flex; justify-content: space-between; align-items: center; }

    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; border: none; }

    .status-active { background: #cdfb3e; color: #000; }

    .status-soldout { background: var(--mc-red); color: #fff; }

    .url-group { display: flex; gap: 5px; }

    .url-input { flex: 1; background: #000; border: 1px solid #333; color: #aaa; padding: 8px; font-size: 12px; font-family: monospace; outline: none; }

    .btn-save-url { background: #333; color: #fff; border: none; cursor: pointer; padding: 0 10px; font-size: 16px; }

    .upload-box { border: 2px dashed #333; padding: 30px; text-align: center; margin-bottom: 20px; border-radius: 8px; }

    #fileInput { display: none; }

    .upload-btn { background: #fff; color: #000; padding: 10px 20px; cursor: pointer; font-weight: 700; display: inline-block; border-radius: 4px; }

    #preview-img { max-width: 200px; margin-top: 20px; display: none; border: 1px solid #333; margin-left: auto; margin-right: auto; }



    /* Solicitudes */

    .search-bar-container { margin-bottom: 20px; }

    .search-input-admin { width: 100%; padding: 12px 15px; background: #111; border: 1px solid #444; color: #fff; font-size: 14px; border-radius: 4px; outline: none; }

    .req-card { background: #111; border: 1px solid #222; padding: 15px; margin-bottom: 10px; border-left: 3px solid #444; display: flex; gap: 15px; position: relative; border-radius: 4px; flex-direction: column; }

    @media(min-width: 600px) { .req-card { flex-direction: row; align-items: center; } }

    .req-card.approved { border-left-color: #cdfb3e; opacity: 0.6; }

    .req-number { font-size: 20px; font-weight: 900; color: #333; min-width: 30px; text-align: center; display: flex; align-items: center; }

    .req-content { flex: 1; }

    .req-info a { color: #aaa; text-decoration: underline; }

    .action-group { display: flex; gap: 8px; align-items: center; margin-top: 10px; }

    @media(min-width: 600px) { .action-group { margin-top: 0; margin-left: auto; } }

    .btn-delete { background: transparent; border: 1px solid #333; color: #666; padding: 8px; cursor: pointer; font-size: 10px; border-radius: 4px; }

    .btn-delete:hover { border-color: var(--mc-red); color: var(--mc-red); }

    

    .insta-toolbar { background: #111; border: 1px solid #333; padding: 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; position: sticky; top: 10px; z-index: 50; box-shadow: 0 10px 20px rgba(0,0,0,0.5); flex-wrap: wrap; }

    .insta-input { background: #000; border: 1px solid #444; color: #fff; padding: 8px; width: 60px; text-align: center; font-weight: 700; }

    .btn-bulk { background: #fff; color: #000; border: none; padding: 8px 15px; font-weight: 800; cursor: pointer; font-size: 12px; flex: 1; }

  </style>

</head>

<body>



  <div id="login-overlay">

    <div class="login-box">

      <h2 style="color:var(--mc-red);">SYSTEM ADMIN</h2>

      <input type="password" id="passInput" class="login-input" placeholder="PASSWORD">

      <button onclick="login()" class="btn-action" style="width:100%">INGRESAR</button>

    </div>

  </div>



  <div id="dashboard" class="dashboard">

    <h1 style="text-align:center; margin-bottom:40px;">PANEL DE CONTROL</h1>



    <div class="section-title">Generador de Flyers</div>

    <div class="flyer-editor">

      <div class="flyer-row">

        <input type="text" id="flyerDate" class="flyer-input" placeholder="FECHA (Ej: SABADO 22.11)">

        <input type="text" id="flyerDJ" class="flyer-input" placeholder="DJ GUEST (Ej: KOOZA)">

      </div>

      <div class="flyer-row">

        <button onclick="saveFlyerTexts()" class="btn-action" style="background:#333; flex:1;">GUARDAR TEXTOS</button>

        <button onclick="generateFlyer()" class="btn-action" style="flex:1;">✨ GENERAR FLYER</button>

      </div>

    </div>

    <div class="flyer-preview-container">

      <canvas id="flyerCanvas" width="1080" height="1920" style="display:none;"></canvas>

      <img id="finalFlyer" class="flyer-preview" alt="Aquí aparecerá tu flyer">

      <p id="flyerStatus" style="color:#666; font-size:12px; margin-top:10px;">Presiona GENERAR para ver la vista previa</p>

      <a id="downloadFlyer" class="btn-action" style="text-decoration:none; display:none; margin-top:15px; background:#fff; color:#000;">DESCARGAR IMAGEN</a>

    </div>



    <div class="section-title">Gestión de Accesos</div>

    <div id="config-list">Cargando configuración...</div>



    <div class="section-title">Imagen de Portada</div>

    <div class="upload-box">

      <label for="fileInput" class="upload-btn">SUBIR NUEVA FOTO</label>

      <input type="file" id="fileInput" accept="image/*">

      <img id="preview-img" src="" alt="">

      <br><button id="btnSaveHero" class="btn-action" style="margin-top:15px; display:none;" onclick="uploadHero()">GUARDAR FOTO</button>

    </div>



    <div class="section-title">Solicitudes Member ID</div>

    <div class="insta-toolbar">

      <span style="font-size:12px; font-weight:700; color:#aaa;">ABRIR INSTAGRAM:</span>

      <input type="number" id="instaFrom" class="insta-input" placeholder="DE">

      <input type="number" id="instaTo" class="insta-input" placeholder="A">

      <button onclick="openBulkInstagrams()" class="btn-bulk">ABRIR PERFILES ↗</button>

    </div>

    <div class="search-bar-container">

      <input type="text" id="searchMembers" class="search-input-admin" placeholder="🔍 Buscar por Nombre, Instagram, ID...">

    </div>

    <button onclick="loadRequests()" style="margin-bottom:15px; background:none; border:1px solid #333; color:#fff; padding:5px;">↻ Recargar Lista</button>

    <div id="requests-list"></div>

  </div>



  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    // --- CONFIGURACIÓN INICIAL ---
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    // 👇👇👇 ¡PEGA TU CLAVE SUPABASE AQUÍ! 👇👇👇
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258'; 

    // --- CONFIGURACIÓN EMAILJS (¡AHORA SON 4 CLAVES!) ---
    const EMAILJS_PUBLIC_KEY = "FaYbPCI_5oJSsC9g4";
    const EMAILJS_SERVICE_ID = "service_j7h80jk";
    // Template para Cumpleaños
    const EMAILJS_TEMPLATE_CUMPLE = "template_rmkp7zo"; 
    // 👇👇👇 NUEVO: Template para Aprobación de Socio 👇👇👇
    const EMAILJS_TEMPLATE_APROBADO = "template_l425bfo"; 


    // Inicializar clientes
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    (function(){
      try { emailjs.init(EMAILJS_PUBLIC_KEY); } catch(e) { console.error("Error init EmailJS:", e); }
    })();
    
    let currentFilter = 'pendiente';

    window.addEventListener('load', () => {
      checkAdminAuth(); setupFilters(); loadRequests(currentFilter);
      loadConfig(); loadHeroImage(); loadWeeklyBirthdays();
    });


    // --- SEGURIDAD ---
    function checkAdminAuth() {
      const secret = prompt("Acceso Administrativo. Ingrese clave maestra:");
      if (secret !== "midnight2026") window.location.href = "index.html"; // CLAVE TEMPORAL
    }
    function logout() { if(confirm("¿Cerrar sesión?")) window.location.href = "index.html"; }


    // --- 1. FILTROS ---
    function setupFilters() {
      const chips = document.querySelectorAll('.filter-chip');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          chips.forEach(c => c.classList.remove('active')); chip.classList.add('active');
          currentFilter = chip.dataset.status; loadRequests(currentFilter);
        });
      });
    }


    // --- 2. GESTIÓN DE SOLICITUDES (ACTUALIZADO PARA ENVIAR MAIL) ---
    async function loadRequests(statusFilter) {
      const listContainer = document.getElementById('requests-list');
      listContainer.innerHTML = '<div class="loading-state">Actualizando datos...</div>';

      let query = client.from('members').select('*').order('created_at', { ascending: false });
      if (statusFilter !== 'all') query = query.eq('status', statusFilter);

      const { data: requests, error } = await query;
      if (error) { listContainer.innerHTML = `<div class="error-state">Error: ${error.message}</div>`; return; }
      if (!requests || requests.length === 0) { listContainer.innerHTML = '<div class="empty-state">No hay solicitudes.</div>'; return; }

      let html = '';
      requests.forEach(req => {
        let rightPanel = ''; let borderColor = '';
        // Escapar nombres con comillas simples para evitar errores de JS
        const safeName = req.nombre ? req.nombre.replace(/'/g, "\\'") : 'Usuario';
        const safeEmail = req.email || '';
        const safeMemberID = req.member_id || '';

        if (req.status === 'pendiente') {
            borderColor = 'var(--mc-red)';
            // SE ACTUALIZARON LOS PARÁMETROS QUE SE PASAN A 'procesar'
            rightPanel = `
              <div class="req-actions">
                <button class="btn-action btn-approve" onclick="procesar('${req.id}', 'activo', '${safeName}', '${safeEmail}', '${safeMemberID}')">APROBAR</button>
                <button class="btn-action btn-reject" onclick="procesar('${req.id}', 'rechazado')">RECHAZAR</button>
              </div>`;
        } else if (req.status === 'activo') {
            borderColor = 'var(--mc-accent-green)';
            rightPanel = `<span class="status-badge status-active">ACTIVO ✅</span>`;
        } else {
             borderColor = '#666';
             rightPanel = `<span class="status-badge status-rejected">RECHAZADO ❌</span>`;
        }

        html += `
          <div class="request-card" style="border-left: 4px solid ${borderColor}">
            <div class="req-info">
              <h3>${req.nombre} <span class="req-id-badge">${req.member_id || 'Sin ID'}</span></h3>
              <div class="req-detail-row"><span class="req-detail"><span class="req-icon">🎂</span> ${req.nacimiento || '—'}</span><span class="req-detail"><span class="req-icon">📱</span> ${req.telefono}</span></div>
              <div class="req-detail-row"><span class="req-detail"><span class="req-icon">📸</span> ${req.instagram}</span><span class="req-detail"><span class="req-icon">📧</span> ${req.email}</span></div>
              <div class="req-pass"><span class="pass-label">ACCESO INICIAL:</span> ${req.access_password || '—'}</div>
            </div>
            ${rightPanel}
          </div>`;
      });
      listContainer.innerHTML = html;
    }

    // --- FUNCIÓN PROCESAR ACTUALIZADA (ENVÍA MAIL AL APROBAR) ---
    async function procesar(id, nuevoEstado, nombre, email, memberId) {
      document.body.style.cursor = 'wait';
      
      // 1. Actualizar en Supabase
      const { error } = await client.from('members').update({ status: nuevoEstado }).eq('id', id);
      
      document.body.style.cursor = 'default';

      if(error) { 
        alert("Error DB: " + error.message); 
      } else { 
        // 2. Si se aprobó, enviar email de bienvenida en segundo plano
        if (nuevoEstado === 'activo' && email && email.includes('@')) {
           console.log("Enviando email de aprobación a: " + email);
           const templateParams = {
              to_name: nombre,
              to_email: email,
              member_id: memberId || 'Pendiente',
              login_url: 'https://midnightclub.biz' // <--- CAMBIA ESTO SI TU URL ES OTRA
           };
           // No esperamos a que termine el envío para no trabar el admin (fire and forget)
           emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_APROBADO, templateParams)
             .catch(err => console.error("Error enviando mail de aprobación:", err));
        }

        // 3. Recargar lista
        loadRequests(currentFilter); 
      }
    }


    // --- 3. WIDGET CUMPLEAÑOS (CON BOTÓN PROMO) ---
    async function loadWeeklyBirthdays() {
      const bdList = document.getElementById('birthday-list');
      const today = new Date(); const currentDay = today.getDay(); 
      const dayAdjusted = currentDay === 0 ? 7 : currentDay;
      const monday = new Date(today); monday.setDate(today.getDate() - (dayAdjusted - 1)); monday.setHours(0,0,0,0);
      const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);
      
      const { data: members, error } = await client.from('members').select('id, nombre, member_id, nacimiento, email').eq('status', 'activo');
      if (error || !members) { bdList.innerHTML = '<li class="no-birthdays">Error al cargar fechas.</li>'; return; }

      const upcomingBirthdays = members.filter(member => {
        if (!member.nacimiento || member.nacimiento.length < 5) return false;
        let birthMonth, birthDay;
        if (member.nacimiento.includes('-')) {
           const parts = member.nacimiento.split('-'); birthMonth = parseInt(parts[1], 10) - 1; birthDay = parseInt(parts[2], 10);
        } else if (member.nacimiento.includes('/')) {
           const parts = member.nacimiento.split('/'); birthMonth = parseInt(parts[1], 10) - 1; birthDay = parseInt(parts[0], 10);
        } else return false;
        const bdayThisYear = new Date(today.getFullYear(), birthMonth, birthDay);
        return bdayThisYear >= monday && bdayThisYear <= sunday;
      });

      if (upcomingBirthdays.length === 0) { bdList.innerHTML = '<li class="no-birthdays">No hay cumpleaños esta semana.</li>'; return; }

      upcomingBirthdays.sort((a, b) => {
         const getDay = (dateStr) => parseInt(dateStr.includes('-') ? dateStr.split('-')[2] : dateStr.split('/')[0], 10);
         return getDay(a.nacimiento) - getDay(b.nacimiento);
      });

      let html = ''; const daysShort = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
      upcomingBirthdays.forEach(member => {
        let birthMonth, birthDay;
        if (member.nacimiento.includes('-')) {
           const parts = member.nacimiento.split('-'); birthMonth = parseInt(parts[1],10)-1; birthDay = parseInt(parts[2],10);
        } else {
           const parts = member.nacimiento.split('/'); birthMonth = parseInt(parts[1],10)-1; birthDay = parseInt(parts[0],10);
        }
        const bdayDate = new Date(today.getFullYear(), birthMonth, birthDay);
        const dayName = daysShort[bdayDate.getDay()];
        const safeName = member.nombre.replace(/'/g, "\\'");
        const safeEmail = member.email || '';

        html += `
          <li class="bd-item">
            <div class="bd-date-box"><span class="bd-day">${dayName}</span><span class="bd-num">${birthDay}</span></div>
            <div><div class="bd-name">${member.nombre}</div><div class="bd-id">${member.member_id || 'Sin ID'}</div></div>
            <div style="margin-left: auto;"><button class="btn-send-promo" onclick="sendBirthdayPromo('${safeEmail}', '${safeName}', this)">🎁 Enviar Promo</button></div>
          </li>`;
      });
      bdList.innerHTML = html;
    }

    // Función: Enviar Promo Cumpleaños
    async function sendBirthdayPromo(email, name, btnElement) {
        if (!email || email.length < 5 || !email.includes('@')) { alert("Este usuario no tiene un email válido."); return; }
        if (!confirm(`¿Enviar la propuesta de cumpleaños a ${name}?`)) return;
        const originalText = btnElement.innerHTML;
        btnElement.textContent = "Enviando..."; btnElement.disabled = true;
        const templateParams = { to_name: name, to_email: email };
        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_CUMPLE, templateParams)
            .then(() => { btnElement.textContent = "¡Enviado! ✅"; btnElement.classList.add('sent'); }, 
                  (err) => { console.error(err); alert("Error al enviar."); btnElement.innerHTML = originalText; btnElement.disabled = false; });
    }


    // --- 4. CONFIGURACIÓN DEL SITIO ---
    async function loadConfig() {
      const container = document.getElementById('config-list');
      const { data: configs, error } = await client.from('site_config').select('*').order('id');
      if (error) { container.innerHTML = '<div class="error-state" style="font-size:12px;">Error config DB</div>'; return; }
      let html = '';
      configs.forEach(conf => {
        if(conf.key.startsWith('access_') || conf.key.startsWith('mem_')) {
           html += `
            <div class="config-item">
              <div class="config-header">
                <span class="config-label">${conf.label}</span>
                <label class="switch"><input type="checkbox" ${conf.is_active ? 'checked' : ''} onchange="toggleConfig('${conf.key}', this.checked)"><span class="slider"></span></label>
              </div>
              <input type="text" class="config-input" value="${conf.url || ''}" onchange="updateConfigUrl('${conf.key}', this.value)" placeholder="Pegar URL de Passline aquí...">
            </div>`;
        }
      });
      container.innerHTML = html || '<div class="empty-state">Sin configuraciones.</div>';
    }
    async function toggleConfig(key, isActive) { await client.from('site_config').update({ is_active: isActive }).eq('key', key); }
    async function updateConfigUrl(key, newUrl) { await client.from('site_config').update({ url: newUrl }).eq('key', key); }
    async function loadHeroImage() {
      const { data } = await client.from('site_config').select('value').eq('key', 'hero_image').single();
      if(data) document.getElementById('heroImgInput').value = data.value;
    }
    async function saveHeroImage() {
      const btn = document.querySelector('.btn-save'); btn.textContent = "GUARDANDO..."; btn.disabled = true;
      const url = document.getElementById('heroImgInput').value.trim();
      const finalUrl = (url === '' || url.toLowerCase() === 'default') ? 'default' : url;
      await client.from('site_config').update({ value: finalUrl }).eq('key', 'hero_image');
      btn.textContent = "¡GUARDADO!"; setTimeout(() => { btn.textContent = "GUARDAR IMAGEN"; btn.disabled = false; }, 2000);
    }
  </script>

</body>

</html>
