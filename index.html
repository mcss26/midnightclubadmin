<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-styles.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Estilos específicos para el Dashboard Principal */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .dash-card {
      background: var(--mc-card-bg);
      border: 1px solid var(--mc-border);
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
      text-decoration: none; /* Porque serán enlaces */
      display: block;
    }
    .dash-card:hover {
      transform: translateY(-5px);
      border-color: #fff;
    }
    
    /* Colores específicos por tarjeta (Hover) */
    .card-solicitudes:hover { border-color: var(--mc-red); }
    .card-accesos:hover { border-color: var(--mc-accent-green); }
    .card-cumples:hover { border-color: #FFD700; } /* Dorado */
    .card-carta:hover { border-color: #d600ff; } /* Violeta Neón */

    .dash-icon { font-size: 32px; margin-bottom: 15px; display: block; }
    .dash-title { color: #fff; font-family: 'Outfit', sans-serif; font-size: 16px; text-transform: uppercase; margin-bottom: 10px; }
    .dash-count { font-size: 36px; font-weight: 900; color: #fff; line-height: 1; }
    .dash-count.pending { color: var(--mc-red); }
    .dash-sub { color: #888; font-size: 11px; margin-top: 5px; }

    /* Login Overlay */
    #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .login-box { width: 300px; text-align: center; background: #111; padding: 30px; border: 1px solid #333; border-radius: 8px; }
    .login-input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; text-align: center; margin: 20px 0; outline: none; font-family: monospace; }
    .btn-login { background: var(--mc-red); color: #fff; border: none; padding: 12px; width: 100%; font-weight: 800; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2 style="color:var(--mc-red); font-family:'Outfit'; margin:0;">MIDNIGHT ADMIN</h2>
      <p style="color:#666; font-size:12px;">Acceso restringido</p>
      <input type="password" id="passInput" class="login-input" placeholder="CONTRASEÑA">
      <button onclick="login()" class="btn-login">INGRESAR</button>
    </div>
  </div>

  <div id="main-content" style="display: none;">
    
    <header class="admin-header">
      <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-red);">ADMIN</span> / HOME</div>
      <button onclick="logout()" class="btn-logout">CERRAR SESIÓN</button>
    </header>

    <div class="admin-container" style="max-width: 900px;">
      
      <div class="section-header" style="border: none;">
        <h2 class="section-title" style="font-size: 28px;">Resumen General</h2>
      </div>
      <p style="color: #888; margin-top: -15px;">Selecciona una sección para gestionar.</p>

      <div class="dashboard-grid">
        
        <a href="admin-solicitudes.html" class="dash-card card-solicitudes">
          <span class="dash-icon">👥</span>
          <h3 class="dash-title">Solicitudes</h3>
          <div id="count-pending" class="dash-count pending">--</div>
          <div class="dash-sub">Pendientes de aprobación</div>
        </a>

        <a href="admin-accesos.html" class="dash-card card-accesos">
          <span class="dash-icon">🎟️</span>
          <h3 class="dash-title">Accesos & Config</h3>
          <div id="count-active-tickets" class="dash-count">--</div>
          <div class="dash-sub">Tickets activos actualmente</div>
        </a>

        <a href="admin-cumples.html" class="dash-card card-cumples">
          <span class="dash-icon">🎂</span>
          <h3 class="dash-title">Cumpleaños</h3>
          <div id="count-birthdays" class="dash-count">--</div>
          <div class="dash-sub">Esta semana (Lun-Dom)</div>
        </a>

        <a href="admin-carta.html" class="dash-card card-carta">
          <span class="dash-icon">🍹</span>
          <h3 class="dash-title">Carta Digital</h3>
          <div id="count-menu" class="dash-count">--</div>
          <div class="dash-sub">Productos activos</div>
        </a>

      </div>

    </div>
  </div>


  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- 1. LOGIN ---
    function login() {
      const pass = document.getElementById('passInput').value;
      if (pass === 'midnight2026') { 
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        loadDashboardCounts();
      } else {
        alert('Contraseña incorrecta.');
        document.getElementById('passInput').value = '';
        document.getElementById('passInput').focus();
      }
    }
    document.getElementById('passInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') login(); });
    function logout() { window.location.reload(); }


    // --- 2. CARGAR CONTADORES ---
    async function loadDashboardCounts() {
      // A. Solicitudes Pendientes
      const { count: pendingCount } = await client
        .from('members')
        .select('id', { count: 'exact', head: true }) 
        .eq('status', 'pendiente');
      document.getElementById('count-pending').textContent = pendingCount || '0';

      // B. Tickets Activos
      const { count: ticketCount } = await client
        .from('site_config')
        .select('id', { count: 'exact', head: true })
        .eq('is_active', true)
        .like('key', 'access_%'); // Contamos access_0000 y access_plus
      document.getElementById('count-active-tickets').textContent = ticketCount || '0';

      // C. Carta (Items Activos) - NUEVO
      const { count: menuCount } = await client
        .from('menu_items')
        .select('id', { count: 'exact', head: true })
        .eq('is_active', true);
      document.getElementById('count-menu').textContent = menuCount || '0';

      // D. Cumpleaños Semana
      const { data: members } = await client
        .from('members')
        .select('nacimiento')
        .eq('status', 'activo');
      
      if (members) {
        const today = new Date();
        const currentDay = today.getDay(); const dayAdjusted = currentDay === 0 ? 7 : currentDay;
        const monday = new Date(today); monday.setDate(today.getDate() - (dayAdjusted - 1)); monday.setHours(0,0,0,0);
        const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);

        let bdayCount = 0;
        members.forEach(m => {
          if (!m.nacimiento || m.nacimiento.length < 5) return;
          let bMonth, bDay;
          if (m.nacimiento.includes('-')) { const p = m.nacimiento.split('-'); bMonth = parseInt(p[1],10)-1; bDay = parseInt(p[2],10); }
          else if (m.nacimiento.includes('/')) { const p = m.nacimiento.split('/'); bMonth = parseInt(p[1],10)-1; bDay = parseInt(p[0],10); }
          else return;
          const bdayThisYear = new Date(today.getFullYear(), bMonth, bDay);
          if (bdayThisYear >= monday && bdayThisYear <= sunday) bdayCount++;
        });
        document.getElementById('count-birthdays').textContent = bdayCount;
      } else {
        document.getElementById('count-birthdays').textContent = '0';
      }
    }
  </script>
</body>
</html>
