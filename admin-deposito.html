<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Depósito</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: #FFD700;">DEPÓSITO</span></div>
    <button onclick="window.location.href='admin-panel.html'" class="btn-logout">VOLVER</button>
  </header>

  <div class="admin-container">
    
    <div class="dash-card" style="height:auto; border-left:4px solid var(--mc-red); margin-bottom:30px;">
        <h3 style="margin:0 0 10px 0; font-size:14px; color:var(--mc-red);">⚠ AJUSTES OPERATIVOS RECIENTES</h3>
        <div id="logList" style="font-size:12px; color:#ccc;">Cargando novedades...</div>
    </div>

    <div class="section-header">
        <h2 class="section-title">Necesidades de Compra</h2>
        <input type="text" id="searchInp" class="search-input-admin" placeholder="🔍 Filtrar..." style="width:200px; margin:0;" oninput="filter()">
    </div>

    <div id="stockList" class="data-list"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allItems = [];

    window.onload = async () => {
        loadLogs();
        const { data } = await client.from('inventory_skus').select('*, suppliers(name)').order('name');
        allItems = data || [];
        render(allItems);
    };

    async function loadLogs() {
        // Traer últimos 5 ajustes manuales (robos/roturas)
        const { data } = await client.from('inventory_movements')
            .select('*').ilike('movement_type', 'AJUSTE%').order('created_at',{ascending:false}).limit(5);
        
        if(!data || !data.length) { document.getElementById('logList').innerHTML = 'Sin novedades.'; return; }
        
        document.getElementById('logList').innerHTML = data.map(m => 
            `<div style="border-bottom:1px dashed #333; padding:5px 0; display:flex; justify-content:space-between;">
                <span>${m.movement_type.replace('AJUSTE_','')} <span style="color:#666;">(${m.created_at.split('T')[0]})</span></span>
                <span style="font-weight:700;">${m.change_amount} u. (${m.admin_name})</span>
            </div>`
        ).join('');
    }

    function render(list) {
        const c = document.getElementById('stockList');
        c.innerHTML = list.map(i => {
            const cur = parseFloat(i.stock_current)||0;
            const ide = parseFloat(i.ideal_stock)||0;
            const diff = ide - cur;
            const needsBuy = diff > 0;
            
            // Botón Cargar Orden
            let actionBtn = '';
            if(needsBuy) {
                if(i.preferred_supplier_id) {
                    // Enlace mágico con parámetros
                    const url = `admin-compras.html?auto=true&sku=${i.id}&qty=${diff}&sup=${i.preferred_supplier_id}`;
                    actionBtn = `<button onclick="window.location.href='${url}'" class="btn-primary" style="padding:8px 15px; font-size:11px;">⚡ CARGAR ORDEN (${diff})</button>`;
                } else {
                    actionBtn = `<span style="font-size:9px; color:#666;">Sin Proveedor</span>`;
                }
            } else {
                actionBtn = `<span style="font-size:10px; color:var(--mc-accent-green); font-weight:700;">STOCK OK</span>`;
            }

            return `
            <div class="dash-card" style="height:auto; display:flex; justify-content:space-between; align-items:center; padding:15px;">
                <div>
                    <div style="font-weight:700; font-size:14px; color:#fff;">${i.name}</div>
                    <div style="font-size:11px; color:#888;">Actual: <b>${cur}</b> / Ideal: <b>${ide}</b></div>
                    ${i.suppliers ? `<div style="font-size:9px; color:#555;">Prov: ${i.suppliers.name}</div>` : ''}
                </div>
                <div>${actionBtn}</div>
            </div>`;
        }).join('');
    }
    
    function filter(){ render(allItems.filter(i=>i.name.toLowerCase().includes(document.getElementById('searchInp').value.toLowerCase()))); }
  </script>
</body>
</html>
