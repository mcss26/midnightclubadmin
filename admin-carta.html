<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Carta</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Estilos Modal y Listas */
    .menu-item-card { background: #111; padding: 15px; border: 1px solid #333; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .item-actions { display: flex; align-items: center; gap: 10px; }
    .price-input { width: 80px; background: #000; border: 1px solid #444; color: #fff; padding: 8px; text-align: right; border-radius: 4px; }
    .filter-chips { display: flex; gap: 5px; margin-bottom: 20px; overflow-x: auto; }
    .filter-chip { background: #111; color: #888; border: 1px solid #333; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 11px; text-transform: uppercase; }
    .filter-chip.active { background: var(--mc-red); color: #fff; border-color: var(--mc-red); }
    
    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; }
    .modal-box { background: #111; padding: 30px; border-radius: 12px; border: 1px solid #333; width: 90%; max-width: 400px; }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-red);">CARTA</span></div>
    <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
  </header>

  <div class="admin-container">
    <div class="section-header">
        <h2 class="section-title">Productos</h2>
        <button onclick="openModal()" class="btn-refresh" style="background:#fff; color:#000;">+ NUEVO</button>
    </div>

    <div class="filters-toolbar filter-chips">
        <button class="filter-chip active" onclick="filter('all', this)">Todos</button>
        <button class="filter-chip" onclick="filter('vasos', this)">Tragos</button>
        <button class="filter-chip" onclick="filter('packs', this)">Packs</button>
        <button class="filter-chip" onclick="filter('baja', this)">Baja</button>
        <button class="filter-chip" onclick="filter('sin-alcohol', this)">Soft</button>
    </div>

    <div id="menu-list"><div class="loading-state">Cargando...</div></div>
  </div>

  <div id="itemModal" class="modal-overlay">
    <div class="modal-box">
        <h3 style="color:#fff; margin-top:0;">Editar Item</h3>
        <input type="hidden" id="editId">
        <input type="text" id="editName" class="modal-input" placeholder="Nombre">
        <input type="text" id="editDesc" class="modal-input" placeholder="Descripción">
        <div style="display:flex; gap:10px;">
            <input type="number" id="editPrice" class="modal-input" placeholder="Precio Lista">
            <select id="editCat" class="modal-select">
                <option value="vasos">Tragos</option>
                <option value="packs">Packs</option>
                <option value="baja">Baja</option>
                <option value="sin-alcohol">Soft</option>
            </select>
        </div>
        <input type="text" id="editSub" class="modal-input" placeholder="Subcategoría (ej: Vodka)">
        <div class="modal-btns">
            <button onclick="document.getElementById('itemModal').style.display='none'" class="btn-modal-cancel">CANCELAR</button>
            <button onclick="saveItem()" class="btn-modal-save">GUARDAR</button>
        </div>
        <button onclick="deleteItem()" id="btnDelete" style="width:100%; margin-top:15px; background:none; border:none; color:#666; cursor:pointer;">ELIMINAR</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let allItems = [];
    let currentCat = 'all';

    window.onload = loadItems;

    async function loadItems() {
        const { data } = await client.from('menu_items').select('*').order('name');
        allItems = data;
        renderItems();
    }

    function renderItems() {
        const list = currentCat === 'all' ? allItems : allItems.filter(i => i.category === currentCat);
        const container = document.getElementById('menu-list');
        container.innerHTML = list.map(i => `
            <div class="menu-item-card" style="opacity:${i.is_active?1:0.5}">
                <div>
                    <div style="color:#fff; font-weight:700;">${i.name}</div>
                    <div style="color:#666; font-size:10px;">${i.subcategory||'-'}</div>
                </div>
                <div class="item-actions">
                    <input type="checkbox" ${i.is_active?'checked':''} onchange="toggle(${i.id}, this.checked)">
                    <input type="number" class="price-input" value="${i.price}" onchange="updatePrice(${i.id}, this.value)">
                    <button onclick="edit(${i.id})" style="background:none; border:none; cursor:pointer;">✏️</button>
                </div>
            </div>
        `).join('');
    }

    function filter(cat, btn) {
        currentCat = cat;
        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderItems();
    }

    async function toggle(id, val) { await client.from('menu_items').update({is_active:val}).eq('id',id); }
    async function updatePrice(id, val) { await client.from('menu_items').update({price:val}).eq('id',id); }

    function edit(id) {
        const i = allItems.find(x => x.id === id);
        document.getElementById('editId').value = i.id;
        document.getElementById('editName').value = i.name;
        document.getElementById('editDesc').value = i.description;
        document.getElementById('editPrice').value = i.price;
        document.getElementById('editCat').value = i.category;
        document.getElementById('editSub').value = i.subcategory;
        document.getElementById('btnDelete').style.display = 'block';
        document.getElementById('itemModal').style.display = 'flex';
    }
    
    function openModal() {
        document.getElementById('editId').value = '';
        document.getElementById('editName').value = '';
        document.getElementById('editPrice').value = '';
        document.getElementById('btnDelete').style.display = 'none';
        document.getElementById('itemModal').style.display = 'flex';
    }

    async function saveItem() {
        const id = document.getElementById('editId').value;
        const data = {
            name: document.getElementById('editName').value,
            description: document.getElementById('editDesc').value,
            price: document.getElementById('editPrice').value,
            category: document.getElementById('editCat').value,
            subcategory: document.getElementById('editSub').value,
        };
        if(id) await client.from('menu_items').update(data).eq('id',id);
        else await client.from('menu_items').insert(data);
        document.getElementById('itemModal').style.display = 'none';
        loadItems();
    }

    async function deleteItem() {
        const id = document.getElementById('editId').value;
        if(confirm("¿Eliminar?")) {
            await client.from('menu_items').delete().eq('id',id);
            document.getElementById('itemModal').style.display = 'none';
            loadItems();
        }
    }
  </script>
</body>
</html>
