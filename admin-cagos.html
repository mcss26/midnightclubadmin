<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Master Cargos</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-accent-purple);">ROLES</span></div>
    <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
  </header>

  <div class="admin-container">
    <div class="section-header">
        <h2 class="section-title">Cargos & Estructura</h2>
        <button onclick="openModal()" class="btn-refresh" style="background:#fff; color:#000;">+ NUEVO CARGO</button>
    </div>

    <div id="rolesList" class="dashboard-grid"></div>
  </div>

  <div id="roleModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Definir Cargo</h3>
        <input type="hidden" id="rId">
        <label class="input-label">NOMBRE DEL PUESTO</label>
        <input type="text" id="rName" class="modal-input" placeholder="Ej: Bartender Principal">
        
        <label class="input-label">HONORARIO BASE (JORNAL)</label>
        <input type="number" id="rPay" class="modal-input" placeholder="$ 0">

        <label class="input-label">MODALIDAD CONTRATACIÓN</label>
        <select id="rBill" class="modal-select">
            <option value="MONOTRIBUTO">Monotributo (Factura C)</option>
            <option value="RELACION_DEPENDENCIA">Relación de Dependencia</option>
            <option value="TERCERIZADO">Tercerizado (Agencia)</option>
            <option value="INFORMAL">Jornal (Recibo X)</option>
        </select>

        <div class="modal-btns">
            <button onclick="closeModal()" class="btn-modal-cancel">CANCELAR</button>
            <button onclick="saveRole()" class="btn-modal-save">GUARDAR</button>
        </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.onload = loadRoles;

    async function loadRoles() {
        const { data } = await client.from('staff_roles').select('*').order('role_name');
        const c = document.getElementById('rolesList');
        c.innerHTML = data.map(r => `
            <div class="dash-card" style="height:auto; display:block;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 class="dash-title" style="color:var(--mc-accent-purple);">${r.role_name}</h3>
                    <button onclick="edit(${r.id})" style="border:none; background:none; color:#666; cursor:pointer;">✏️</button>
                </div>
                <div class="dash-desc" style="margin-top:10px;">Base: $${r.base_pay}</div>
                <div class="dash-desc">${r.billing_condition}</div>
            </div>
        `).join('');
    }

    function openModal() { document.getElementById('roleModal').style.display='flex'; document.getElementById('rId').value=''; }
    function closeModal() { document.getElementById('roleModal').style.display='none'; }
    
    async function edit(id) {
        const { data } = await client.from('staff_roles').select('*').eq('id',id).single();
        document.getElementById('rId').value = data.id;
        document.getElementById('rName').value = data.role_name;
        document.getElementById('rPay').value = data.base_pay;
        document.getElementById('rBill').value = data.billing_condition;
        document.getElementById('roleModal').style.display='flex';
    }

    async function saveRole() {
        const id = document.getElementById('rId').value;
        const payload = {
            role_name: document.getElementById('rName').value,
            base_pay: document.getElementById('rPay').value,
            billing_condition: document.getElementById('rBill').value
        };
        if(id) await client.from('staff_roles').update(payload).eq('id',id);
        else await client.from('staff_roles').insert(payload);
        closeModal(); loadRoles();
    }
  </script>
</body>
</html>
