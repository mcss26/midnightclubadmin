<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Accesos</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .config-item { background: #111; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px; }
    .config-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .config-label { color: #fff; font-weight: 700; text-transform: uppercase; font-size: 14px; }
    .config-input { width: 100%; background: #000; border: 1px solid #444; color: var(--mc-accent-green); padding: 10px; border-radius: 4px; outline: none; font-family: monospace; font-size: 12px; }
    
    /* Switch */
    .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--mc-accent-green); }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-red);">ADMIN</span></div>
    <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
  </header>

  <div class="admin-container">
    <div class="section-header"><h2 class="section-title">Configuración Tickets</h2></div>
    <div id="config-list"><div class="loading-state">Cargando...</div></div>
    
    <div class="section-header" style="margin-top:40px;"><h2 class="section-title">Imagen Portada (Hero)</h2></div>
    <div class="config-item">
        <input type="text" id="heroUrl" class="config-input" placeholder="URL Imagen...">
        <button onclick="saveHero()" class="btn-refresh" style="margin-top:10px; width:100%;">GUARDAR IMAGEN</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.onload = loadConfig;

    async function loadConfig() {
        const { data } = await client.from('site_config').select('*').order('key');
        const container = document.getElementById('config-list');
        container.innerHTML = '';
        
        data.forEach(c => {
            if(c.key === 'hero_image') { document.getElementById('heroUrl').value = c.value; return; }
            if(!c.key.startsWith('access_') && !c.key.startsWith('mem_')) return;

            const html = `
            <div class="config-item">
                <div class="config-header">
                    <span class="config-label">${c.label || c.key}</span>
                    <label class="switch">
                        <input type="checkbox" ${c.is_active ? 'checked' : ''} onchange="toggle('${c.key}', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
                <input type="text" class="config-input" value="${c.url||''}" onchange="updateUrl('${c.key}', this.value)" placeholder="URL Passline...">
            </div>`;
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    async function toggle(key, active) {
        await client.from('site_config').update({ is_active: active }).eq('key', key);
    }
    async function updateUrl(key, url) {
        await client.from('site_config').update({ url: url }).eq('key', key);
    }
    async function saveHero() {
        const url = document.getElementById('heroUrl').value;
        await client.from('site_config').update({ value: url }).eq('key', 'hero_image');
        alert("Imagen actualizada.");
    }
  </script>
</body>
</html>
