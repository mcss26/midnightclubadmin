<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Accesos & Config</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Botón Volver */
    .btn-back { text-decoration: none; color: #888; font-size: 12px; display: flex; align-items: center; gap: 5px; margin-bottom: 20px; font-weight: 600; }
    .btn-back:hover { color: #fff; }
    /* Ajuste para 1 columna centrada */
    .admin-container-single { max-width: 600px; margin: 90px auto 40px auto; padding: 0 20px; }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-red);">ADMIN</span> / ACCESOS</div>
    <button onclick="logout()" class="btn-logout">CERRAR SESIÓN</button>
  </header>

  <div class="admin-container-single"> <main>
      <a href="index.html" class="btn-back">← Volver al Dashboard</a>

      <div class="section-header">
        <h2 class="section-title">Tickets & Accesos Públicos</h2>
      </div>
      
      <div class="sidebar-card" id="config-list" style="margin-bottom: 40px;"> <div class="loading-state">Cargando configuración...</div>
      </div>

      <div class="section-header">
        <h2 class="section-title">Imagen de Portada (Hero)</h2>
      </div>

      <div class="sidebar-card">
        <input type="text" id="heroImgInput" class="config-input" placeholder="URL de la imagen (https://...)" autocomplete="off">
        <button onclick="saveHeroImage()" class="btn-save">GUARDAR IMAGEN</button>
        <p class="help-text">Escribe "default" para restaurar la imagen original.</p>
      </div>

    </main>
  </div>

  <script>
    // === CONFIGURACIÓN (¡COMPLETAR!) ===
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    // 👇👇👇 PEGA TU CLAVE SUPABASE AQUÍ 👇👇👇
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258'; 
    
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.addEventListener('load', () => {
      loadConfig();
      loadHeroImage();
    });

    function logout() { window.location.href = "index.html"; }

    // --- 1. CONFIGURACIÓN DE TICKETS ---
    async function loadConfig() {
      const container = document.getElementById('config-list');
      const { data: configs, error } = await client.from('site_config').select('*').order('id');
      if (error) { container.innerHTML = '<div class="error-state" style="font-size:12px;">Error cargando configuración.</div>'; return; }
      
      let html = '';
      configs.forEach(conf => {
        // Filtrar solo las keys de accesos y members
        if(conf.key.startsWith('access_') || conf.key.startsWith('mem_')) {
           html += `
            <div class="config-item">
              <div class="config-header">
                <span class="config-label">${conf.label}</span>
                <label class="switch">
                  <input type="checkbox" ${conf.is_active ? 'checked' : ''} onchange="toggleConfig('${conf.key}', this.checked)">
                  <span class="slider"></span>
                </label>
              </div>
              <input type="text" class="config-input" value="${conf.url || ''}" onchange="updateConfigUrl('${conf.key}', this.value)" placeholder="Pegar URL de Passline aquí...">
            </div>`;
        }
      });
      container.innerHTML = html || '<div class="empty-state">No hay configuraciones disponibles.</div>';
    }

    async function toggleConfig(key, isActive) {
      // Feedback visual rápido (opcional: se podría deshabilitar el switch mientras carga)
      await client.from('site_config').update({ is_active: isActive }).eq('key', key);
      console.log(`${key} ahora es ${isActive}`);
    }
    async function updateConfigUrl(key, newUrl) {
      await client.from('site_config').update({ url: newUrl }).eq('key', key);
      console.log(`URL de ${key} actualizada.`);
    }


    // --- 2. IMAGEN HERO ---
    async function loadHeroImage() {
      const { data } = await client.from('site_config').select('value').eq('key', 'hero_image').single();
      if(data) document.getElementById('heroImgInput').value = data.value;
    }
    async function saveHeroImage() {
      const btn = document.querySelector('.btn-save');
      const originalText = btn.textContent;
      btn.textContent = "GUARDANDO..."; btn.disabled = true;

      const url = document.getElementById('heroImgInput').value.trim();
      const finalUrl = (url === '' || url.toLowerCase() === 'default') ? 'default' : url;
      
      await client.from('site_config').update({ value: finalUrl }).eq('key', 'hero_image');
      
      btn.textContent = "¡GUARDADO!";
      setTimeout(() => { btn.textContent = originalText; btn.disabled = false; }, 2000);
    }
  </script>
</body>
</html>
