<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Master SKU</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
  <style>
    .input-ideal { 
        background: #000; border: 1px solid #444; color: var(--mc-accent-green); width: 60px; 
        text-align: center; padding: 8px; border-radius: 4px; font-weight: 700;
    }
    .input-ideal:focus { border-color: var(--mc-accent-green); outline: none; }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-accent-green);">DATA</span></div>
    <div style="display:flex; gap:10px;">
        <span id="roleBadge" style="font-size:10px; color:#888; padding:5px;"></span>
        <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
    </div>
  </header>

  <div class="admin-container">
    <div class="section-header">
        <div><h2 class="section-title">Master SKUs & Metas</h2><p style="color:#666; font-size:12px;">Define tu Stock Ideal</p></div>
        <div>
            <input type="file" id="fileInput" hidden accept=".xlsx,.xls" onchange="handleFile(this)">
            <button onclick="document.getElementById('fileInput').click()" class="btn-refresh">📤 IMPORTAR GBOL</button>
        </div>
    </div>

    <input type="text" id="searchSku" class="search-input-admin" placeholder="🔍 Buscar insumo..." oninput="filter()">
    
    <div class="table-responsive">
        <table class="sku-table">
            <thead>
                <tr>
                    <th>Nombre / Insumo</th>
                    <th>Categoría</th>
                    <th style="text-align:center;">Stock Ideal (Meta)</th>
                    <th style="text-align:right;">Costo Unit.</th>
                </tr>
            </thead>
            <tbody id="skuBody"></tbody>
        </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const user = localStorage.getItem('mc_admin_user');
    document.getElementById('roleBadge').innerText = user;

    let allSkus = [];

    window.onload = loadSkus;

    async function loadSkus() {
        const { data } = await client.from('inventory_skus').select('*').order('name');
        allSkus = data || []; renderTable(allSkus);
    }

    function renderTable(data) {
        const tbody = document.getElementById('skuBody');
        if(!data.length) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px;">Sin datos.</td></tr>'; return; }
        
        tbody.innerHTML = data.map(i => {
            const ideal = parseFloat(i.ideal_stock) || 0;
            const cost = new Intl.NumberFormat('es-AR', {style:'currency', currency:'ARS', maximumFractionDigits:0}).format(i.cost_price);
            
            return `
            <tr>
                <td><div style="font-weight:700; color:#fff;">${i.name}</div><div style="font-size:10px; color:#666;">ID: ${i.external_id}</div></td>
                <td><span style="background:#222; padding:2px 5px; border-radius:3px;">${i.category||'-'}</span></td>
                <td style="text-align:center;">
                    <input type="number" class="input-ideal" value="${ideal}" onchange="updateIdeal(${i.id}, this.value)" placeholder="0">
                </td>
                <td class="col-costo">${cost}</td>
            </tr>`;
        }).join('');
    }

    window.updateIdeal = async (id, val) => {
        await client.from('inventory_skus').update({ ideal_stock: val }).eq('id', id);
    }

    window.filter = () => {
        const t = document.getElementById('searchSku').value.toLowerCase();
        renderTable(allSkus.filter(i => i.name.toLowerCase().includes(t)));
    }

    // Importador GBol (Resumido para brevedad, mantener lógica original si la usas)
    async function handleFile(input) {
        // ... (Mantén tu función handleFile existente o pídeme si la necesitas de nuevo)
        alert("Función de importación lista en código previo.");
    }
  </script>
</body>
</html>
