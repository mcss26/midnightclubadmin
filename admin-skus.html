<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Master SKU</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-accent-green);">DATA</span></div>
    <div style="display:flex; gap:10px;">
        <span id="roleBadge" style="font-size:10px; color:#888; padding:5px;"></span>
        <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
    </div>
  </header>

  <div class="admin-container">
    <div class="section-header">
        <div><h2 class="section-title">Master SKUs</h2><p style="color:#666; font-size:12px;">Sincronizado con GBol</p></div>
        <div>
            <input type="file" id="fileInput" hidden accept=".xlsx,.xls" onchange="handleFile(this)">
            <button onclick="document.getElementById('fileInput').click()" class="btn-refresh">📤 IMPORTAR GBOL</button>
        </div>
    </div>

    <input type="text" id="searchSku" class="search-input-admin" placeholder="🔍 Buscar insumo...">
    
    <div id="tableContainer"><div class="loading-state">Cargando...</div></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const user = localStorage.getItem('mc_admin_user');
    const role = localStorage.getItem('mc_admin_role');
    document.getElementById('roleBadge').innerText = user;
    if(!['superadmin','admin'].includes(role)) document.body.innerHTML = '<div class="error-state">ACCESO DENEGADO</div>';

    let allSkus = [];
    window.onload = loadSkus;

    async function loadSkus() {
        const { data, error } = await client.from('inventory_skus').select('*').order('name');
        if(error) return alert(error.message);
        allSkus = data;
        renderTable(allSkus);
    }

    function renderTable(data) {
        if(!data.length) { document.getElementById('tableContainer').innerHTML = '<div class="empty-state">Sin datos.</div>'; return; }
        let html = `<table class="sku-table"><thead><tr><th>ID GBOL</th><th>Nombre</th><th>Categoría</th><th style="text-align:right">Costo</th></tr></thead><tbody>`;
        data.forEach(i => {
            const costo = new Intl.NumberFormat('es-AR', {style:'currency', currency:'ARS', maximumFractionDigits:0}).format(i.cost_price);
            html += `<tr><td style="font-family:monospace">${i.external_id}</td><td>${i.name}</td><td><span style="background:#222; padding:2px 5px; border-radius:3px;">${i.category||'-'}</span></td><td class="col-costo">${costo}</td></tr>`;
        });
        document.getElementById('tableContainer').innerHTML = html + '</tbody></table>';
    }

    document.getElementById('searchSku').oninput = (e) => {
        const t = e.target.value.toLowerCase();
        renderTable(allSkus.filter(i => i.name.toLowerCase().includes(t) || i.external_id.includes(t)));
    }

    async function handleFile(input) {
        // (El mismo código de importación SheetJS que validamos antes)
        // ... por brevedad, asumo que usas el bloque de lógica que ya funcionaba
        // o si quieres te lo pego completo aquí de nuevo.
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        document.querySelector('.btn-refresh').innerText = "PROCESANDO...";
        reader.onload = async (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                
                const processedData = jsonData.map(row => {
                    const codigo = row['Articulo'] || row['ARTICULO'];
                    const nombre = row['Detalle']  || row['DETALLE'];
                    const costo = row['Precio']    || row['PRECIO'] || 0;
                    let volumen = row['Litros'] || row['LITROS'] || 0;
                    if (volumen > 0 && volumen < 10) volumen = volumen * 1000;
                    else volumen = parseFloat(volumen);

                    if (!codigo || !nombre) return null;
                    return {
                        external_id: String(codigo), name: String(nombre).toUpperCase(),
                        cost_price: parseFloat(costo) || 0, volume_ml: volumen,
                        category: detectCategory(nombre), last_updated: new Date()
                    };
                }).filter(i => i !== null);

                if (processedData.length > 0) {
                    const { error } = await client.from('inventory_skus').upsert(processedData, { onConflict: 'external_id' });
                    if (error) throw error;
                    await client.from('admin_logs').insert({ admin_name: user, action: 'IMPORT_GBOL', details: `${processedData.length} SKUs` });
                    alert(`Importados ${processedData.length} insumos.`);
                    loadSkus();
                } else alert("Datos no encontrados.");
            } catch (err) { alert(err.message); } 
            finally { document.querySelector('.btn-refresh').innerText = "📤 IMPORTAR GBOL"; input.value = ''; }
        };
        reader.readAsArrayBuffer(file);
    }

    function detectCategory(name) {
        const n = name.toUpperCase();
        if (n.includes('FERNET')||n.includes('APEROL')||n.includes('CAMPARI')) return 'APERITIVO';
        if (n.includes('VODKA')||n.includes('SMIRNOFF')||n.includes('ABSOLUT')) return 'VODKA';
        if (n.includes('GIN')||n.includes('BOMBAY')) return 'GIN';
        if (n.includes('SPEED')||n.includes('RED BULL')) return 'ENERGIZANTE';
        return 'OTROS';
    }
  </script>
</body>
</html>
