<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Recetas</title>
  <link rel="stylesheet" href="admin-styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-accent-green);">INGENIERÍA</span></div>
    <div style="display:flex; gap:10px;">
        <span id="roleBadge" style="font-size:10px; color:#888; padding:5px;"></span>
        <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
    </div>
  </header>

  <div class="admin-container">
    <main class="recipe-container">
        
        <div style="background: var(--mc-card-bg); border: 1px solid var(--mc-border); border-radius: 8px; height: 80vh; overflow-y: auto;">
            <div style="padding: 15px; border-bottom: 1px solid #333; position: sticky; top: 0; background: #111;">
                <input type="text" id="searchMenu" class="search-input-admin" placeholder="🔍 Buscar Trago..." style="margin-bottom:0;">
            </div>
            <div id="menuList"><div class="loading-state">Cargando...</div></div>
        </div>

        <div id="recipePanel" class="recipe-panel" style="display:none;">
            <input type="hidden" id="currentItemId">
            <div style="border-bottom:1px solid #333; padding-bottom:15px; margin-bottom:20px;">
                <h2 id="currentItemName" style="font-family:'Outfit'; font-size:24px; color:#fff; margin:0;">--</h2>
                <span id="currentItemPrice" style="color:var(--mc-accent-green); font-weight:700;">--</span>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px;">
                <div class="dash-card" style="height:auto; padding:10px; text-align:center;">
                    <span style="font-size:9px; color:#888;">COSTO</span><div id="totalCost" style="font-size:16px; font-weight:700;">$0</div>
                </div>
                <div class="dash-card" style="height:auto; padding:10px; text-align:center;">
                    <span style="font-size:9px; color:#888;">MARGEN $</span><div id="grossMargin" style="font-size:16px; font-weight:700;">$0</div>
                </div>
                <div class="dash-card" style="height:auto; padding:10px; text-align:center;">
                    <span style="font-size:9px; color:#888;">RENTABILIDAD</span><div id="marginPercent" style="font-size:16px; font-weight:700;">0%</div>
                </div>
            </div>

            <h3 style="font-size:12px; color:#888; margin-top:30px;">INGREDIENTES</h3>
            <ul id="ingredientsList" style="list-style:none; padding:0; margin:0 0 20px 0;"></ul>

            <div style="position:relative;">
                <input type="text" id="skuInput" class="search-input-admin" placeholder="Agregar insumo..." autocomplete="off">
                <div id="skuResults" style="position:absolute; top:100%; left:0; width:100%; background:#1a1a1a; border:1px solid #444; z-index:10; display:none;"></div>
            </div>
            
            <div id="qtyInputContainer" style="display:none; gap:10px; margin-top:10px;">
                <input type="number" id="qtyInput" class="search-input-admin" placeholder="Cant." style="width:100px;">
                <select id="unitInput" class="search-input-admin" style="width:80px;"><option value="ml">ml</option><option value="un">un</option></select>
                <button onclick="addIngredient()" class="btn-primary" style="padding:10px; border-radius:4px;">AGREGAR</button>
            </div>
        </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const user = localStorage.getItem('mc_admin_user');
    const role = localStorage.getItem('mc_admin_role');
    document.getElementById('roleBadge').innerText = user;
    if(!['superadmin','admin','operativo'].includes(role)) document.body.innerHTML = '<div class="error-state">ACCESO DENEGADO</div>';

    let menuItems = [];
    let currentMenuItem = null, selectedSku = null;

    window.onload = async () => {
        const { data } = await client.from('menu_items').select('*').order('name');
        menuItems = data || [];
        renderMenu(menuItems);
    };

    function renderMenu(list) {
        const c = document.getElementById('menuList');
        if(!list.length) { c.innerHTML = '<div class="empty-state">Vacío</div>'; return; }
        c.innerHTML = list.map(i => `
            <div class="menu-item-row" onclick="selectItem(${i.id})">
                <div style="font-weight:700;">${i.name}</div><div style="font-family:monospace; color:#666;">$${i.price}</div>
            </div>`).join('');
    }

    async function selectItem(id) {
        currentMenuItem = menuItems.find(i => i.id === id);
        document.getElementById('recipePanel').style.display = 'block';
        document.getElementById('currentItemId').value = id;
        document.getElementById('currentItemName').innerText = currentMenuItem.name;
        document.getElementById('currentItemPrice').innerText = `Venta: $${currentMenuItem.price}`;
        loadRecipe(id);
    }

    async function loadRecipe(id) {
        const c = document.getElementById('ingredientsList');
        c.innerHTML = '<li>Cargando...</li>';
        const { data } = await client.from('recipe_ingredients').select(`id,quantity_needed,unit_needed,inventory_skus(id,name,cost_price,volume_ml)`).eq('menu_item_id', id);
        renderIngredients(data || []);
    }

    function renderIngredients(list) {
        const c = document.getElementById('ingredientsList');
        let total = 0;
        if(!list.length) { c.innerHTML = '<li style="text-align:center; color:#666; padding:20px;">Sin ingredientes.</li>'; updateMetrics(0); return; }
        
        c.innerHTML = list.map(ing => {
            const sku = ing.inventory_skus;
            let cost = 0;
            if(ing.unit_needed === 'un') cost = sku.cost_price * ing.quantity_needed;
            else if(ing.unit_needed === 'ml' && sku.volume_ml > 0) cost = (sku.cost_price / sku.volume_ml) * ing.quantity_needed;
            total += cost;
            return `<li style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px dashed #333;">
                <div>${sku.name}</div>
                <div><span style="color:#fff; font-weight:700;">${ing.quantity_needed}${ing.unit_needed}</span> <span style="font-family:monospace; color:#666;">$${Math.round(cost)}</span> <button onclick="delIng(${ing.id})" style="background:none; border:none; color:#444; cursor:pointer;">✕</button></div>
            </li>`;
        }).join('');
        updateMetrics(total);
    }

    function updateMetrics(cost) {
        const p = currentMenuItem.price;
        const m = p - cost;
        const perc = p > 0 ? ((m/p)*100).toFixed(1) : 0;
        document.getElementById('totalCost').innerText = '$'+Math.round(cost);
        document.getElementById('grossMargin').innerText = '$'+Math.round(m);
        document.getElementById('marginPercent').innerText = perc+'%';
        document.getElementById('marginPercent').style.color = perc < 50 ? 'var(--mc-red)' : 'var(--mc-accent-green)';
    }

    // Buscador SKU
    const inp = document.getElementById('skuInput');
    const res = document.getElementById('skuResults');
    inp.oninput = async (e) => {
        const t = e.target.value.trim();
        if(t.length<2) { res.style.display='none'; return; }
        const { data } = await client.from('inventory_skus').select('*').ilike('name',`%${t}%`).limit(5);
        res.innerHTML = data.map(s => `<div style="padding:10px; cursor:pointer; border-bottom:1px solid #333;" onclick="pickSku(${s.id},'${s.name.replace(/'/g,"")}')">${s.name}</div>`).join('');
        res.style.display='block';
    }

    window.pickSku = (id, name) => {
        selectedSku = id;
        inp.value = name;
        res.style.display = 'none';
        document.getElementById('qtyInputContainer').style.display = 'flex';
        document.getElementById('qtyInput').focus();
    }

    window.addIngredient = async () => {
        const qty = document.getElementById('qtyInput').value;
        const unit = document.getElementById('unitInput').value;
        if(!selectedSku || !qty) return;
        await client.from('recipe_ingredients').insert({ menu_item_id: document.getElementById('currentItemId').value, sku_id: selectedSku, quantity_needed: qty, unit_needed: unit });
        inp.value=''; document.getElementById('qtyInput').value=''; document.getElementById('qtyInputContainer').style.display='none';
        loadRecipe(document.getElementById('currentItemId').value);
    }

    window.delIng = async (id) => {
        if(confirm("¿Borrar?")) {
            await client.from('recipe_ingredients').delete().eq('id', id);
            loadRecipe(document.getElementById('currentItemId').value);
        }
    }
    document.getElementById('searchMenu').oninput = (e) => { renderMenu(menuItems.filter(i=>i.name.toLowerCase().includes(e.target.value.toLowerCase()))); }
  </script>
</body>
</html>
