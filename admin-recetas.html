<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Midnight Admin — Recetas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Layout */
    .recipe-container { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media(min-width: 768px) { .recipe-container { grid-template-columns: 350px 1fr; } }

    /* Lista Menú */
    .menu-item-row { 
        padding: 15px; border-bottom: 1px solid #222; cursor: pointer; 
        display: flex; justify-content: space-between; align-items: center;
        transition: background 0.2s; 
    }
    .menu-item-row:hover, .menu-item-row.active { background: #111; border-left: 3px solid var(--mc-accent-green); }
    .menu-price { font-family: monospace; color: #666; font-size: 11px; }

    /* Panel Receta */
    .recipe-panel { background: #111; border: 1px solid #333; border-radius: 8px; padding: 25px; display: none; }
    .recipe-header { border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
    .recipe-title { font-family: 'Outfit'; font-size: 24px; color: #fff; margin: 0; }
    
    /* Métricas */
    .cost-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .cost-box { background: #000; padding: 10px; border-radius: 6px; border: 1px solid #222; text-align: center; }
    .cost-label { display: block; font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .cost-val { font-size: 16px; font-weight: 700; color: #fff; font-family: monospace; }
    .cost-val.bad { color: var(--mc-red); }
    .cost-val.good { color: var(--mc-accent-green); }

    /* Lista Ingredientes */
    .ing-list { list-style: none; padding: 0; margin: 0; }
    .ing-item { 
        display: flex; justify-content: space-between; align-items: center; 
        padding: 10px 0; border-bottom: 1px dashed #333; font-size: 13px; 
    }
    .ing-name { color: #ccc; }
    .ing-qty { color: #fff; font-weight: 700; margin-right: 10px; }
    .ing-cost { font-family: monospace; color: #666; }
    .btn-del-ing { background: none; border: none; color: #444; cursor: pointer; font-size: 14px; }
    .btn-del-ing:hover { color: var(--mc-red); }

    /* Buscador SKU */
    .sku-search-box { position: relative; margin-top: 20px; }
    .sku-results { 
        position: absolute; top: 100%; left: 0; width: 100%; max-height: 200px; 
        overflow-y: auto; background: #1a1a1a; border: 1px solid #444; 
        z-index: 100; display: none; 
    }
    .sku-option { padding: 10px; cursor: pointer; border-bottom: 1px solid #333; font-size: 12px; }
    .sku-option:hover { background: #333; color: #fff; }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-logo">MIDNIGHT<span style="color: var(--mc-accent-green);">INGENIERÍA</span> / RECETAS</div>
    <div style="display:flex; gap:15px; align-items:center;">
        <span id="roleBadge" style="font-size:10px; border:1px solid #333; padding:4px 8px; border-radius:4px; color:#888;"></span>
        <button onclick="window.location.href='index.html'" class="btn-logout">VOLVER</button>
    </div>
  </header>

  <div class="admin-container" style="max-width: 1200px;">
    <main class="recipe-container">
        
        <div style="background: var(--mc-card-bg); border: 1px solid var(--mc-border); border-radius: 8px; height: 80vh; overflow-y: auto;">
            <div style="padding: 15px; border-bottom: 1px solid #333; position: sticky; top: 0; background: #111;">
                <input type="text" id="searchMenu" class="search-input-admin" placeholder="🔍 Buscar Trago..." style="font-size: 12px; padding: 8px;">
            </div>
            <div id="menuList">
                <div class="loading-state">Cargando carta...</div>
            </div>
        </div>

        <div id="recipePanel" class="recipe-panel">
            <input type="hidden" id="currentItemId">
            
            <div class="recipe-header">
                <h2 id="currentItemName" class="recipe-title">--</h2>
                <span id="currentItemPrice" style="color: var(--mc-accent-green); font-weight: 700;">--</span>
            </div>

            <div class="cost-grid">
                <div class="cost-box">
                    <span class="cost-label">Costo Total</span>
                    <div id="totalCost" class="cost-val">$ 0</div>
                </div>
                <div class="cost-box">
                    <span class="cost-label">Utilidad Bruta</span>
                    <div id="grossMargin" class="cost-val">$ 0</div>
                </div>
                <div class="cost-box">
                    <span class="cost-label">Rentabilidad</span>
                    <div id="marginPercent" class="cost-val">0%</div>
                </div>
            </div>

            <h3 style="font-size:12px; color:#888; text-transform:uppercase; margin-top:30px;">Ingredientes</h3>
            <ul id="ingredientsList" class="ing-list"></ul>

            <div class="sku-search-box">
                <label style="font-size:10px; color:#666; display:block; margin-bottom:5px;">AGREGAR INSUMO</label>
                <input type="text" id="skuInput" class="search-input-admin" placeholder="Escribe para buscar (ej: Fernet)..." autocomplete="off">
                <div id="skuResults" class="sku-results"></div>
            </div>
            
            <div id="qtyInputContainer" style="display:none; margin-top: 10px; gap:10px; align-items:center;">
                <input type="number" id="qtyInput" class="search-input-admin" placeholder="Cant." style="width: 100px;">
                <select id="unitInput" class="search-input-admin" style="width: 80px;">
                    <option value="ml">ml</option>
                    <option value="un">un</option>
                </select>
                <button onclick="addIngredient()" class="btn-bulk" style="background: var(--mc-accent-green); color:#000;">AGREGAR</button>
            </div>

        </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxmbrqeamwfthmatujvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bWJycWVhbXdmdGhtYXR1anZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4NzE0ODIsImV4cCI6MjA3OTQ0NzQ4Mn0.QVb2c-awM1G2G4m_ZlJD4-5LrZyqd_CDkQeCH1Xg258';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const user = localStorage.getItem('mc_admin_user') || 'Desconocido';
    const role = localStorage.getItem('mc_admin_role') || 'invitado';
    document.getElementById('roleBadge').innerText = user + ' | ' + role.toUpperCase();

    if (!['superadmin', 'admin', 'operativo'].includes(role)) {
        document.querySelector('main').innerHTML = '<div class="error-state">ACCESO DENEGADO</div>';
    }

    let menuItems = [];
    let currentMenuItem = null;
    let selectedSku = null;

    window.addEventListener('load', loadMenu);

    async function loadMenu() {
        const { data } = await client.from('menu_items').select('*').order('name');
        menuItems = data || [];
        renderMenu(menuItems);
    }

    function renderMenu(list) {
        const container = document.getElementById('menuList');
        if(list.length===0) { container.innerHTML = '<div class="empty-state">Vacío</div>'; return; }
        
        let html = '';
        list.forEach(item => {
            html += `
            <div class="menu-item-row" onclick="selectItem(${item.id})">
                <div>
                    <div style="color:#fff; font-weight:700; font-size:13px;">${item.name}</div>
                    <div class="menu-price">$${item.price}</div>
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }

    async function selectItem(id) {
        document.querySelectorAll('.menu-item-row').forEach(r => r.classList.remove('active'));
        currentMenuItem = menuItems.find(i => i.id === id);
        
        document.getElementById('recipePanel').style.display = 'block';
        document.getElementById('currentItemId').value = currentMenuItem.id;
        document.getElementById('currentItemName').innerText = currentMenuItem.name;
        document.getElementById('currentItemPrice').innerText = `Precio Venta: $${currentMenuItem.price}`;
        
        loadRecipe(id);
    }

    async function loadRecipe(menuId) {
        const container = document.getElementById('ingredientsList');
        container.innerHTML = '<li style="color:#666; font-size:12px;">Cargando...</li>';

        const { data: recipeData, error } = await client
            .from('recipe_ingredients')
            .select(`
                id, quantity_needed, unit_needed,
                inventory_skus ( id, name, cost_price, volume_ml )
            `)
            .eq('menu_item_id', menuId);

        if(error) { console.error(error); return; }
        renderIngredients(recipeData);
    }

    function renderIngredients(ingredients) {
        const container = document.getElementById('ingredientsList');
        let totalCost = 0;
        let html = '';

        if(!ingredients || ingredients.length === 0) {
            container.innerHTML = '<li style="color:#666; padding:20px; text-align:center;">Sin ingredientes.</li>';
            updateMetrics(0);
            return;
        }

        ingredients.forEach(ing => {
            const sku = ing.inventory_skus;
            if(!sku) return;

            // --- LÓGICA DE COSTEO CORREGIDA ---
            let cost = 0;
            
            if (ing.unit_needed === 'un') {
                // Si la receta pide UNIDADES (ej: 1 Botella), costo = Precio Total * Cantidad
                cost = sku.cost_price * ing.quantity_needed;
            } else if (ing.unit_needed === 'ml' && sku.volume_ml > 0) {
                // Si la receta pide ML (ej: 50ml), costo = (Precio / Volumen) * Cantidad
                const costPerMl = sku.cost_price / sku.volume_ml;
                cost = costPerMl * ing.quantity_needed;
            } else {
                // Fallback (ej: pide ml pero SKU no tiene volumen definido)
                cost = 0; 
            }
            
            totalCost += cost;

            html += `
            <li class="ing-item">
                <div>
                    <div class="ing-name">${sku.name}</div>
                    <div style="font-size:10px; color:#666;">Costo Insumo: $${sku.cost_price}</div>
                </div>
                <div style="display:flex; align-items:center;">
                    <span class="ing-qty">${ing.quantity_needed} ${ing.unit_needed}</span>
                    <span class="ing-cost">$${Math.round(cost)}</span>
                    <button class="btn-del-ing" onclick="deleteIngredient(${ing.id})" style="margin-left:15px;">✕</button>
                </div>
            </li>`;
        });

        container.innerHTML = html;
        updateMetrics(totalCost);
    }

    function updateMetrics(cost) {
        const price = currentMenuItem.price || 0;
        const margin = price - cost;
        const percent = price > 0 ? ((margin / price) * 100).toFixed(1) : 0;

        document.getElementById('totalCost').innerText = '$ ' + Math.round(cost);
        document.getElementById('grossMargin').innerText = '$ ' + Math.round(margin);
        
        const pEl = document.getElementById('marginPercent');
        pEl.innerText = percent + '%';
        pEl.className = 'cost-val ' + (percent < 50 ? 'bad' : 'good');
    }

    // Buscador SKU
    const skuInput = document.getElementById('skuInput');
    const skuResults = document.getElementById('skuResults');

    skuInput.addEventListener('input', async (e) => {
        const term = e.target.value.trim();
        if(term.length < 2) { skuResults.style.display = 'none'; return; }

        const { data } = await client.from('inventory_skus')
            .select('id, name, volume_ml, cost_price')
            .ilike('name', `%${term}%`)
            .limit(10);

        if(data && data.length > 0) {
            skuResults.innerHTML = data.map(s => `
                <div class="sku-option" onclick="selectSku(${s.id}, '${s.name.replace(/'/g,"")}')">
                    <div style="color:#fff; font-weight:700;">${s.name}</div>
                    <div style="color:#888; font-size:10px;">${s.volume_ml || '?'} ml - $${s.cost_price}</div>
                </div>
            `).join('');
            skuResults.style.display = 'block';
        } else {
            skuResults.style.display = 'none';
        }
    });

    function selectSku(id, name) {
        selectedSku = id;
        skuInput.value = name;
        skuResults.style.display = 'none';
        document.getElementById('qtyInputContainer').style.display = 'flex';
        document.getElementById('qtyInput').focus();
    }

    async function addIngredient() {
        const qty = parseFloat(document.getElementById('qtyInput').value);
        const unit = document.getElementById('unitInput').value;
        const menuId = document.getElementById('currentItemId').value;

        if(!selectedSku || !qty || !menuId) return;

        await client.from('recipe_ingredients').insert({
            menu_item_id: menuId,
            sku_id: selectedSku,
            quantity_needed: qty,
            unit_needed: unit
        });

        skuInput.value = '';
        document.getElementById('qtyInput').value = '';
        document.getElementById('qtyInputContainer').style.display = 'none';
        selectedSku = null;
        loadRecipe(menuId);
    }

    async function deleteIngredient(id) {
        if(!confirm("¿Quitar ingrediente?")) return;
        await client.from('recipe_ingredients').delete().eq('id', id);
        loadRecipe(document.getElementById('currentItemId').value);
    }

    document.getElementById('searchMenu').addEventListener('input', (e)=>{
        const term = e.target.value.toLowerCase();
        const filtered = menuItems.filter(i => i.name.toLowerCase().includes(term));
        renderMenu(filtered);
    });
  </script>
</body>
</html>
